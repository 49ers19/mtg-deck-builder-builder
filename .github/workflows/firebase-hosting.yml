name: Deploy to Firebase Hosting

# Publishes the app to Firebase Hosting on every push to master (same trigger as GitHub Pages).
on:
  push:
    branches: [ master ]
  workflow_dispatch:   # lets you also run it manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRIMOIRE_GAMES_9D13E }}
          projectId: grimoire-games-9d13e
          channelId: live
