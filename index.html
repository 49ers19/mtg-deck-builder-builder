<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Grimoire Games — MTG Deck Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f1a; --bg2:#141828; --panel:#1b2036; --panel2:#232a44;
  --line:#2c3458; --text:#e8eaf2; --muted:#8b93b8; --accent:#c9a227; --accent2:#e3c14b;
  --W:#f8f6d8; --U:#aae0fa; --B:#bcb6b0; --R:#f9a98a; --G:#9bd6a3; --C:#c8cbe0;
  --danger:#e0556b; --ok:#4caf7d;
  --safe-b:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;color:var(--text);font-family:'Inter',system-ui,sans-serif;overscroll-behavior:none;
  background:
    radial-gradient(900px 460px at 50% -14%, rgba(227,193,75,0.05), transparent 64%),
    linear-gradient(180deg,#0e0f17,#0a0b11);
  background-attachment:fixed;
}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;min-height:100dvh}
h1,h2,h3,.brand{font-family:'Cinzel',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.hidden{display:none!important}

/* Header */
header{padding:calc(env(safe-area-inset-top) + 15px) 16px 13px;background:#101119;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-size:19px;font-weight:600;letter-spacing:.4px;color:var(--accent2);display:flex;align-items:center;gap:9px}
.brand-mark{flex:none;display:block}
.sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.2px}
.hdr-actions{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:12px;display:flex;gap:6px}
.hdr-btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.hdr-btn:hover{border-color:var(--accent)}
.hdr-btn.acct{background:var(--panel2);color:var(--text);border-color:var(--line)}
.hdr-btn.disc{background:#5865F2;color:#fff;border-color:#5865F2;text-decoration:none;display:inline-flex;align-items:center;font-size:14px;padding:7px 9px}
.filt-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filt{background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:12px;padding:8px 9px;font-family:inherit}
.filt-q{flex:1 1 130px;min-width:120px}
.filt-q:focus,select.filt:focus{outline:none;border-color:var(--accent)}
.filt-clr{cursor:pointer;font-weight:700;color:var(--muted)}
select.filt{flex:0 0 auto}

/* Main scroll area */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(86px + var(--safe-b))}

/* Bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:#0d0e16;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:30}
nav button{flex:1;padding:10px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.2px;transition:color .15s}
nav button .ic{font-size:19px;line-height:1;opacity:.85}
nav button.active{color:var(--accent2)}
nav button.active .ic{opacity:1}

/* Cards / panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:4px 2px 10px}

/* Buttons */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{border-color:#3a4470}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--accent2);color:#221c04;border-color:var(--accent);font-weight:600}
.btn.gold:hover{background:#eccd5c;border-color:var(--accent2)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--bg2)}
.btn.danger{color:var(--danger);border-color:#48283a;background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.iconbtn{width:32px;height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}

/* Search input */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 42px 13px 14px;color:var(--text);font-size:15px}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.search-wrap .spin{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

/* Result card row */
.cardrow{display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:9px;align-items:center}
.cardrow .thumb{width:46px;height:64px;border-radius:6px;background:var(--bg2) center/cover;flex-shrink:0;border:1px solid var(--line)}
.cardrow .info{flex:1;min-width:0}
.cardrow .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardrow .meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pip{width:13px;height:13px;border-radius:50%;display:inline-block;font-size:9px;text-align:center;line-height:13px;font-weight:700;color:#1a1a1a}
.pip.W{background:var(--W)}.pip.U{background:var(--U)}.pip.B{background:var(--B)}.pip.R{background:var(--R)}.pip.G{background:var(--G)}.pip.C{background:var(--C)}
.qtybox{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qtybox .n{min-width:20px;text-align:center;font-weight:700;font-size:15px}
.priceset{display:flex;gap:8px;flex-wrap:wrap}
.pricecell{flex:1;min-width:72px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.pricecell .pl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pricecell .pv{font-size:16px;font-weight:600;color:var(--accent2);margin-top:2px}
.mcard{width:248px;border-radius:13px;padding:9px;background:var(--mf-deep);border:1px solid rgba(0,0,0,.6);box-shadow:0 6px 22px rgba(0,0,0,.5);color:#17150f}
.mcard-white{--mf:#f7f3e2;--mf-deep:#c9be93}.mcard-blue{--mf:#cfe4f2;--mf-deep:#5f92b3}.mcard-black{--mf:#d6d0c9;--mf-deep:#4b473f}
.mcard-red{--mf:#f3cbb6;--mf-deep:#b35c3d}.mcard-green{--mf:#cfe3c3;--mf-deep:#527d47}.mcard-gold{--mf:#f0e4b4;--mf-deep:#b39a4d}
.mcard-artifact{--mf:#dfe2e6;--mf-deep:#7f858d}.mcard-land{--mf:#e2d3ba;--mf-deep:#8c7458}
.mc-title,.mc-type{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--mf);border:1px solid rgba(0,0,0,.35);border-radius:7px;padding:5px 9px;font-weight:600}
.mc-title{margin-bottom:6px}.mc-type{margin-bottom:6px;font-size:12px}
.mc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.mc-cost{display:flex;gap:2px;flex:none}
.mpip{width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#17150f;border:1px solid rgba(0,0,0,.4)}
.mpip-W{background:#f7f3d8}.mpip-U{background:#a9d3ef}.mpip-B{background:#c7bfb7}.mpip-R{background:#eea886}.mpip-G{background:#a7cf9c}.mpip-C{background:#cdc9c0}
.mc-art{height:150px;background:#20222b center/cover;border:1px solid rgba(0,0,0,.4);border-radius:5px;margin-bottom:6px;display:flex;align-items:center;justify-content:center}
.mc-artph{color:#8a8f99;font-size:11px;text-transform:uppercase;letter-spacing:3px}
.mc-textbox{background:var(--mf);border:1px solid rgba(0,0,0,.35);border-radius:7px;padding:8px 9px;min-height:66px;font-size:12.5px;line-height:1.35}
.mc-flavor{font-style:italic;opacity:.82;margin-top:6px;border-top:1px solid rgba(0,0,0,.15);padding-top:6px}
.mc-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:9px;color:rgba(255,255,255,.85);padding:0 3px;letter-spacing:.3px}
.mc-pt{background:var(--mf);border:1px solid rgba(0,0,0,.4);border-radius:6px;padding:2px 10px;font-weight:700;color:#17150f;font-size:15px}
.mcard-sm{width:100%;padding:6px;font-size:9px;box-shadow:none}
.mcard-sm .mc-art{height:84px}.mcard-sm .mpip{width:13px;height:13px;font-size:8px}.mcard-sm .mc-name{font-size:10px}.mcard-sm .mc-textbox{min-height:34px;font-size:9px;padding:5px 6px}.mcard-sm .mc-pt{font-size:11px;padding:1px 6px}.mcard-sm .mc-type{font-size:9px}
.design-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dg-item{display:flex;flex-direction:column;align-items:stretch}

/* Deck list items */
.decktile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:border-color .12s}
.decktile:hover{border-color:#3a4470}
.decktile .col{flex:1;min-width:0}
.decktile .dn{font-weight:600;font-size:16px;font-family:'Cinzel',serif;letter-spacing:.2px}
.decktile .ds{font-size:12px;color:var(--muted);margin-top:3px}
.colorbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--bg2)}
.colorbar i{display:block;height:100%}

/* Stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}
.stat .v{font-size:22px;font-weight:600;font-family:'Cinzel',serif;color:var(--accent2)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.curve{display:flex;align-items:flex-end;gap:5px;height:90px;padding-top:8px}
.curve .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.curve .bar .fill{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;transition:height .3s}
.curve .bar .cnt{font-size:10px;color:var(--muted);font-weight:600}
.curve .bar .lbl{font-size:10px;color:var(--muted)}

/* Empty states */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:12px;opacity:.7}
.empty .big:empty{display:none}
.empty .t{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,6,12,.7);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:20px 18px calc(22px + var(--safe-b));animation:slideup .22s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:13px}
body{transition:background-image .3s}
.bgpick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:10px;padding:2px}
.bgpick-tile{height:64px;border-radius:8px;background:var(--bg2) center/cover;border:1px solid var(--line);cursor:pointer;padding:0}
.bgpick-tile.sel{outline:2px solid var(--accent2);border-color:var(--accent2)}
.mpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.mpanel.active{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
.mp-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;gap:8px}
.mp-head span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-life{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--accent2);white-space:nowrap}
.mp-life button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;width:26px;height:26px;font-size:15px}
.mp-sub{font-size:11px;color:var(--muted);margin:5px 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mboard{display:flex;flex-wrap:wrap;gap:5px;min-height:70px;background:var(--bg2);border-radius:9px;padding:6px}
.mbcard{width:46px;height:64px;border-radius:5px;background:var(--panel2) center/cover;border:1px solid var(--line);padding:0}
.mbcard.tapped{transform:rotate(18deg);opacity:.75}
.mhand{display:flex;flex-wrap:wrap;gap:6px}
.mhcard{width:58px;height:81px;border-radius:6px;background:var(--panel2) center/cover;border:1px solid var(--line);padding:0}
.turnbar{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px}
.dice-row{display:flex;gap:16px;justify-content:center;margin:14px 0}
.die{width:74px;height:74px;border-radius:14px;background:var(--panel2);border:2px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:30px;font-weight:700;color:var(--accent2)}
.die span{font-family:inherit;font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.linkchip{background:none;border:none;color:var(--accent2);text-decoration:underline;font-size:11px;padding:0;cursor:pointer;font-family:inherit}
.mbcard.mtoken{display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1.1;color:var(--accent2);text-align:center;background:var(--panel2);padding:2px;font-weight:700}
.choicebar{background:rgba(227,193,75,.09);border:1px solid var(--accent2);border-radius:12px;padding:11px;margin-bottom:10px}
.cb-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;gap:8px}
.cb-top+.mhand{margin-top:9px}
.mhcard.glow,.mbcard.glow{outline:2px solid var(--accent2);animation:glowpulse 1s ease-in-out infinite}
@keyframes glowpulse{0%,100%{box-shadow:0 0 4px 1px rgba(227,193,75,.45)}50%{box-shadow:0 0 13px 4px rgba(227,193,75,.95)}}
.pipbar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:1.5px 0}
.pipbar-d{height:100%;background:var(--accent2);border-radius:4px}
.pipbar-s{height:100%;background:#5a8bd6;border-radius:4px}
.athemetag{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11px;color:var(--text)}
.mbcard{position:relative}
.mbcard.atk{outline:2px solid #d9433f}
.mbadge{position:absolute;top:-5px;right:-5px;font-size:11px;background:var(--bg);border-radius:50%;line-height:1;padding:1px}
.manabar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:9px}
.manachip{display:inline-block;font-weight:700;font-size:11px;border-radius:5px;padding:2px 6px;margin-right:3px}
.manachip.m-W{background:#f7f6ea;color:#5a5433}.manachip.m-U{background:#a9d0f5;color:#123a5e}.manachip.m-B{background:#565660;color:#e8e6ea}.manachip.m-R{background:#e6a08a;color:#5e2317}.manachip.m-G{background:#a3c095;color:#1d3d16}.manachip.m-C{background:#c9c2be;color:#3a3632}
.cmdzone{display:flex;align-items:center;gap:9px;background:rgba(227,193,75,.09);border:1px solid var(--accent2);border-radius:10px;padding:8px;margin-bottom:9px}
.cmdzone .thumb{width:34px;height:47px;border-radius:5px;background:var(--panel2) center/cover;flex:none}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-size:15px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}

/* Detail header */
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.detail-head .back{font-size:22px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.detail-head .ttl{flex:1;font-size:19px;font-weight:700;font-family:'Cinzel',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* group header within deck */
.grp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 8px;display:flex;justify-content:space-between}
.toast{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%);background:#23304a;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.addmenu{display:flex;flex-direction:column;gap:8px}

/* Scanner */
.scanner{position:fixed;inset:0;background:#000;z-index:80;overflow:hidden}
#scanVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.scan-frame{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 18px}
.scan-guide{position:relative;width:min(80vw,330px);aspect-ratio:63/88;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan-guide .name-strip{position:absolute;top:4%;left:5%;width:78%;height:12%;border:2px solid var(--accent2);border-radius:5px;box-shadow:0 0 10px rgba(227,193,75,.5)}
.scan-hint{margin-top:18px;color:#fff;font-size:12px;text-align:center;background:rgba(0,0,0,.5);padding:7px 12px;border-radius:20px;max-width:300px;line-height:1.5}
.scan-status{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);background:rgba(20,24,40,.92);border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;z-index:5;max-width:88vw}
.mini-spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
.scan-controls{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:20px 28px calc(24px + var(--safe-b));z-index:6}
.scan-x{width:46px;height:46px;border-radius:50%;background:rgba(20,24,40,.85);border:1px solid var(--line);color:#fff;font-size:20px}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);transition:transform .1s}
.shutter:active{transform:scale(.92)}
.shutter.busy{opacity:.5;pointer-events:none}
.scan-result{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--safe-b));z-index:7;animation:slideup .2s ease}
.scan-result .scan-card{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.scan-result .scan-card .thumb{width:48px;height:67px;border-radius:6px;background:var(--bg2) center/cover;border:1px solid var(--line);flex-shrink:0}
.scan-result .scan-card .info{min-width:0}
.scan-result .scan-card .nm{font-weight:700;font-size:15px}
.scan-result .scan-card .meta{font-size:12px;color:var(--muted);margin-top:3px}
.scan-actions{display:flex;flex-direction:column;gap:9px}
.scan-input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font-size:15px}
.scan-input:focus{outline:none;border-color:var(--accent)}

/* Commander slot */
.cmd-panel{border-color:var(--accent)}
.cmd-card{display:flex;gap:11px;align-items:center}
.cmd-card .thumb{width:46px;height:64px;border-radius:6px;background:var(--bg2) center/cover;border:1px solid var(--accent);flex-shrink:0}
.cmd-card .info{flex:1;min-width:0}
.cmd-card .nm{font-weight:700;font-size:14px}
.cmd-card .meta{font-size:11px;color:var(--muted);margin-top:2px}
.cmd-empty{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--accent);background:rgba(201,162,39,.06);cursor:pointer}
.cmd-empty .cmd-plus{width:42px;height:42px;border-radius:10px;background:rgba(201,162,39,.15);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.cmd-empty .nm{font-weight:700;font-size:14px}
.pick-banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(201,162,39,.12);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.mm-spin{width:46px;height:46px;margin:6px auto 0;border:4px solid rgba(227,193,75,.25);border-top-color:var(--accent2);border-radius:50%;animation:mmspin 0.9s linear infinite}
@keyframes mmspin{to{transform:rotate(360deg)}}
.friend-mecard{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:center}
.friend-mecode{font-family:'Cinzel',serif;font-size:38px;font-weight:700;color:var(--accent2);letter-spacing:8px;margin:4px 0 12px;text-shadow:0 0 12px rgba(227,193,75,.35)}
.friend-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:9px 11px;margin-bottom:8px}
.friend-av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0d0f1a;background:linear-gradient(135deg,var(--accent2),var(--accent))}
.friend-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-banner button{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text)}
.imp-text{width:100%;min-height:150px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;line-height:1.55}
.imp-text:focus{outline:none;border-color:var(--accent)}
.precon-list{max-height:210px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;margin-top:7px;background:var(--bg2)}
.precon-row{display:flex;width:100%;text-align:left;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;background:none;color:var(--text)}
.precon-row span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.precon-row:last-child{border-bottom:none}
.precon-row:active{background:var(--panel2)}

/* Play / life counter */
.play-ctrl{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.pc-group{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.pc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.pc-btn{min-width:30px;padding:6px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:13px}
.pc-btn.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#23200a;border-color:var(--accent)}
.pcard{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.pname{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;text-align:center}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lifeval{font-family:'Cinzel',serif;font-weight:700;font-size:54px;line-height:1;min-width:90px;text-align:center}
.lifebtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-weight:700;transition:transform .05s}
.lifebtn.big{width:62px;height:62px;font-size:30px;flex-shrink:0}
.lifebtn:active{transform:scale(.94)}
.prow5{display:flex;gap:10px;margin-top:10px}
.prow5 .lifebtn{flex:1;padding:9px;font-size:14px}
.counters{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.ctr{display:flex;align-items:center;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px 4px}
.ctr.cmd{border-color:var(--c)}
.ctr-lbl{font-size:11px;font-weight:700;color:var(--muted);padding:0 3px}
.ctr.cmd .ctr-lbl{color:var(--c)}
.ctr button{width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.ctr-n{min-width:18px;text-align:center;font-weight:700;font-size:14px}
.ctr.danger{border-color:var(--danger)}
.ctr.danger .ctr-n{color:var(--danger)}

/* Solo playtest */
.game-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.game-top .ttl{flex:1;font-family:'Cinzel',serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-badge{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--accent2);flex-shrink:0}
.game-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gcount{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.gcount b{color:var(--text);font-size:14px}
.zone{margin-bottom:12px}
.zone.bf{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:84px}
.zone-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.zone-cards{display:flex;flex-wrap:wrap;gap:6px}
.gcard{position:relative;width:48px;height:67px;border-radius:5px;background:var(--bg2) center/cover;border:1px solid var(--line);cursor:pointer;flex-shrink:0;transition:transform .08s}
.gcard-ctr{position:absolute;bottom:2px;right:2px;background:var(--ok);color:#0d0f1a;font-size:8px;font-weight:800;padding:1px 3px;border-radius:4px;line-height:1.1}
.gcard-dmg{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:8px;font-weight:800;padding:1px 3px;border-radius:4px;line-height:1.1}
.gcard-sick{position:absolute;top:2px;left:2px;font-size:11px;line-height:1;filter:drop-shadow(0 1px 2px #000)}
.gcard:active{transform:scale(1.05)}
.gcard.tapped{opacity:.45;filter:grayscale(.6);transform:rotate(10deg)}
.gcard.target-ok{outline:2px solid var(--accent2);box-shadow:0 0 10px rgba(227,193,75,.6);cursor:pointer;animation:tgtpulse 1s ease-in-out infinite}
@keyframes tgtpulse{0%,100%{box-shadow:0 0 6px rgba(227,193,75,.5)}50%{box-shadow:0 0 16px rgba(227,193,75,.95)}}
.gcard.noimg{display:flex;align-items:center;justify-content:center;padding:3px;background:var(--panel2)}
.gcard-lbl{font-size:8px;line-height:1.1;font-weight:700;color:var(--text);text-align:center;overflow:hidden}
.card-text{font-size:12px;line-height:1.5;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px;max-height:170px;overflow-y:auto;white-space:pre-wrap}
.abil{display:flex;align-items:flex-start;gap:8px;text-align:left;white-space:normal;font-weight:500;font-size:12px;line-height:1.45;padding:10px 12px;margin-bottom:7px}
.abil-tag{flex:0 0 auto;font-size:9px;font-weight:800;color:var(--muted);background:rgba(139,147,184,.15);border-radius:4px;padding:2px 5px;margin-top:1px;white-space:nowrap}
.tag-use{color:#23200a;background:var(--accent2)}
.abil-info{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.45;padding:10px 12px;margin-bottom:7px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.opp-panel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#2a1d22,#1b1518);border:1px solid var(--danger);border-radius:14px;padding:11px 13px;margin-bottom:12px}
.opp-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.opp-v{font-family:'Cinzel',serif;font-weight:700;font-size:30px;color:var(--danger);line-height:1.1}
.opp-v.dead{color:var(--ok)}
.opp-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.phase-bar{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ph{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 3px;white-space:nowrap;text-transform:uppercase;letter-spacing:.2px}
.ph.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#23200a;border-color:var(--accent)}
.mana-bar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.mana{flex:1;min-width:42px;border:1px solid var(--line);border-radius:8px;padding:7px 4px;font-size:12px;font-weight:700;color:#1a1a1a;display:flex;align-items:center;justify-content:center;gap:3px}
.mana b{font-size:13px}
.mana-W{background:var(--W)}.mana-U{background:var(--U)}.mana-B{background:var(--B)}.mana-R{background:var(--R)}.mana-G{background:var(--G)}.mana-C{background:var(--C)}
.mana-clr{flex:0 0 auto;min-width:36px;background:var(--panel2);color:var(--muted);border-color:var(--line)}
.mana:active{transform:scale(.95)}
</style>

    <polygon points="50,20 67.6,74.3 21.5,40.7 78.5,40.7 32.4,74.3" fill="none" stroke="#c9a227" stroke-width="0.9" opacity="0.45"/>
    <polygon points="50,42 57,50 50,58 43,50" fill="#e3c14b" stroke="#c9a227" stroke-width="0.8"/>
    <circle cx="50" cy="20" r="7.5" fill="#f4efd8" stroke="#c9a227" stroke-width="1"/>
    <circle cx="78.5" cy="40.7" r="7.5" fill="#3a6ea5" stroke="#c9a227" stroke-width="1"/>

  </svg>Grimoire Games</div>
  <div class="sub" id="subtitle">Magic: The Gathering deck builder &amp; collection</div>

    <a href="https://discord.gg/EMkDaZKH2" target="_blank" rel="noopener" class="hdr-btn disc" title="Join our Discord">Discord</a>

<main id="main"></main>

<nav>
  <button data-tab="decks" class="active">Decks</button>
  <button data-tab="search">Search</button>
  <button data-tab="collection">Collection</button>
  <button data-tab="meta">Meta</button>
  <button data-tab="play">Play</button>
  <button data-tab="friends">Friends</button>
  <button data-tab="analyze">Analyze</button>
  <button data-tab="design">Design</button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ============================================================
//  GRIMOIRE GAMES — MTG deck builder + collection tracker
//  Single-file app. Data in localStorage. Cards via Scryfall.
// ============================================================
const $ = (s,el=document)=>el.querySelector(s);
const main = $('#main'), modalRoot = $('#modalRoot'), toastRoot = $('#toastRoot');

// ---------- Persistence ----------
const DB = {
  load(){
    try{
      return {
        decks: JSON.parse(localStorage.getItem('pdb_decks')||'[]'),
        collection: JSON.parse(localStorage.getItem('pdb_collection')||'{}'),
        cards: JSON.parse(localStorage.getItem('pdb_cards')||'{}'),
        wishlist: JSON.parse(localStorage.getItem('pdb_wishlist')||'{}'),
        friends: JSON.parse(localStorage.getItem('pdb_friends')||'[]'),
        bg: localStorage.getItem('pdb_bg')||'',
      };
    }catch(e){ return {decks:[],collection:{},cards:{},wishlist:{},friends:[],bg:''}; }
  },
  save(){
    localStorage.setItem('pdb_decks', JSON.stringify(state.decks));
    localStorage.setItem('pdb_collection', JSON.stringify(state.collection));
    localStorage.setItem('pdb_cards', JSON.stringify(state.cards));
    localStorage.setItem('pdb_wishlist', JSON.stringify(state.wishlist));
    localStorage.setItem('pdb_friends', JSON.stringify(state.friends));
    localStorage.setItem('pdb_bg', state.bgArt||'');
    if(state.user && !window._applyingRemote) scheduleCloudPush();
  }
};
const loaded = DB.load();
const state = {
  tab:'decks',
  decks: loaded.decks,        // [{id,name,format,cards:{cardId:qty}}]
  collection: loaded.collection, // {cardId:qty}
  cards: loaded.cards,        // {cardId:{cached card fields}}
  wishlist: loaded.wishlist||{}, // {cardId:1}
  friends: loaded.friends||[],   // [{name, code}]
  bgArt: loaded.bg||'',          // art_crop url used as the app background

  collMode: 'owned',
  openDeckId: null,
  searchResults: [],
  searchQuery: '',
  play: { count:2, start:40, life:[40,40], poison:[0,0], cmd:[[0,0],[0,0]], mode:'life' },
  game: null,
  targeting: null,
  matchmaking: null,
  session: null,
  collFilter: { q:'', type:'', color:'', cmc:'', rarity:'' },
  analyzeDeckId: null,
  analyzeRecs: {},
  analyzeOwnedOnly: false,
  meta: null, metaDeck: null,
  buyStore: (localStorage.getItem('pdb_store')||'tcg'),
  customCards: (function(){ try{ return JSON.parse(localStorage.getItem('pdb_customcards')||'[]'); }catch(e){ return []; } })(),
  designerDraft: null,
  cardSkins: (function(){ try{ return JSON.parse(localStorage.getItem('pdb_skins')||'{}'); }catch(e){ return {}; } })(),
  designMode: 'custom', reskinDraft: null, reskinQuery: '',
  user: null,
};

const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ---------- Card cache helper ----------
function cacheCard(c){
  if(!state.cards[c.id]){
    state.cards[c.id] = {
      id:c.id, name:c.name, mana_cost:c.mana_cost||'', cmc:c.cmc||0,
      type_line:c.type_line||'', colors:c.colors||c.color_identity||[],
      img: (c.image_uris&&c.image_uris.normal) || (c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.normal) || '',
      thumb:(c.image_uris&&c.image_uris.small) || (c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.small) || '',
      set:(c.set||'').toUpperCase(), rarity:c.rarity||'', price:(c.prices&&c.prices.usd)||null,
      produced:c.produced_mana||[],
      text: oracleText(c),
      ci: c.color_identity||[],
      power: (c.power!=null?c.power:(c.card_faces&&c.card_faces[0]&&c.card_faces[0].power))||null,
      toughness: (c.toughness!=null?c.toughness:(c.card_faces&&c.card_faces[0]&&c.card_faces[0].toughness))||null,
      legal: c.legalities||{},
      tcg: (c.purchase_uris&&c.purchase_uris.tcgplayer)||null,
    };
  }
  return state.cards[c.id];
}
function oracleText(c){ if(c.oracle_text!=null) return c.oracle_text; if(c.card_faces) return c.card_faces.map(f=>f.oracle_text||'').join(' // '); return ''; }
const card = id => state.cards[id];

// ---------- Toast ----------
let toastT;
function toast(msg){
  toastRoot.innerHTML=''; const d=document.createElement('div'); d.className='toast'; d.textContent=String(msg==null?'':msg); toastRoot.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(()=>toastRoot.innerHTML='',1600);
}

// ---------- Mana pip rendering ----------
const COLOR_NAMES={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green',C:'Colorless'};
function pips(colors){
  if(!colors||!colors.length) return '<span class="pips"><span class="pip C">◇</span></span>';
  return '<span class="pips">'+colors.map(c=>`<span class="pip ${c}">${c}</span>`).join('')+'</span>';
}

// ---------- Scryfall ----------
let searchTimer, searchSeq=0;
async function scrySearch(q){
  const seq = ++searchSeq;
  if(!q.trim()){ state.searchResults=[]; if(state.tab==='search') renderSearchList(); return; }
  setSearchLoading(true);
  try{
    const query = (state.pickCommanderFor||state.generateMode) ? '('+q+') is:commander' : q;
    const r = await fetch('https://api.scryfall.com/cards/search?unique=cards&order=name&q='+encodeURIComponent(query));
    if(seq!==searchSeq) return; // stale
    if(r.status===404){ state.searchResults=[]; }
    else{ const d = await r.json(); state.searchResults = (d.data||[]).slice(0,40); }
  }catch(e){ state.searchResults=[]; toast('Network error'); }
  if(seq===searchSeq){ setSearchLoading(false); if(state.tab==='search') renderSearchList(); }
}
function setSearchLoading(b){
  const sp = $('#searchSpin'); if(sp) sp.classList.toggle('hidden',!b);
}

// ============================================================
//  RENDER
// ============================================================
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='decks') state.openDeckId ? renderDeckDetail() : renderDecks();
  else if(state.tab==='search') renderSearch();
  else if(state.tab==='collection') renderCollection();
  else if(state.tab==='meta') renderMeta();
  else if(state.tab==='play') renderPlay();
  else if(state.tab==='friends') renderFriends();
  else if(state.tab==='analyze') renderAnalyze();
  else if(state.tab==='design') renderDesign();
  $('#subtitle').textContent = ({
    decks:'Your decks', search:'Find cards on Scryfall', collection:'Cards you own', play:'Life counter & playtest', friends:'Play with your friends', analyze:'Deck analysis'
  })[state.tab] || '';
}

// ---------- DECKS LIST ----------
function deckColorCounts(deck){
  const counts={W:0,U:0,B:0,R:0,G:0,C:0}; let total=0;
  const tally=(id,q)=>{
    const c=card(id); if(!c) return;
    const cols=c.colors&&c.colors.length?c.colors:['C'];
    cols.forEach(col=>{counts[col]=(counts[col]||0)+q; total+=q;});
  };
  for(const id in deck.cards) tally(id, deck.cards[id]);
  if(deck.commander) tally(deck.commander, 1);
  return {counts,total};
}
function deckCardCount(deck){ let n=deck.commander?1:0; for(const id in deck.cards) n+=deck.cards[id]; return n; }

function renderDecks(){
  let h = `<div class="row between" style="margin-bottom:14px">
      <div class="section-title" style="margin:0">Your Decks (${state.decks.length})</div>
      <div style="display:flex;gap:6px">
        <button class="btn sm" onclick="startGenerate()">Build</button>
        <button class="btn sm" onclick="openImport()">Import</button>
        <button class="btn gold sm" onclick="openDeckModal()">＋ New</button>
      </div>
    </div>`;

  } else {

        `<i style="width:${(counts[k]/total*100).toFixed(1)}%;background:var(--${k})"></i>`).join('') : '<i style="width:100%;background:var(--line)"></i>';
      const cmd = d.commander && card(d.commander);

      h += `<div class="decktile" onclick="openDeck('${d.id}')">
        <div class="col">
          <div class="dn">${esc(d.name)}</div>

          <div class="colorbar">${bar}</div>
        </div>
        <div style="font-size:22px;color:var(--muted)">›</div>

    });
  }
  main.innerHTML = h;
}

// ---------- DECK DETAIL ----------
function renderDeckDetail(){
  const d = state.decks.find(x=>x.id===state.openDeckId);
  if(!d){ state.openDeckId=null; return renderDecks(); }
  const n = deckCardCount(d);
  const {counts,total}=deckColorCounts(d);

  // mana curve (nonland)
  const buckets=[0,0,0,0,0,0,0,0]; // 0..6, 7+
  let lands=0, avgNum=0, avgDen=0;
  for(const id in d.cards){
    const c=card(id); if(!c) continue;
    const q=d.cards[id];
    if(/\bLand\b/.test(c.type_line)){ lands+=q; continue; }
    const b=Math.min(7,Math.floor(c.cmc||0));
    buckets[b]+=q; avgNum+=(c.cmc||0)*q; avgDen+=q;
  }
  const maxB = Math.max(1,...buckets);
  const avg = avgDen? (avgNum/avgDen).toFixed(2) : '0.00';

  // group cards by type
  const groups = groupDeckCards(d);

  // commander slot (Commander format only)
  let commanderHTML = '';
  if(d.format==='Commander'){
    if(d.commander){
      const cc=card(d.commander);
      commanderHTML = `<div class="panel cmd-panel">
        <div class="section-title" style="margin-top:0">Commander</div>
        <div class="cmd-card">
          <div class="thumb" style="background-image:url('${cc?cc.thumb:''}')" onclick="showCard('${d.commander}')"></div>
          <div class="info" onclick="showCard('${d.commander}')">
            <div class="nm">${cc?esc(cc.name):'—'} ${cc?pips(cc.colors&&cc.colors.length?cc.colors:['C']):''}</div>
            <div class="meta">${cc?esc(shortType(cc.type_line)):''}</div>
          </div>
          <button class="btn ghost sm" onclick="startPickCommander('${d.id}')">Change</button>
          <button class="iconbtn" onclick="removeCommander('${d.id}')">✕</button>
        </div>
      </div>`;
    } else {
      commanderHTML = `<div class="panel cmd-empty" onclick="startPickCommander('${d.id}')">
        <div class="cmd-plus">＋</div>
        <div><div class="nm">Set your commander</div><div class="tiny muted">Pick the legendary creature that leads this deck</div></div>
      </div>`;
    }
  }

  let h = `<div class="detail-head">
      <button class="back" onclick="closeDeck()">‹</button>
      <div class="ttl">${esc(d.name)}</div>
      <button class="iconbtn" onclick="openDeckModal('${d.id}')">✎</button>
    </div>
    ${commanderHTML}
    <div class="statgrid">
      <div class="stat"><div class="v">${n}</div><div class="l">Cards</div></div>
      <div class="stat"><div class="v">${lands}</div><div class="l">Lands</div></div>
      <div class="stat"><div class="v">${avg}</div><div class="l">Avg CMC</div></div>
    </div>
    <button class="btn gold full" style="margin-bottom:8px" onclick="startAddingTo('${d.id}')">＋ Add cards to this deck</button>
    <button class="btn full" style="margin-bottom:12px" onclick="exportDeck('${d.id}')">Export / share deck</button>`;

  // color identity bar
  if(total){
    h += `<div class="panel"><div class="section-title" style="margin-top:0">Color Breakdown</div><div class="row" style="flex-wrap:wrap;gap:10px">`;
    Object.keys(counts).filter(k=>counts[k]).forEach(k=>{
      h+=`<div class="row" style="gap:5px">${pips([k])}<span class="tiny muted">${COLOR_NAMES[k]} ${counts[k]}</span></div>`;
    });
    h+=`</div></div>`;
  }

  // mana curve
  if(avgDen){
    h += `<div class="panel"><div class="section-title" style="margin-top:0">Mana Curve</div><div class="curve">`;
    buckets.forEach((cnt,i)=>{
      h+=`<div class="bar"><span class="cnt">${cnt||''}</span><div class="fill" style="height:${cnt/maxB*100}%"></div><span class="lbl">${i===7?'7+':i}</span></div>`;
    });
    h+=`</div></div>`;
  }

  // card list grouped
  if(!n){
    h += `<div class="empty"><div class="big"></div><div class="t">No cards yet</div>
      <div class="tiny">Add the rest of your deck — search and tap ＋.</div>
      <button class="btn gold full" style="margin-top:16px" onclick="startAddingTo('${d.id}')">Add cards</button></div>`;
  } else {
    for(const g of groups){
      h += `<div class="grp"><span>${g.name}</span><span>${g.count}</span></div>`;
      g.items.forEach(({id,qty})=>{
        const c=card(id); if(!c) return;
        h += cardRowHTML(c, qty, `deckQty('${d.id}','${id}',-1)`, `deckQty('${d.id}','${id}',1)`);
      });
    }
  }
  main.innerHTML = h;
}

function groupDeckCards(d){
  const order=['Creature','Planeswalker','Instant','Sorcery','Artifact','Enchantment','Land','Other'];
  const map={}; order.forEach(o=>map[o]=[]);
  for(const id in d.cards){
    const c=card(id); if(!c) continue;
    const t=c.type_line||'';
    let g='Other';
    for(const o of order){ if(o!=='Other' && new RegExp('\\b'+o+'\\b').test(t)){ g=o; break; } }
    map[g].push({id,qty:d.cards[id]});
  }
  return order.filter(o=>map[o].length).map(o=>({
    name:o==='Other'?'Other':o+'s',
    count:map[o].reduce((s,x)=>s+x.qty,0),
    items:map[o].sort((a,b)=>card(a.id).name.localeCompare(card(b.id).name))
  }));
}

// ---------- META: most-played commanders (via EDHREC) + how much of each you own ----------
async function loadMeta(){
  state.meta={status:'loading'}; if(state.tab==='meta') renderMeta();
  try{
    const r=await fetch('https://json.edhrec.com/pages/commanders/week.json'); const j=await r.json();
    const list=(((j.container||{}).json_dict||{}).cardlists||[])[0]||{}; const cvs=list.cardviews||[];
    const commanders=cvs.map(c=>({ name:c.name, decks:c.num_decks||0, slug:(c.url||'').replace(/^\/commanders\//,'').replace(/^\//,'') })).filter(c=>c.slug);
    state.meta={status:'ok', commanders};
  }catch(e){ state.meta={status:'error'}; }
  if(state.tab==='meta') renderMeta();
}
function renderMeta(){
  if(state.metaDeck) return renderMetaDeck();
  const m=state.meta;
  if(!m){ main.innerHTML=`<div class="section-title">Competitive meta</div><div class="tiny muted"><span class="mini-spin"></span> Loading the current meta…</div>`; loadMeta(); return; }
  if(m.status==='loading'){ main.innerHTML=`<div class="section-title">Competitive meta</div><div class="tiny muted"><span class="mini-spin"></span> Loading the current meta…</div>`; return; }
  if(m.status==='error'||!m.commanders){ main.innerHTML=`<div class="section-title">Competitive meta</div><div class="tiny muted">Couldn’t load the meta — needs internet.</div><button class="btn full" style="margin-top:10px" onclick="loadMeta()">Retry</button>`; return; }
  const max=(m.commanders[0]&&m.commanders[0].decks)||1;
  let h=`<div class="section-title">Top commanders this week</div><div class="tiny muted" style="margin:-4px 2px 10px">Ranked by decks registered on EDHREC. Tap one to see how much of it you own.</div>
    <button class="btn full" style="margin-bottom:12px" onclick="randomCommander()">Surprise me — random commander</button>`;
  m.commanders.slice(0,40).forEach((c,i)=>{
    h+=`<div class="decktile" onclick='openMetaDeck(${JSON.stringify(c.slug)},${JSON.stringify(c.name)})'><div class="col"><div class="dn">${i+1}. ${esc(c.name)}</div><div class="ds">${c.decks.toLocaleString()} decks</div><div class="colorbar" style="margin-top:8px"><i style="width:${(c.decks/max*100).toFixed(0)}%;background:var(--accent)"></i></div></div><div style="font-size:20px;color:var(--muted)">›</div></div>`;
  });
  main.innerHTML=h;
}
async function openMetaDeck(slug, name){
  state.metaDeck={slug, name, status:'loading'}; if(state.tab==='meta') renderMeta();
  try{
    const r=await fetch('https://json.edhrec.com/pages/commanders/'+slug+'.json'); const j=await r.json();
    const lists=(((j.container||{}).json_dict||{}).cardlists||[]); const seen=new Set(), cards=[];
    const BASICS=new Set(['plains','island','swamp','mountain','forest','wastes']);
    lists.forEach(l=>{ (l.cardviews||[]).forEach(cv=>{ const nm=cv.name; if(nm && !seen.has(nm) && !BASICS.has(nm.toLowerCase())){ seen.add(nm); cards.push({name:nm, inc:cv.num_decks||cv.inclusion||0}); } }); });
    cards.sort((a,b)=>(b.inc||0)-(a.inc||0));
    state.metaDeck={slug, name, status:'ok', cards:cards.slice(0,99)};
  }catch(e){ state.metaDeck={slug, name, status:'error'}; }
  if(state.tab==='meta') renderMeta();
}
function closeMetaDeck(){ state.metaDeck=null; renderMeta(); }
async function randomCommander(){ toast('Finding a commander…'); try{ const r=await fetch('https://api.scryfall.com/cards/random?q='+encodeURIComponent('is:commander legal:commander')); if(!r.ok) throw 0; const c=await r.json(); if(c&&c.name){ cacheCard(c); setTab('meta'); openMetaDeck(slugify(c.name), c.name); } }catch(e){ toast('Couldn’t fetch a random commander'); } }

function updateDesignPreview(){ const el=$('#cardPreview'); if(el) el.innerHTML=cardPreviewHTML(state.designerDraft); }
function designField(k,v){ if(!state.designerDraft) state.designerDraft=blankDraft(); state.designerDraft[k]=v; updateDesignPreview(); }
function setDesignFrame(f){ if(!state.designerDraft) state.designerDraft=blankDraft(); state.designerDraft.frame=f; renderDesign(); }
function designArt(input){ const f=input&&input.files&&input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=620; let w=img.width,h=img.height; if(w>max){ h=Math.round(h*max/w); w=max; } const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); state.designerDraft.art=cv.toDataURL('image/jpeg',0.82); updateDesignPreview(); };
    img.onerror=()=>toast('Couldn’t read that image'); img.src=String(r.result); };

function saveDesignCard(){ const d=state.designerDraft; if(!d||!d.name.trim()){ toast('Give your card a name first'); return; }
  if(d.id){ const i=state.customCards.findIndex(c=>c.id===d.id); if(i>=0) state.customCards[i]={...d}; else state.customCards.unshift({...d}); }
  else { d.id=uid(); state.customCards.unshift({...d}); }

function editDesignCard(id){ const c=state.customCards.find(x=>x.id===id); if(c){ state.designerDraft={...c}; renderDesign(); window.scrollTo(0,0); } }
function deleteDesignCard(id){ if(!confirm('Delete this custom card?')) return; state.customCards=state.customCards.filter(c=>c.id!==id); if(state.designerDraft&&state.designerDraft.id===id) state.designerDraft=blankDraft(); saveCustomCards(); renderDesign(); }

function saveSkins(){ try{ localStorage.setItem('pdb_skins', JSON.stringify(state.cardSkins)); }catch(e){ toast('Storage full — remove an alt art or use smaller images'); } }
function skinThumb(id){ const s=state.cardSkins[id]; return (s&&s.art)||((card(id)||{}).thumb)||''; }
function skinName(id){ const s=state.cardSkins[id]; return (s&&s.name)||((card(id)||{}).name)||''; }
function frameForCard(c){ const t=(c&&c.type_line||'').toLowerCase(); if(/\bland\b/.test(t)) return 'land'; const cols=(c&&c.colors)||[]; if(cols.length>=2) return 'gold'; if(cols.length===1) return {W:'white',U:'blue',B:'black',R:'red',G:'green'}[cols[0]]||'artifact'; if(/artifact/.test(t)) return 'artifact'; return 'artifact'; }
function skinToCard(id, art, name){ const c=card(id)||{}; const pt=(c.power!=null&&c.toughness!=null)?(c.power+'/'+c.toughness):''; return { name: name||c.name||'', cost: c.mana_cost||'', type: c.type_line||'', text: c.text||'', flavor:'', pt, art: (art!=null?art:skinThumb(id)), frame: frameForCard(c) }; }
function setDesignMode(m){ state.designMode=m; renderDesign(); }
function reskinResultsHTML(){
  const q=(state.reskinQuery||'').toLowerCase();
  const owned=Object.keys(state.collection).filter(id=>state.collection[id]>0).map(id=>card(id)).filter(Boolean);
  if(!owned.length) return `<div class="empty"><div class="t">No cards in your collection</div><div class="tiny">Add cards to your collection, then reskin them here.</div></div>`;
  const matches=owned.filter(c=>!q||c.name.toLowerCase().includes(q)).slice(0,40);
  if(!matches.length) return `<div class="tiny muted" style="padding:10px">No cards match.</div>`;
  return matches.map(c=>`<div class="cardrow" onclick="pickReskin('${c.id}')" style="cursor:pointer"><div class="thumb" style="background-image:url('${skinThumb(c.id)}')"></div><div class="info"><div class="nm">${esc(skinName(c.id))}</div><div class="meta">${esc(shortType(c.type_line))}${state.cardSkins[c.id]?' · reskinned':''}</div></div></div>`).join('');
}

    h+=`<label class="btn ghost full" style="margin-bottom:10px;cursor:pointer">${dr.art?'Change art':'Upload custom art'}<input type="file" accept="image/*" style="display:none" onchange="reskinArt(this)"></label>`;
    h+=`<div class="field"><label>Display name (optional)</label><input class="scan-input" value="${esc(dr.name||'')}" oninput="reskinField(this.value)" placeholder="${esc(c.name||'')}" autocomplete="off"></div>`;

  } else {
    h+=`<div class="search-wrap"><input id="reskinSearch" placeholder="Search your collection…" value="${esc(state.reskinQuery||'')}" oninput="reskinSearch(this.value)" autocomplete="off"></div><div id="reskinResults">${reskinResultsHTML()}</div>`;

function pickReskin(id){ const s=state.cardSkins[id]||{}; state.reskinDraft={cardId:id, art:s.art||null, name:s.name||''}; renderDesign(); window.scrollTo(0,0); }
function reskinField(v){ if(state.reskinDraft){ state.reskinDraft.name=v; const el=$('#cardPreview'); if(el) el.innerHTML=cardPreviewHTML(skinToCard(state.reskinDraft.cardId, state.reskinDraft.art, state.reskinDraft.name)); } }
function reskinArt(input){ const f=input&&input.files&&input.files[0]; if(!f||!state.reskinDraft) return; const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=620; let w=img.width,h=img.height; if(w>max){ h=Math.round(h*max/w); w=max; } const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); state.reskinDraft.art=cv.toDataURL('image/jpeg',0.82); const el=$('#cardPreview'); if(el) el.innerHTML=cardPreviewHTML(skinToCard(state.reskinDraft.cardId, state.reskinDraft.art, state.reskinDraft.name)); }; img.onerror=()=>toast('Couldn’t read that image'); img.src=String(r.result); };

function saveReskin(){ const dr=state.reskinDraft; if(!dr) return; if(!dr.art && !(dr.name&&dr.name.trim())){ toast('Add custom art or a name first'); return; }

function deleteReskin(id){ if(!confirm('Remove this alternate art?')) return; delete state.cardSkins[id]; if(state.reskinDraft&&state.reskinDraft.cardId===id) state.reskinDraft=null; saveSkins(); renderDesign(); }
function renderMetaDeck(){
  const d=state.metaDeck;
  let head=`<div class="detail-head"><button class="back" onclick="closeMetaDeck()">‹</button><div class="ttl">${esc(d.name)}</div></div>`;
  if(d.status==='loading'){ main.innerHTML=head+`<div class="tiny muted"><span class="mini-spin"></span> Building a typical decklist…</div>`; return; }
  if(d.status==='error'||!d.cards||!d.cards.length){ main.innerHTML=head+`<div class="tiny muted">Couldn’t load this deck.</div>`; return; }
  const owned=new Set(Object.keys(state.collection).filter(id=>state.collection[id]>0).map(id=>((card(id)||{}).name||'').toLowerCase()));
  const have=d.cards.filter(c=>owned.has(c.name.toLowerCase()));
  const missing=d.cards.filter(c=>!owned.has(c.name.toLowerCase()));
  const pct=Math.round(have.length/d.cards.length*100);
  let h=head+`<div class="statgrid"><div class="stat"><div class="v">${pct}%</div><div class="l">You own</div></div><div class="stat"><div class="v">${have.length}</div><div class="l">Owned</div></div><div class="stat"><div class="v">${missing.length}</div><div class="l">Missing</div></div></div>`;
  h+=`<div class="colorbar" style="height:8px;margin-bottom:12px"><i style="width:${pct}%;background:var(--accent2)"></i></div>`;
  if(missing.length) h+=`<a class="btn gold full" style="margin-bottom:12px" href="${tcgMassLink(missing.map(c=>c.name))}" target="_blank" rel="noopener">Buy the ${missing.length} missing on TCGplayer</a>`;
  h+=`<div class="tiny muted" style="margin:0 2px 10px">A typical build of this commander (top ${d.cards.length} cards on EDHREC). Ownership is matched against your collection by name.</div>`;
  h+=`<div class="section-title">Missing cards (${missing.length})</div>`;
  missing.forEach(c=>{ h+=`<div class="cardrow"><div class="info"><div class="nm">${esc(c.name)}</div></div><a class="btn gold sm" href="${tcgLink({name:c.name})}" target="_blank" rel="noopener">TCG</a><a class="btn sm" href="${ckLink({name:c.name})}" target="_blank" rel="noopener">CK</a></div>`; });
  if(have.length){ h+=`<div class="section-title" style="margin-top:14px">You already own (${have.length})</div>`; have.forEach(c=>{ h+=`<div class="cardrow"><div class="info"><div class="nm" style="color:var(--ok)">${esc(c.name)}</div></div></div>`; }); }
  main.innerHTML=h;

function renderCollection(){
  const cmode=state.collMode||'owned';
  const toggle=`<div class="play-ctrl" style="margin-bottom:12px"><div class="pc-group">
      <button class="pc-btn ${cmode==='owned'?'on':''}" onclick="setCollMode('owned')">Owned</button>
      <button class="pc-btn ${cmode==='wishlist'?'on':''}" onclick="setCollMode('wishlist')">Wishlist</button>
    </div></div>`;
  if(cmode==='wishlist'){ main.innerHTML = toggle + wishlistHTML(); return; }
  const f=state.collFilter;
  const ids = Object.keys(state.collection).filter(id=>state.collection[id]>0);
  let totalCards=0, totalVal=0; const unique=ids.length;
  ids.forEach(id=>{ totalCards+=state.collection[id]; const p=card(id)?.price; if(p) totalVal+=parseFloat(p)*state.collection[id]; });
  const fq=f.q.toLowerCase().trim();
  let shown = ids.filter(id=>{
    const c=card(id); if(!c) return false;
    if(fq && !c.name.toLowerCase().includes(fq)) return false;
    if(f.type && !new RegExp('\\b'+f.type+'\\b','i').test(c.type_line||'')) return false;
    if(f.color){ const cols=c.colors||[]; if(f.color==='C'){ if(cols.length) return false; } else if(f.color==='M'){ if(cols.length<2) return false; } else if(!cols.includes(f.color)) return false; }
    if(f.cmc!==''){ const cmc=Math.floor(c.cmc||0); if(f.cmc==='7'){ if(cmc<7) return false; } else if(cmc!==+f.cmc) return false; }
    if(f.rarity && (c.rarity||'')!==f.rarity) return false;
    return true;
  });
  shown.sort((a,b)=> (card(a).cmc||0)-(card(b).cmc||0) || card(a).name.localeCompare(card(b).name));

  let h = `<div class="statgrid">
      <div class="stat"><div class="v">${totalCards}</div><div class="l">Total</div></div>
      <div class="stat"><div class="v">${unique}</div><div class="l">Unique</div></div>
      <div class="stat"><div class="v">$${totalVal.toFixed(0)}</div><div class="l">Est. Value</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn gold" style="flex:1" onclick="openScanner()">Scan</button>
      <button class="btn" style="flex:1" onclick="openPasteCollection()">Paste cards</button>
    </div>
    <button class="btn ghost full" style="margin-bottom:12px" onclick="openBgPicker()">Set app background from card art</button>`;
  if(!ids.length){
    h += `<div class="empty"><div class="big"></div><div class="t">Empty collection</div>
      <div class="tiny">Paste a list, scan cards, or add them from Search.</div>
      <button class="btn gold full" style="margin-top:16px" onclick="openPasteCollection()">Paste a list of cards</button>
      <button class="btn full" style="margin-top:8px" onclick="setTab('search')">Add from Search</button></div>`;
  } else {
    const sel=(key,opts,label)=>`<select class="filt" onchange="setCollFilter('${key}',this.value)"><option value="">${label}</option>${opts.map(([v,t])=>`<option value="${v}" ${f[key]===v?'selected':''}>${t}</option>`).join('')}</select>`;
    const active = f.q||f.type||f.color||f.cmc!==''||f.rarity;
    h += `<div class="filt-bar">
        <input id="collQ" class="filt filt-q" placeholder="Filter by name…" value="${esc(f.q)}" oninput="setCollFilter('q',this.value)" autocomplete="off">
        ${sel('type',[['Creature','Creature'],['Instant','Instant'],['Sorcery','Sorcery'],['Artifact','Artifact'],['Enchantment','Enchantment'],['Planeswalker','Planeswalker'],['Land','Land']],'Type')}
        ${sel('color',[['W','White'],['U','Blue'],['B','Black'],['R','Red'],['G','Green'],['C','Colorless'],['M','Multicolor']],'Color')}
        ${sel('cmc',[['0','CMC 0'],['1','CMC 1'],['2','CMC 2'],['3','CMC 3'],['4','CMC 4'],['5','CMC 5'],['6','CMC 6'],['7','CMC 7+']],'Cost')}
        ${sel('rarity',[['common','Common'],['uncommon','Uncommon'],['rare','Rare'],['mythic','Mythic']],'Rarity')}
        ${active?`<button class="filt filt-clr" onclick="clearCollFilter()">✕ Clear</button>`:''}
      </div>
      <div class="section-title">Owned Cards (${shown.length}${shown.length!==unique?' of '+unique:''})</div>`;
    if(!shown.length) h += `<div class="empty" style="padding:30px 20px"><div class="t">No cards match these filters</div></div>`;
    else shown.forEach(id=>{ h += cardRowHTML(card(id), state.collection[id], `collQty('${id}',-1)`, `collQty('${id}',1)`); });
  }
  main.innerHTML = toggle + h;
}

// ---------- ANALYZE ----------
function selectAnalyzeDeck(id){ state.analyzeDeckId=id; render(); const d=state.decks.find(x=>x.id===id); if(d){ enrichGameCards(Object.keys(d.cards).concat(d.commander?[d.commander]:[])); if(!state.analyzeRecs[id]) fetchRecs(d); } }
function closeAnalyze(){ state.analyzeDeckId=null; render(); }
async function loadCombos(deckId){
  const d=state.decks.find(x=>x.id===deckId); if(!d) return;
  state.analyzeCombos=state.analyzeCombos||{}; state.analyzeCombos[deckId]={status:'loading'}; if(state.analyzeDeckId===deckId) renderAnalyze();
  try{
    if(!state.comboDB){ const r=await fetch('combos.json'); state.comboDB=await r.json(); }
    const owned=new Set(); Object.keys(d.cards).forEach(id=>{ const c=card(id); if(c) owned.add(c.name.toLowerCase()); }); if(d.commander&&card(d.commander)) owned.add(card(d.commander).name.toLowerCase());
    const inDeck=[], almost=[];
    state.comboDB.forEach(cb=>{ const cards=cb.c||[]; if(cards.length<2) return; const missing=cards.filter(n=>!owned.has(n.toLowerCase()));
      if(missing.length===0) inDeck.push({cards, produces:cb.p||[]});
      else if(missing.length===1) almost.push({cards, produces:cb.p||[], missing}); });
    state.analyzeCombos[deckId]={status:'ok', inDeck, almost};
  }catch(e){ state.analyzeCombos[deckId]={status:'error'}; }
  if(state.analyzeDeckId===deckId) renderAnalyze();
}
function combosPanelHTML(d){
  const cb=state.analyzeCombos&&state.analyzeCombos[d.id];
  let h=`<div class="panel"><div class="section-title" style="margin-top:0">Combos</div>`;
  if(!cb){ h+=`<button class="btn full" onclick="loadCombos('${d.id}')">Find combos in this deck</button><div class="tiny muted" style="margin-top:6px;opacity:.65">Via Commander Spellbook.</div>`; }
  else if(cb.status==='loading'){ h+=`<div class="tiny muted"><span class="mini-spin"></span> Checking Commander Spellbook…</div>`; }
  else if(cb.status==='error'){ h+=`<div class="tiny muted">Couldn’t reach Commander Spellbook.</div><button class="btn sm" style="margin-top:8px" onclick="loadCombos('${d.id}')">Retry</button>`; }
  else {
    if(cb.inDeck.length){ h+=`<div class="tiny muted" style="margin-bottom:7px">${cb.inDeck.length} combo${cb.inDeck.length>1?'s':''} already in your deck</div>`;
      cb.inDeck.slice(0,25).forEach(x=>{ h+=`<div style="background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px"><div style="font-weight:600;font-size:13px">${esc(x.cards.join(' + '))}</div><div class="tiny" style="color:var(--ok);margin-top:2px">→ ${esc(x.produces.join(', ')||'combo')}</div></div>`; });
    } else h+=`<div class="tiny muted">No complete combos detected.</div>`;
    if(cb.almost.length){ h+=`<div class="tiny muted" style="margin:12px 2px 7px;font-weight:600;color:var(--accent2)">Almost there — add 1–2 cards</div>`;
      cb.almost.slice(0,25).forEach(x=>{ h+=`<div style="background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px"><div style="font-weight:600;font-size:13px">${esc(x.cards.join(' + '))}</div><div class="tiny" style="margin-top:2px">→ ${esc(x.produces.join(', ')||'combo')}</div><div class="tiny" style="color:var(--accent2);margin-top:3px">Missing: ${esc(x.missing.join(', '))}</div></div>`; });
    }
  }
  return h+`</div>`;
}
function setAnalyzeOwned(v){ state.analyzeOwnedOnly=!!v; renderAnalyze(); }
function slugify(name){ return name.toLowerCase().normalize('NFD').replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,'-'); }
function deckToText(d){ let s=''; if(d.commander&&card(d.commander)) s+='Commander\n1 '+card(d.commander).name+'\n\n'; s+='Deck\n'; for(const id in d.cards){ const c=card(id); if(c) s+=d.cards[id]+' '+c.name+'\n'; } return s.trim(); }
function exportDeck(id){ const d=state.decks.find(x=>x.id===id); if(!d) return; const txt=deckToText(d);
  modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Export ${esc(d.name)}</h3>
    <div class="tiny muted" style="margin-bottom:8px">Plain text — paste into Moxfield, Archidekt, MTG Arena or MTGO.</div>
    <textarea id="exportText" class="imp-text" readonly style="min-height:150px">${esc(txt)}</textarea>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn gold full" onclick="copyDeckText()">Copy</button><button class="btn full" onclick="shareDeckText('${id}')">Share</button></div>
    <button class="btn ghost full" style="margin-top:7px" onclick="closeModal()">Close</button></div></div>`;
}
function copyDeckText(){ const t=$('#exportText'); if(!t) return; const v=t.value; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(()=>toast('Decklist copied')).catch(()=>{ t.select(); document.execCommand('copy'); toast('Decklist copied'); }); } else { t.select(); document.execCommand('copy'); toast('Decklist copied'); } }
function shareDeckText(id){ const d=state.decks.find(x=>x.id===id); if(!d) return; const txt=deckToText(d); if(navigator.share){ navigator.share({title:d.name, text:txt}).catch(()=>{}); } else { copyDeckText(); } }
function openShoppingList(){
  const ownedNames=new Set(Object.keys(state.collection).filter(id=>state.collection[id]>0).map(id=>((card(id)||{}).name||'').toLowerCase()).filter(Boolean));
  const need={};
  state.decks.forEach(d=>{ Object.keys(d.cards).concat(d.commander?[d.commander]:[]).forEach(id=>{ const c=card(id); if(!c) return; const nm=c.name.toLowerCase(); if(ownedNames.has(nm)) return; if(!need[nm]) need[nm]={name:c.name, price:c.price, decks:0}; need[nm].decks++; }); });
  const items=Object.values(need).sort((a,b)=>b.decks-a.decks || (parseFloat(b.price||0)-parseFloat(a.price||0)));
  const total=items.reduce((s,x)=>s+(parseFloat(x.price)||0),0);
  const store=state.buyStore==='ck'?'ck':'tcg';
  let body;
  if(!state.decks.length){ body=`<div class="tiny muted" style="padding:10px 0">Build or import a deck first.</div>`; }
  else if(!items.length){ body=`<div class="tiny muted" style="padding:10px 0">You own every card your decks use.</div>`; }

async function scryfallFallbackRecs(cmd, have){

  try{ const r=await fetch('https://api.scryfall.com/cards/search?order=edhrec&q='+encodeURIComponent(q)); if(r.ok){ const d=await r.json(); return (d.data||[]).map(c=>c.name).filter(n=>!have.has(n.toLowerCase())).slice(0,40); } }catch(e){}

    if(r.ok){ const d=await r.json(); const cls=((d.container&&d.container.json_dict&&d.container.json_dict.cardlists)||d.cardlists||[]).slice();
      const pri=hd=>{hd=(hd||'').toLowerCase(); if(hd.includes('top cards'))return 0; if(hd.includes('high synergy')||hd.includes('signature'))return 1; if(hd.includes('new'))return 9; return 5;};
      cls.sort((a,b)=>pri(a.header)-pri(b.header));
      cls.forEach(cl=>(cl.cardviews||cl.cardlist||[]).forEach(cv=>cv&&cv.name&&recNames.push(cv.name)));
    }

}

  h+=`<div class="panel"><div class="section-title" style="margin-top:0">Biggest Strengths</div>${strengths.length?strengths.map(s=>`<div class="tiny" style="margin-bottom:5px;color:var(--ok)">✓ ${esc(s)}</div>`).join(''):'<div class="tiny muted">Add more cards to surface strengths.</div>'}</div>`;
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">Biggest Weaknesses</div>${weaknesses.length?weaknesses.map(s=>`<div class="tiny" style="margin-bottom:5px;color:var(--danger)">• ${esc(s)}</div>`).join(''):'<div class="tiny" style="color:var(--ok)">✓ No major gaps detected.</div>'}</div>`;

  // ---- deep analysis panels (all free / offline) ----
  const dv=deckValue(d);
  const pl=powerLevel(d,{avg, lands, catCount, value:dv.total, n});
  const br=isCmd?commanderBracket(d,+pl.score):null;
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">Power Level <span style="float:right;color:var(--accent2);font-weight:700">${pl.score} / 10</span></div>

  const pa=pipAnalysis(d); const maxPip=Math.max(1,...['W','U','B','R','G'].map(k=>Math.max(pa.demand[k],pa.sources[k])));
  const anyPip=['W','U','B','R','G'].some(k=>pa.demand[k]||pa.sources[k]);
  if(anyPip){ h+=`<div class="panel"><div class="section-title" style="margin-top:0">Mana: symbols needed vs sources</div>`;
    ['W','U','B','R','G'].forEach(k=>{ if(!pa.demand[k]&&!pa.sources[k]) return; const short=pa.demand[k]>=4 && pa.sources[k] < pa.demand[k]*0.55;
      h+=`<div class="row" style="gap:8px;align-items:center;margin-bottom:7px">${pips([k])}<div style="flex:1">
        <div class="pipbar"><div class="pipbar-d" style="width:${(pa.demand[k]/maxPip*100).toFixed(0)}%"></div></div>

  // ---- Advanced statistical analysis: opening hands, land-drop consistency, Karsten mana base ----
  const ls=deckLibraryStats(d);
  if(ls.N>=7 && ls.lands>0){
    const N=ls.N, L=ls.lands, pct=x=>Math.round(x*100)+'%';
    const keepLo=2, keepHi=isCmd?5:4;
    const pKeep=hyperRange(keepLo,keepHi,N,L,7), pScrew=hyperLE(1,N,L,7), pFlood=hyperGE(6,N,L,7), avgL=7*L/N;
    const pRamp=ls.ramp>0?hyperGE(1,N,ls.ramp,7):null;

    h+=`<div class="panel"><div class="section-title" style="margin-top:0">Opening Hand <span style="float:right;color:${grade[1]};font-weight:700">${grade[0]}</span></div>
      <div class="statgrid" style="margin-bottom:8px"><div class="stat"><div class="v">${avgL.toFixed(1)}</div><div class="l">Avg lands</div></div><div class="stat"><div class="v">${pct(pKeep)}</div><div class="l">Keepable</div></div><div class="stat"><div class="v">${pct(pScrew)}</div><div class="l">Screw ≤1</div></div><div class="stat"><div class="v">${pct(pFlood)}</div><div class="l">Flood ≥6</div></div></div>`;
    if(pRamp!=null) h+=`<div class="tiny muted" style="margin-bottom:3px">Chance of a ramp piece in your opener: <b style="color:var(--text)">${pct(pRamp)}</b> <span style="opacity:.6">(${ls.ramp} in deck)</span></div>`;
    h+=`<div class="tiny muted" style="opacity:.7">“Keepable” = ${keepLo}–${keepHi} lands in the opening seven; hands you’d keep rather than mulligan. Computed exactly (hypergeometric) over ${N} library cards.</div></div>`;

    h+=`<div class="panel"><div class="section-title" style="margin-top:0">Hitting Land Drops</div>`;
    for(let t=1;t<=5;t++){ const p=hyperGE(t,N,L,6+t); const col=p>=0.85?'var(--ok)':p>=0.65?'var(--accent2)':'var(--danger)';

    if(idColors.length){
      const rows=idColors.map(k=>{ let minCmc=99, tough=null, toughT=0;
        for(const id in d.cards){ const c=card(id); if(!c||/\bLand\b/.test(c.type_line||'')) continue; const m=(c.mana_cost||'').match(new RegExp('\\{[^}]*'+k+'[^}]*\\}','g')); if(!m) continue; const cmc=Math.max(1,Math.round(c.cmc||0)); if(cmc<minCmc) minCmc=cmc; const t=karstenSources(m.length,cmc); if(t>toughT){ toughT=t; tough={name:c.name,pips:m.length,cmc}; } }
        if(minCmc===99) minCmc=3; const target=karstenSources(1,minCmc), have=pa.sources[k]||0;
        return {k,have,target,ratio:target?have/target:1,tough,toughT}; });
      h+=`<div class="panel"><div class="section-title" style="margin-top:0">Mana Base Rating <span class="tiny muted" style="float:right;font-weight:400">vs Karsten targets</span></div>`;
      rows.forEach(r=>{ const col=r.ratio>=1?'var(--ok)':r.ratio>=0.78?'var(--accent2)':'var(--danger)'; const verdict=r.ratio>=1?'good':r.ratio>=0.78?'a bit low':'low';
        h+=`<div class="row between" style="margin-bottom:${r.tough&&r.toughT>r.target+2?'2':'8'}px;gap:8px"><div class="row" style="gap:7px;align-items:center">${pips([r.k])}<span class="tiny muted"><b style="color:var(--text)">${r.have}</b> sources · want ~${r.target}</span></div><span class="tiny" style="color:${col};font-weight:700">${verdict}</span></div>`;
        if(r.tough && r.toughT>r.target+2) h+=`<div class="tiny muted" style="margin:0 0 8px 26px;opacity:.62">toughest cast: ${esc(r.tough.name)} (${('{'+r.k+'}').repeat(r.tough.pips)} at ${r.tough.cmc} MV wants ~${r.toughT})</div>`; });
      h+=`<div class="tiny muted" style="margin-top:2px;opacity:.7">Frank Karsten’s guideline for casting your most colour-intensive card on curve ~90% of the time in a 99-card deck.</div></div>`;
    }

  const themes=themeDetect(d);
  if(themes.length) h+=`<div class="panel"><div class="section-title" style="margin-top:0">Detected Strategy</div><div class="row" style="flex-wrap:wrap;gap:6px">${themes.map(t=>`<span class="athemetag">${esc(t.label)} · ${t.count}</span>`).join('')}</div><div class="tiny muted" style="margin-top:7px;opacity:.7">Themes inferred from card text — the biggest are your game plan.</div></div>`;

  const rb=rarityBreakdown(d), cp=creatureProfile(d);
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">Composition</div>
    <div class="row" style="flex-wrap:wrap;gap:12px">
      <span class="tiny muted">✦ Mythic <b style="color:var(--text)">${rb.mythic}</b></span>
      <span class="tiny muted">◆ Rare <b style="color:var(--text)">${rb.rare}</b></span>
      <span class="tiny muted">● Uncommon <b style="color:var(--text)">${rb.uncommon}</b></span>
      <span class="tiny muted">○ Common <b style="color:var(--text)">${rb.common}</b></span>
    </div>
    ${cp.count?`<div class="tiny muted" style="margin-top:8px">Creatures: <b style="color:var(--text)">${cp.count}</b>${cp.avgP?` · avg <b style="color:var(--text)">${cp.avgP}/${cp.avgT}</b>`:''}${cp.big?` · biggest <b style="color:var(--text)">${esc(cp.big)}</b> (${cp.bigP})`:''}</div>`:''}</div>`;

  h+=`<div class="panel"><div class="section-title" style="margin-top:0">Deck Value <span style="float:right;color:var(--accent2);font-weight:700">$${dv.total.toFixed(0)}</span></div>${dv.top.length?dv.top.map(x=>`<div class="tiny muted" style="display:flex;justify-content:space-between;gap:8px;margin-bottom:3px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}${x.q>1?' ×'+x.q:''}</span><span style="color:var(--text)">$${x.price.toFixed(2)}</span></div>`).join(''):'<div class="tiny muted">No price data cached yet — open the deck to fetch prices.</div>'}</div>`;

  const bad=legalityIssues(d);
  if(bad.length) h+=`<div class="panel"><div class="section-title" style="margin-top:0;color:var(--danger)">Legality</div>${bad.map(b=>`<div class="tiny" style="color:var(--danger);margin-bottom:3px">• ${esc(b)}</div>`).join('')}</div>`;

  h+=combosPanelHTML(d);

  // what to add
  const rec=state.analyzeRecs[d.id];
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">What to Add</div>`;
  if(!rec || rec.status==='loading') h+=`<div class="tiny muted"><span class="mini-spin"></span> Finding cards for ${cmd?esc(cmd.name):'this deck'}…</div>`;
  else if(rec.status==='na') h+=`<div class="tiny muted">Set a commander on this deck to get recommendations.</div>`;
  else if(!rec.cards||!rec.cards.length) h+=`<div class="tiny muted">No recommendations found.</div>`;
  else {
    state._resultMap=state._resultMap||{}; rec.cards.forEach(c=>state._resultMap[c.id]=c);
    const owned=!!state.analyzeOwnedOnly;
    const withCats=rec.cards.map(c=>({c, fills:cardCategories(c).filter(x=>weakKeys.includes(x))}));
    withCats.sort((a,b)=>(b.fills.length>0)-(a.fills.length>0));
    const ownedList=withCats.filter(({c})=>(state.collection[c.id]||0)>0);
    const shown = owned ? ownedList : withCats;
    h+=`<div class="pc-group" style="margin-bottom:10px"><button class="pc-btn ${owned?'':'on'}" onclick="setAnalyzeOwned(false)">Any card</button><button class="pc-btn ${owned?'on':''}" onclick="setAnalyzeOwned(true)">In my collection (${ownedList.length})</button></div>`;
    h+=`<div class="tiny muted" style="margin-bottom:8px">${owned?'Recommended cards you already own':'Popular cards for '+esc(cmd.name)+' (via EDHREC)'} — ones that fix a weakness are first. Tap ＋ to add.</div>`;
    if(!shown.length) h+=`<div class="tiny muted">${owned?'None of the recommended cards are in your collection yet — switch to “Any card” to see them all.':'No recommendations found.'}</div>`;
    shown.forEach(({c,fills})=>{ const inDeck=d.cards[c.id]||0; const ownedN=state.collection[c.id]||0; const thumb=(c.image_uris&&c.image_uris.small)||((c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.small))||'';
      const tag = inDeck ? ' · <span style="color:var(--accent2)">in deck</span>' : (fills.length?` · <span style="color:var(--accent2)">fixes ${fills.join('/')}</span>`:'');
      const ownTag = ownedN ? ` · <span style="color:var(--ok)">✓ owned${ownedN>1?' '+ownedN:''}</span>` : '';
      h+=`<div class="cardrow"><div class="thumb" style="background-image:url('${thumb}')" onclick="showCardObj(${esc(JSON.stringify(c.id))})"></div><div class="info"><div class="nm">${esc(c.name)}</div><div class="meta">${esc(shortType(c.type_line))}${tag}${ownTag}</div></div><button class="btn gold sm" onclick="addToDeckDirect('${d.id}','${c.id}')">＋</button></div>`; });
  }
  h+=`</div>`;
  main.innerHTML=h;
}
