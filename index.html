function commanderIdentity(deck){
  if(!deck || deck.format!=='Commander' || !deck.commander) return null; // null = no restriction
  const cc=card(deck.commander);
  return (cc && ((cc.ci&&cc.ci.length)?cc.ci:cc.colors)) || [];
}
function withinIdentity(ci, allowed){ return (ci||[]).every(c=>allowed.includes(c)); }
function offColor(obj, cardId, deck){
  const allowed=commanderIdentity(deck); if(!allowed) return false;
  const ci=(obj&&obj.color_identity)||(card(cardId)&&card(cardId).ci)||[];
  return !withinIdentity(ci, allowed);
}
function singletonBlocked(obj, cardId, deck){
  if(!deck || deck.format!=='Commander') return false;
  if(!((deck.cards[cardId]||0)>=1)) return false; // not already in the deck
  const tl=(obj&&obj.type_line)||(card(cardId)&&card(cardId).type_line)||'';
  if(/\bBasic\b/.test(tl)) return false; // basics are unlimited
  const txt=(obj&&obj.oracle_text)||(card(cardId)&&card(cardId).text)||'';
  if(/any number of cards named/i.test(txt)) return false; // Relentless Rats etc.
  return true;
}
function syncCollectionToDeck(deck, cardId){
  const need=deck.cards[cardId]||0;
  if((state.collection[cardId]||0) < need) state.collection[cardId]=need; // own at least what the deck uses
}
function addToDeckDirect(deckId,cardId){
  const c=state._resultMap&&state._resultMap[cardId];
  const d=state.decks.find(x=>x.id===deckId); if(!d) return;
  if(offColor(c,cardId,d)){ toast('Outside '+(card(d.commander)?card(d.commander).name:'your commander')+'’s color identity'); return; }
  if(singletonBlocked(c,cardId,d)){ toast('Singleton format — only one copy (basics excepted)'); return; }

  d.cards[cardId]=(d.cards[cardId]||0)+1;
  syncCollectionToDeck(d,cardId);

}

function parseDeckList(text){
  const cards=[]; let commanderName=null; let section='deck';
  const headerRe=/^(commander|companion|deck|mainboard|main|sideboard|maybeboard|token)/i;
  for(const raw of text.split('\n')){
    const line=raw.trim();
    if(!line) continue;
    if(!/^\d/.test(line) && headerRe.test(line.replace(/[^a-z]/gi,''))){
      const m=line.toLowerCase();
      if(m.startsWith('commander')) section='commander';
      else if(m.startsWith('sideboard')||m.startsWith('maybeboard')||m.startsWith('token')) section='skip';
      else section='deck';
      continue;
    }
    const isCmd=/\*cmdr\*|\*commander\*/i.test(line);
    let qty=1, name=line;
    const qm=line.match(/^(\d+)\s*[xX]?\s+(.*)$/);
    if(qm){ qty=parseInt(qm[1],10)||1; name=qm[2]; }
    name=name.replace(/\*[^*]*\*/g,'')
             .replace(/\([A-Za-z0-9]{2,6}\)\s*[A-Za-z0-9-]*$/,'')
             .replace(/\s+#\d+$/,'')
             .replace(/<[^>]*>/g,'')
             .trim();
    if(name.includes('//')) name=name.split('//')[0].trim();
    if(!name || section==='skip') continue;
    if(section==='commander' || isCmd){ commanderName=name; continue; }
    cards.push({qty,name});
  }
  return {cards, commanderName};
}

async function scryCollection(names){
  const found=[]; const notFound=[];
  for(let i=0;i<names.length;i+=75){
    const chunk=names.slice(i,i+75);
    try{
      const r=await fetch('https://api.scryfall.com/cards/collection',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({identifiers:chunk.map(n=>({name:n}))})
      });
      const d=await r.json();
      (d.data||[]).forEach(c=>found.push(c));
      (d.not_found||[]).forEach(nf=>{ if(nf&&nf.name) notFound.push(nf.name); });
    }catch(e){ chunk.forEach(n=>notFound.push(n)); }
  }
  return {found,notFound};
}

async function importList(name, format, text, statusEl){
  const parsed=parseDeckList(text);
  const names=parsed.cards.map(c=>c.name);
  if(parsed.commanderName) names.push(parsed.commanderName);
  const unique=[...new Set(names)];
  if(!unique.length){ if(statusEl) statusEl.textContent='Nothing to import — paste a list first.'; return null; }
  if(statusEl) statusEl.innerHTML='<span class="mini-spin"></span> Looking up '+unique.length+' cards…';
  const {found}=await scryCollection(unique);
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const map={};
  found.forEach(c=>{ map[norm(c.name)]=c; if(c.name.includes('//')) map[norm(c.name.split('//')[0])]=c; });
  const id=uid(); const deck={id,name:name||'Imported Deck',format:format||'Casual',cards:{},commander:null};
  let added=0; const missing=[];
  parsed.cards.forEach(({qty,name})=>{
    const c=map[norm(name)];
    if(c){ cacheCard(c); deck.cards[c.id]=(deck.cards[c.id]||0)+qty; added+=qty; }
    else missing.push(name);
  });
  if(parsed.commanderName){
    const c=map[norm(parsed.commanderName)];
    if(c){ cacheCard(c); deck.commander=c.id; delete deck.cards[c.id]; }
    else missing.push(parsed.commanderName+' (commander)');
  }
  state.decks.push(deck); state.openDeckId=id; DB.save();
  toast(missing.length ? added+' cards in · '+missing.length+' not found' : added+' cards imported');
  return deck;
}

// Map a rect in the video's displayed (CSS) coords to source pixel coords, accounting for object-fit:cover
function displayToSource(video,dx,dy,dw,dh){
  const vw=video.videoWidth, vh=video.videoHeight, cw=video.clientWidth, ch=video.clientHeight;
  const scale=Math.max(cw/vw, ch/vh);
  const offX=(vw*scale-cw)/2, offY=(vh*scale-ch)/2;
  return {x:(dx+offX)/scale, y:(dy+offY)/scale, w:dw/scale, h:dh/scale};
}

// Grayscale + global threshold to help OCR read the title bar
function binarize(ctx,canvas){
  const img=ctx.getImageData(0,0,canvas.width,canvas.height), d=img.data; let sum=0;
  for(let i=0;i<d.length;i+=4){ const g=0.3*d[i]+0.59*d[i+1]+0.11*d[i+2]; d[i]=d[i+1]=d[i+2]=g; sum+=g; }
  const t=(sum/(d.length/4))*0.92;
  for(let i=0;i<d.length;i+=4){ const v=d[i]>t?255:0; d[i]=d[i+1]=d[i+2]=v; }
  ctx.putImageData(img,0,0);
}

let _ocrWorker=null;
async function getOcrWorker(){
  await loadTesseract();
  if(!_ocrWorker){
    _ocrWorker = await Tesseract.createWorker('eng');
    try{ await _ocrWorker.setParameters({ tessedit_pageseg_mode:'7', tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ',-" }); }catch(e){}
  }
  return _ocrWorker;
}
function cleanName(t){
  const line=(t||'').split('\n').map(s=>s.trim()).filter(s=>s.length>1)[0]||'';
  return line.replace(/[^A-Za-z',\- ]/g,'').replace(/\s+/g,' ').trim();
}

async function captureScan(){
  if(scanBusy) return;
  const video=$('#scanVideo');
  if(!video||!video.videoWidth){ toast('Camera still warming up…'); return; }
  scanBusy=true; $('#scanShutter')?.classList.add('busy');
  setScanStatus('Reading card…',true);
  try{
    const g=$('#scanGuide').getBoundingClientRect();
    const vr=video.getBoundingClientRect();
    const dx=(g.left-vr.left)+g.width*0.045;
    const dy=(g.top-vr.top)+g.height*0.035;
    const src=displayToSource(video,dx,dy,g.width*0.80,g.height*0.135);
    const canvas=document.createElement('canvas');
    canvas.width=1100; canvas.height=Math.max(60,Math.round(1100*src.h/src.w));
    const cx=canvas.getContext('2d');
    cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
    cx.drawImage(video,src.x,src.y,src.w,src.h,0,0,canvas.width,canvas.height);
    binarize(cx,canvas);
    const worker=await getOcrWorker();
    const {data}=await worker.recognize(canvas);
    const name=cleanName(data.text);
    if(!name){ setScanStatus('Couldn’t read the name — fill the gold strip with just the title and retry',false); return; }
    await matchScan(name);
  }catch(e){
    setScanStatus('Scan failed — try again',false);
  }finally{
    scanBusy=false; $('#scanShutter')?.classList.remove('busy');
  }
}

async function scryNamed(name){
  try{ const r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(name)); if(r.ok) return await r.json(); }catch(e){}
  return null;
}

async function matchScan(name){
  setScanStatus('Matching “'+name+'”…',true);
  let c=await scryNamed(name);
  if(!c){
    // autocomplete: snap a partial/garbled read to the closest real card name
    try{
      const r=await fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(name));
      if(r.ok){ const d=await r.json(); if(d.data&&d.data[0]) c=await scryNamed(d.data[0]); }
    }catch(e){}
  }
  if(!c){
    try{ const r=await fetch('https://api.scryfall.com/cards/search?q='+encodeURIComponent(name)); if(r.ok){ const d=await r.json(); c=(d.data||[])[0]; } }catch(e){}
  }
  setScanStatus('',false);
  showScanResult(c,name);
}

function showScanResult(c,readName){
  const box=$('#scanResult'); if(!box) return;
  box.classList.remove('hidden');
  if(c){
    state._scanCard=c; cacheCard(c);
    const img=(c.image_uris&&c.image_uris.small)||(c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.small)||'';
    box.innerHTML=`
      <div class="scan-card">
        <div class="thumb" style="background-image:url('${img}')"></div>
        <div class="info">
          <div class="nm">${esc(c.name)} ${pips(c.colors&&c.colors.length?c.colors:(c.color_identity||[]))}</div>
          <div class="meta">${esc(shortType(c.type_line||''))} · ${(c.set||'').toUpperCase()}</div>
        </div>
      </div>
      <div class="scan-actions">
        <button class="btn gold full" onclick="scanConfirm()">✓ Add to collection</button>
        <div class="row" style="gap:8px">
          <button class="btn full" onclick="scanEdit()">Wrong? Edit</button>
          <button class="btn full" onclick="scanDismiss()">Scan next</button>
        </div>
      </div>`;
  } else {
    state._scanCard=null;
    box.innerHTML=`
      <div class="scan-card"><div class="info"><div class="nm">No match for “${esc(readName)}”</div><div class="meta">Fix the name and search again</div></div></div>
      <div class="scan-actions">
        <input id="scanEditInput" class="scan-input" value="${esc(readName)}" autocomplete="off">
        <div class="row" style="gap:8px">
          <button class="btn gold full" onclick="scanResearch()">Search</button>
          <button class="btn full" onclick="scanDismiss()">Rescan</button>
        </div>
      </div>`;
  }
}

function scanConfirm(){
  const c=state._scanCard; if(!c) return;
  state.collection[c.id]=(state.collection[c.id]||0)+1; DB.save();
  toast(state.collection[c.id]+'× '+c.name+' added');

}
function scanEdit(){
  const name=state._scanCard?state._scanCard.name:'';

      <input id="scanEditInput" class="scan-input" value="${esc(name)}" autocomplete="off">

function scanResearch(){

function scanDismiss(){
  state._scanCard=null;
  const box=$('#scanResult'); if(box){ box.classList.add('hidden'); box.innerHTML=''; }
  setScanStatus('',false);
}

// cloud sync
let cloudPushTimer=null;
function scheduleCloudPush(){ if(!state.user||!window._db) return; clearTimeout(cloudPushTimer); cloudPushTimer=setTimeout(pushCloud,1200); }
function pushCloud(){ if(!state.user||!window._db) return; window._db.collection('users').doc(state.user.uid).set({decks:state.decks,collection:state.collection,cards:state.cards,_ts:Date.now()}).catch(()=>{}); }
function mergeData(cloud, local){
  if(!cloud) return local;
  const ids=new Set((cloud.decks||[]).map(d=>d.id));
  const decks=[...(cloud.decks||[]), ...local.decks.filter(d=>!ids.has(d.id))];
  const collection={...(cloud.collection||{})};
  for(const k in (local.collection||{})) collection[k]=Math.max(collection[k]||0, local.collection[k]);
  const cards={...(local.cards||{}), ...(cloud.cards||{})};
  return {decks,collection,cards};
}
async function subscribeCloud(uid){
  const ref=window._db.collection('users').doc(uid);
  try{
    const snap=await ref.get();
    const cloud=snap.exists?snap.data():null;
    const merged=mergeData(cloud,{decks:state.decks,collection:state.collection,cards:state.cards});
    window._applyingRemote=true; state.decks=merged.decks; state.collection=merged.collection; state.cards=merged.cards; DB.save(); window._applyingRemote=false;
    await ref.set({decks:merged.decks,collection:merged.collection,cards:merged.cards,_ts:Date.now()});
    render();
  }catch(e){ toast('Sync: '+(e.code||'check Firestore rules')); }
  window._cloudUnsub=ref.onSnapshot(snap=>{
    const data=snap.data(); if(!data) return;
    const incoming=JSON.stringify({d:data.decks||[],c:data.collection||{},k:data.cards||{}});
    const localStr=JSON.stringify({d:state.decks,c:state.collection,k:state.cards});
    if(incoming!==localStr){ window._applyingRemote=true; state.decks=data.decks||[]; state.collection=data.collection||{}; state.cards=data.cards||{}; DB.save(); window._applyingRemote=false; render(); }
  });
}
