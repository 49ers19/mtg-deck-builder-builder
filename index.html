// ---------- PLAY (life counter) ----------
const PLAY_COLORS=['#e3c14b','#aae0fa','#f9a98a','#9bd6a3'];
function playOut(i){
  const p=state.play;
  if((p.life[i]||0)<=0) return 'life';
  if(((p.poison&&p.poison[i])||0)>=10) return 'poison';
  if((p.cmd[i]||[]).some(v=>v>=21)) return 'cmdr';
  return null;
}
function renderPlay(){
  if(state.match) return renderMatch();
  if(state.game) return renderGame();
  const mode=state.play.mode||'life';
  main.innerHTML = `<div class="play-ctrl" style="margin-bottom:14px"><div class="pc-group">
      <button class="pc-btn ${mode==='life'?'on':''}" onclick="setPlayMode('life')">Life</button>
      <button class="pc-btn ${mode==='play'?'on':''}" onclick="setPlayMode('play')">▶ Playtest</button>
    </div></div>` + (mode==='play' ? deckPickerHTML() : lifeCounterHTML());
}
function setPlayMode(m){ state.play.mode=m; render(); }
function lifeCounterHTML(){
  const p=state.play;
  let h=`<div class="play-ctrl">
      <div class="pc-group"><span class="pc-lbl">Players</span>${[2,3,4].map(n=>`<button class="pc-btn ${p.count===n?'on':''}" onclick="setPlayers(${n})">${n}</button>`).join('')}</div>
      <div class="pc-group"><span class="pc-lbl">Life</span>${[20,40].map(s=>`<button class="pc-btn ${p.start===s?'on':''}" onclick="setStart(${s})">${s}</button>`).join('')}</div>
      <button class="btn sm" onclick="resetLife()">↺ Reset</button>
      ${state.session
        ? `<button class="btn sm gold" onclick="openShare()">Room ${state.session.code}</button>`
        : `<button class="btn sm" onclick="openShare()">Play with friends</button><button class="btn sm gold" onclick="startMatchmaking()">Matchmaking</button>`}
    </div>`;
  for(let i=0;i<p.count;i++){
    const v=p.life[i]; const col=PLAY_COLORS[i]; const out=playOut(i);
    const outLbl=out?` · OUT${out==='poison'?'':out==='cmdr'?'':''}`:'';
    let ctr=`<div class="ctr poison ${((p.poison&&p.poison[i])||0)>=10?'danger':''}">
        <span class="ctr-lbl"></span>
        <button onclick="poison(${i},-1)">−</button><span class="ctr-n">${(p.poison&&p.poison[i])||0}</span><button onclick="poison(${i},1)">＋</button>
      </div>`;
    for(let j=0;j<p.count;j++){
      if(j===i) continue;
      const dmg=(p.cmd[i]&&p.cmd[i][j])||0;
      ctr+=`<div class="ctr cmd ${dmg>=21?'danger':''}" style="--c:${PLAY_COLORS[j]}">
        <span class="ctr-lbl">P${j+1}</span>
        <button onclick="cmdDmg(${i},${j},-1)">−</button><span class="ctr-n">${dmg}</span><button onclick="cmdDmg(${i},${j},1)">＋</button>
      </div>`;
    }
    h+=`<div class="pcard" style="border-color:${col}${out?';opacity:.6':''}">
      <div class="pname" style="color:${col}">Player ${i+1}${outLbl}</div>
      <div class="prow">
        <button class="lifebtn big" onclick="life(${i},-1)">−</button>
        <div class="lifeval" style="${v<=0?'color:var(--danger)':''}">${v}</div>
        <button class="lifebtn big" onclick="life(${i},1)">＋</button>
      </div>
      <div class="prow5">
        <button class="lifebtn" onclick="life(${i},-5)">−5</button>
        <button class="lifebtn" onclick="life(${i},5)">+5</button>
      </div>
      <div class="counters">${ctr}</div>
    </div>`;
  }
  return h;
}
function setPlayers(n){ state.play.count=n; resetLife(); }
function setStart(s){ state.play.start=s; resetLife(); }
function resetLife(){
  const p=state.play, n=p.count;
  p.life=Array.from({length:n},()=>p.start);
  p.poison=Array.from({length:n},()=>0);
  p.cmd=Array.from({length:n},()=>Array.from({length:n},()=>0));
  renderPlay(); publishState();
}
function life(i,d){ state.play.life[i]=(state.play.life[i]||0)+d; renderPlay(); publishState(); }
function poison(i,d){ const a=state.play.poison; a[i]=Math.max(0,(a[i]||0)+d); renderPlay(); publishState(); }
function cmdDmg(i,j,d){
  const p=state.play;
  if(!p.cmd[i]) p.cmd[i]=Array.from({length:p.count},()=>0);
  const cur=p.cmd[i][j]||0, nv=Math.max(0,cur+d), applied=nv-cur;
  p.cmd[i][j]=nv;
  p.life[i]=(p.life[i]||0)-applied; // commander damage is combat damage — also lowers life
  renderPlay(); publishState();
}

// ---------- PLAY: solo Commander playtest ----------
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function deckPickerHTML(){
  const decks=state.decks.filter(d=>d.format==='Commander');
  if(!decks.length) return `<div class="empty"><div class="big">▶</div><div class="t">No Commander decks yet</div><div class="tiny">Create or import a Commander deck, then play it here.</div></div>`;
  let h=`<div class="section-title">Choose a Commander deck to play</div>`;
  decks.forEach(d=>{
    const cmd=d.commander&&card(d.commander);
    h+=`<div class="decktile" onclick="startGame('${d.id}')"><div class="col">
      <div class="dn">${esc(d.name)}</div>
      <div class="ds">${cmd?''+esc(cmd.name):'No commander set'} · ${deckCardCount(d)} cards</div>
    </div><div style="font-size:20px;color:var(--muted)">▶</div></div>`;
  });
  return h;
}
function startGame(deckId){
  const d=state.decks.find(x=>x.id===deckId); if(!d) return;
  const lib=[];
  for(const cid in d.cards){ for(let k=0;k<d.cards[cid];k++) lib.push({iid:uid(),cardId:cid}); }
  shuffle(lib);
  state.game={ deckId, deckName:d.name, commanderId:d.commander||null, turn:1, life:40,
    library:lib, hand:[], battlefield:[], graveyard:[], exile:[],
    command:d.commander?[{iid:uid(),cardId:d.commander}]:[], cmdTax:0, mulligans:0,
    landsThisTurn:0, landLimit:1, phase:3, pool:emptyPool(), oppLife:40 };
  for(let i=0;i<7;i++) gameDraw();
  render();
  enrichGameCards(Object.keys(d.cards).concat(d.commander?[d.commander]:[]));
}
async function enrichGameCards(ids){
  const missing=[...new Set(ids)].filter(id=>state.cards[id] && (state.cards[id].text===undefined || state.cards[id].power===undefined || state.cards[id].legal===undefined));
  if(!missing.length) return;
  for(let i=0;i<missing.length;i+=75){
    const chunk=missing.slice(i,i+75);
    try{

function normFilter(s){ s=(s||'').toLowerCase(); if(/creature/.test(s))return 'creature'; if(/artifact/.test(s))return 'artifact'; if(/enchantment/.test(s))return 'enchantment'; if(/planeswalker/.test(s))return 'planeswalker'; if(/nonland/.test(s))return 'nonland'; if(/\bland\b/.test(s))return 'land'; return 'permanent'; }

function gameTap(iid){

// ---------- Remote: shared life counter across devices (MQTT relay) ----------
function loadMqtt(){ if(window.mqtt) return Promise.resolve(); return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://unpkg.com/mqtt/dist/mqtt.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('mqtt load')); document.head.appendChild(s); }); }
function genCode(){ let c=''; const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function roomTopic(code){ return 'planardeckbox/v1/'+code.toUpperCase(); }
async function joinRoom(code, silent){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if(code.length<4){ toast('Enter a 4-character code'); return; }
  try{ await loadMqtt(); }catch(e){ toast('Could not load sharing'); return; }
  if(state.session){ try{ state.session.client.end(true); }catch(e){} }
  const sender=Math.random().toString(36).slice(2,10);
  const client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'pdbx_'+sender,reconnectPeriod:3000,connectTimeout:9000});
  state.session={code,client,sender,status:'connecting'};
  state.tab='play'; state.play.mode='life';
  if(!silent) showShareModal();
  else if(state.tab==='play'&&!state.game) renderPlay();
  client.on('connect',()=>{ state.session.status='connected'; client.subscribe(roomTopic(code)); publishState(); if(state.match) publishMatch(); if(!silent && $('#shareBody')) showShareModal(); if(state.tab==='play'&&!state.game) renderPlay(); });
  client.on('message',(t,payload)=>{ try{ const d=JSON.parse(payload.toString()); if(!state.session||d.sender===state.session.sender) return; if(d.matchEvent){ applyMatchEvent(d); return; } if(d.match){ applyMatchMsg(d); return; } if(d.play){ state.play=d.play; if(state.tab==='play'&&!state.game&&!state.match) renderPlay(); } }catch(e){} });
  client.on('error',()=>{ if(state.session){ state.session.status='error'; if($('#shareBody')) showShareModal(); } });
  client.on('close',()=>{ if(state.session&&state.session.status==='connected') state.session.status='reconnecting'; });
  client.on('reconnect',()=>{ if(state.session&&state.session.status!=='connected') state.session.status='connecting'; });
}
function publishState(){ const s=state.session; if(s&&s.client&&s.status==='connected'){ try{ s.client.publish(roomTopic(s.code), JSON.stringify({sender:s.sender,play:state.play}), {retain:true}); }catch(e){} } }
function leaveSession(){ const s=state.session; if(s){ try{ s.client.end(true); }catch(e){} } state.session=null; closeModal(); render(); }
function shareUrl(){ return location.origin+location.pathname+'?room='+(state.session?state.session.code:''); }

// ---------- Matchmaking: pair with a random person also searching (free public broker) ----------
const LOBBY_TOPIC='planardeckbox/lobby/v1';
function startMatchmaking(){
  loadMqtt().then(()=>{
    if(state.session){ try{ state.session.client.end(true); }catch(e){} state.session=null; }
    if(state.matchmaking){ stopMatchmakingClient(); }
    const me=Math.random().toString(36).slice(2,10);
    const client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'pdbmm_'+me,reconnectPeriod:3000,connectTimeout:9000});
    state.matchmaking={me,client,status:'connecting',matched:false,timer:null};
    state.tab='play'; state.play.mode='life';
    showMatchModal();
    const seek=()=>{ const mm=state.matchmaking; if(mm&&!mm.matched){ try{ client.publish(LOBBY_TOPIC, JSON.stringify({t:'seek',from:me})); }catch(e){} } };
    client.on('connect',()=>{ const mm=state.matchmaking; if(!mm) return; mm.status='searching'; client.subscribe(LOBBY_TOPIC); seek(); mm.timer=setInterval(seek, 2500); if($('#matchBody')) showMatchModal(); });
    client.on('message',(t,payload)=>{
      const mm=state.matchmaking; if(!mm||mm.matched) return;
      let d; try{ d=JSON.parse(payload.toString()); }catch(e){ return; }
      if(d.t==='seek' && d.from && d.from!==me){
        // deterministic host: the lower id makes the room and invites the other
        if(me<d.from){
          mm.matched=true; if(mm.timer) clearInterval(mm.timer);
          const room=genCode();
          const msg=JSON.stringify({t:'match',a:me,b:d.from,room});
          // QoS 1 so the callback fires only after the broker has the message and can relay it to the opponent
          client.publish(LOBBY_TOPIC, msg, {qos:1}, ()=>{ enterMatchedGame(room, true); });
          // resend a couple times and keep the lobby alive briefly so the opponent reliably receives it
          setTimeout(()=>{ try{ client.publish(LOBBY_TOPIC, msg, {qos:1}); }catch(e){} }, 500);
          setTimeout(()=>{ try{ client.publish(LOBBY_TOPIC, msg, {qos:1}); }catch(e){} }, 1200);
          setTimeout(()=>stopMatchmakingClient(), 3000);
        }
      } else if(d.t==='match' && (d.a===me||d.b===me)){
        mm.matched=true; if(mm.timer) clearInterval(mm.timer);
        const room=d.room; setTimeout(()=>stopMatchmakingClient(),300); enterMatchedGame(room, false);
      }
    });
    client.on('error',()=>{ const mm=state.matchmaking; if(mm){ mm.status='error'; if($('#matchBody')) showMatchModal(); } });
  }).catch(()=>toast('Could not load matchmaking'));
}
function stopMatchmakingClient(){ const mm=state.matchmaking; if(mm){ if(mm.timer) clearInterval(mm.timer); try{ mm.client.end(true); }catch(e){} } state.matchmaking=null; }
// Matched → drop straight into the networked Commander match (no QR / share step)
function enterMatchedGame(room, isHost){ closeModal(); state.tab='play'; state.game=null; state.play.mode='life'; initMatch(isHost); joinRoom(room, true); render(); toast('Opponent found — choose your deck!'); }

// ================= NETWORKED COMMANDER MATCH =================
function initMatch(isHost){
  state.match = { amHost:!!isHost, phase:'deck',
    me:{ deck:null, cmd:null, life:40, hand:[], _lib:[], board:[], gy:[], exile:[], libCount:0, ready:false,
         pool:emptyPool(), landsThisTurn:0, phase:0, cmdZone:true, cmdTax:0, cmdDmg:0, firstTurnTaken:false },
    opp:{ deck:null, cmd:null, life:40, board:[], gy:[], exile:[], handCount:0, libCount:0, ready:false, cmdDmg:0, cmdZone:true, cmdTax:0 },
    diceHost:null, diceGuest:null, firstHost:null, turnHost:null, rolling:false, choice:null, pending:null, respond:null };
}
function seatPayload(){ const m=state.match.me; return { deck:m.deck, cmd:m.cmd, life:m.life, handCount:m.hand.length, libCount:m.libCount, gy:m.gy.slice(), exile:m.exile.slice(), board:m.board.map(c=>({cardId:c.cardId,tapped:!!c.tapped,token:c.token||null,sick:!!c.sick,atk:!!c.atk})), ready:m.ready, cmdDmg:m.cmdDmg, cmdZone:m.cmdZone, cmdTax:m.cmdTax }; }
// mana-pool math on a given pool object
function poolTotal(p){ return MANA_COLORS.reduce((s,c)=>s+(p[c]||0),0); }
function poolCanPay(p,need){ const t={...p}; for(const c of MANA_COLORS){ if((t[c]||0)<need[c]) return false; t[c]-=need[c]; } return poolTotal(t)>=need.generic; }
function poolPay(p,need){ for(const c of MANA_COLORS) p[c]=(p[c]||0)-need[c]; let gen=need.generic; for(const c of ['C','W','U','B','R','G']){ while(gen>0&&(p[c]||0)>0){ p[c]--; gen--; } } }
function isLandCard(cd){ return cd && /\bLand\b/.test(cd.type_line||''); }
function isCreatureType(cd){ return cd && /\bCreature\b/.test(cd.type_line||''); }
function producesMana(cd){ return cd && ((cd.produced&&cd.produced.length) || isLandCard(cd)); }
function sharedPayload(){ const M=state.match; return { phase:M.phase, diceHost:M.diceHost, diceGuest:M.diceGuest, firstHost:M.firstHost, turnHost:M.turnHost }; }
function publishMatch(){ const s=state.session, M=state.match; if(!s||!s.client||!M) return; try{ s.client.publish(roomTopic(s.code), JSON.stringify({sender:s.sender, match:{ seat:seatPayload(), shared:sharedPayload() }}), {retain:true}); }catch(e){} }
function applyMatchMsg(d){
  const M=state.match; if(!M||!d.match) return;
  const seat=d.match.seat, sh=d.match.shared;
  if(seat){ M.opp = { deck:seat.deck, cmd:seat.cmd, life:seat.life, board:seat.board||[], gy:seat.gy||[], exile:seat.exile||[], handCount:seat.handCount||0, libCount:seat.libCount||0, ready:!!seat.ready, cmdDmg:seat.cmdDmg||0, cmdZone:seat.cmdZone!==false, cmdTax:seat.cmdTax||0 }; }
  if(sh){
    const wasMine = (M.amHost===M.turnHost);
    if(!M.amHost){ M.phase=sh.phase; M.diceHost=sh.diceHost; M.diceGuest=sh.diceGuest; M.firstHost=sh.firstHost; }
    if(sh.turnHost!=null) M.turnHost=sh.turnHost;
    const nowMine = (M.amHost===M.turnHost);
    if(M.phase==='play' && !wasMine && nowMine){ matchStartMyTurn(); publishMatch(); }
  }
  maybeAdvanceMatch();
  if(state.tab==='play') renderPlay();
}
function maybeAdvanceMatch(){ const M=state.match; if(!M||!M.amHost) return; if(M.phase==='deck' && M.me.ready && M.opp.ready){ M.phase='dice'; publishMatch(); } }
function matchPickDeck(deckId){
  const d=state.decks.find(x=>x.id===deckId); if(!d) return;
  const lib=[]; for(const cid in d.cards){ for(let k=0;k<d.cards[cid];k++) lib.push(cid); } shuffle(lib);
  const m=state.match.me; m.deck=d.name; m.cmd=d.commander||null; m.life=40; m.board=[]; m.gy=[]; m.exile=[]; state.match.choice=null; state.match.pending=null; state.match.respond=null;
  m.pool=emptyPool(); m.landsThisTurn=0; m.phase=0; m.cmdZone=true; m.cmdTax=0; m.cmdDmg=0; m.firstTurnTaken=false;
  m._lib=lib; m.hand=[]; for(let i=0;i<7 && m._lib.length;i++) m.hand.push(m._lib.shift()); m.libCount=m._lib.length; m.ready=true;
  enrichGameCards(Object.keys(d.cards).concat(d.commander?[d.commander]:[]));
  publishMatch(); maybeAdvanceMatch(); renderPlay();
}
function matchDraw(){ const m=state.match.me; if(m._lib&&m._lib.length){ m.hand.push(m._lib.shift()); m.libCount=m._lib.length; publishMatch(); renderPlay(); } else toast('Library is empty'); }
function matchMulligan(){ const m=state.match.me; const all=m.hand.concat(m._lib); shuffle(all); m._lib=all; m.hand=[]; for(let i=0;i<7 && m._lib.length;i++) m.hand.push(m._lib.shift()); m.libCount=m._lib.length; publishMatch(); renderPlay(); toast('Mulliganed to 7'); }
function matchPlay(idx){
  const m=state.match.me; const cid=m.hand[idx]; if(cid==null) return; const cd=card(cid);
  if(isLandCard(cd)){
    if(m.landsThisTurn>=1){ toast('Only one land per turn'); return; }
    m.hand.splice(idx,1); m.board.push({iid:uid(),cardId:cid,tapped:false,sick:false}); m.landsThisTurn++;
    publishMatch(); renderPlay();
  } else {
    if(/\{X\}/i.test(cd&&cd.mana_cost||'')){ matchPromptX(idx); return; }
    const need=parseCost(cd&&cd.mana_cost);
    if(!poolCanPay(m.pool,need)){ toast('Not enough mana — need '+(manaText(cd&&cd.mana_cost)||'?')+'. Tap lands for mana first.'); return; }
    poolPay(m.pool,need); m.hand.splice(idx,1);
    matchPutOnStack(cid, 0);
  }
}
function matchPromptX(idx){ const m=state.match.me,cid=m.hand[idx],cd=card(cid); const avail=poolTotal(m.pool);
  modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Cast ${cd?esc(cd.name):'spell'} — choose X</h3><div class="tiny muted" style="margin-bottom:8px">Cost ${manaText(cd&&cd.mana_cost)||''} · you have ${avail} mana in your pool.</div><div class="row" style="gap:6px;flex-wrap:wrap">${[0,1,2,3,4,5,6,8,10].map(x=>`<button class="btn sm" onclick="matchPlayX(${idx},${x})">X=${x}</button>`).join('')}</div><button class="btn ghost full" style="margin-top:10px" onclick="closeModal()">Cancel</button></div></div>`; }
function matchPlayX(idx,x){ closeModal(); const m=state.match.me,cid=m.hand[idx],cd=card(cid); if(cid==null) return; const need=parseCost(cd&&cd.mana_cost); need.generic+=Math.max(0,x||0);
  if(!poolCanPay(m.pool,need)){ toast('Not enough mana for X='+x+' — need '+(need.generic)+' generic + colors'); return; }
  poolPay(m.pool,need); m.hand.splice(idx,1); matchPutOnStack(cid, x); }
// ---- the stack: instant-speed response window ----
function matchPutOnStack(cid, xval){ const M=state.match, cd=card(cid); M.pending={cid, xval:xval||0, name:cd?cd.name:'Spell'};

function matchResolveSpell(){ const M=state.match, p=M.pending, m=M.me; if(!p) return; const cd=card(p.cid); const perm=cd && !/\b(instant|sorcery)\b/i.test(cd.type_line||''); M.pending=null;

function matchRespondPass(){ const s=state.session; if(s&&s.client){ try{ s.client.publish(roomTopic(s.code), JSON.stringify({sender:s.sender, matchEvent:{type:'pass'}})); }catch(e){} } state.match.respond=null; renderPlay(); toast('Passed — their spell resolves'); }
function matchRespondInstant(){ const m=state.match.me; const opts=m.hand.map((cid,i)=>({cid,i})).filter(o=>/instant/i.test((card(o.cid)||{}).type_line||'')); if(!opts.length){ toast('No instants in hand to respond with'); return; }

function matchCastResponse(i){ closeModal(); const M=state.match, m=M.me; const cid=m.hand[i], cd=card(cid); if(!cd) return; const need=parseCost(cd.mana_cost); if(!poolCanPay(m.pool,need)){ toast('Not enough mana to cast '+cd.name); return; }
  poolPay(m.pool,need); m.hand.splice(i,1); m.gy.push(cid); const isCounter=/counter target spell/i.test(cd.text||''); matchResolveEffects(cid); M.respond=null;
  const s=state.session; if(s&&s.client){ try{ s.client.publish(roomTopic(s.code), JSON.stringify({sender:s.sender, matchEvent:{type: isCounter?'counter':'pass'}})); }catch(e){} }
  publishMatch(); renderPlay(); toast(isCounter?'Countered their spell!':cd.name+' resolves — their spell still resolves'); }
function matchLife(delta){ const m=state.match.me; m.life+=delta; publishMatch(); renderPlay(); }
function cardHasAbility(cd){ return !!(cd && /return [^.]*from (?:your|a) graveyard to (?:your hand|the battlefield)|(?:cast|play) [^.]*from your hand without paying|put [^.]*from your hand onto the battlefield/i.test(cd.text||'')); }
function matchBoardMenu(iid){ const M=state.match,m=M.me,c=m.board.find(x=>x.iid===iid); if(!c) return; const cd=card(c.cardId); const nm=cd?esc(cd.name):(c.token?esc(c.token)+' token':'Card');

function matchTapBoard(iid){ const m=state.match.me,c=m.board.find(x=>x.iid===iid); if(c){ c.tapped=!c.tapped; publishMatch(); } closeModal(); renderPlay(); }
function matchUseAbility(iid){ const c=state.match.me.board.find(x=>x.iid===iid); closeModal(); if(c && c.cardId!=null) matchResolveEffects(c.cardId); publishMatch(); renderPlay(); }
// ---- mana abilities: parsed from each card's own oracle text ----
function parseManaOutput(s){ s=(s||'').trim();
  let m=s.match(/(one|two|three|four|\d+)\s+mana\s+of\s+any\s+one\s+color/i); if(m) return {kind:'anyOne', count:wordNum(m[1].toLowerCase())};
  m=s.match(/(one|two|three|four|\d+)?\s*mana\s+of\s+any\s+color/i); if(m) return {kind:'any', count:m[1]?wordNum(m[1].toLowerCase()):1};
  const syms=(s.match(/\{[WUBRGC]\}/gi)||[]).map(x=>x.slice(1,-1).toUpperCase());
  if(!syms.length) return null;
  if(/\bor\b/i.test(s) && [...new Set(syms)].length>1) return {kind:'choice', options:[...new Set(syms)], count:1};
  return {kind:'fixed', mana:syms}; }
function manaAbilities(cd){ const out=[]; const text=(cd&&cd.text)||'';
  text.split('\n').forEach(line=>{ const m=line.match(/^(.*?):\s*add\s+(.+?)(?:\.|$)/i); if(!m) return; if(!/\{t\}/i.test(m[1])) return;
    const o=parseManaOutput(m[2]); if(!o) return; out.push({cost:parseCost(m[1].replace(/\{[tq]\}/ig,'')), out:o, label:line.trim()}); });
  if(!out.length){ const cols=(cd&&cd.produced&&cd.produced.length)?[...new Set(cd.produced.map(x=>MANA_COLORS.includes(x)?x:'C'))]:(isLandCard(cd)?['C']:null);
    if(cols) out.push({cost:parseCost(''), out: cols.length>1?{kind:'choice',options:cols,count:1}:{kind:'fixed',mana:[cols[0]]}, label:'{T}: Add '+cols.map(c=>'{'+c+'}').join(' or ')}); }
  return out; }
function manaCostText(need){ let s=''; if(need.generic) s+='{'+need.generic+'}'; MANA_COLORS.forEach(c=>{ for(let i=0;i<(need[c]||0);i++) s+='{'+c+'}'; }); return s||'{0}'; }
function matchTapForMana(iid){ const m=state.match.me,c=m.board.find(x=>x.iid===iid); if(!c) return; const cd=card(c.cardId);
  if(c.tapped){ toast('Already tapped'); return; }
  if(isCreatureType(cd) && c.sick){ toast('Summoning sick — can’t tap until your next turn'); return; }
  const abils=manaAbilities(cd); if(!abils.length){ toast('That doesn’t make mana'); return; }
  if(abils.length===1){ matchActivateMana(iid,0); return; }
  closeModal();
  modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Which mana ability?</h3>${abils.map((a,i)=>`<button class="btn full" style="margin-bottom:6px" onclick="matchActivateMana('${iid}',${i})">${esc(a.label)}</button>`).join('')}<button class="btn ghost full" onclick="closeModal()">Cancel</button></div></div>`; }
function matchActivateMana(iid,ai){ const m=state.match.me,c=m.board.find(x=>x.iid===iid); if(!c||c.tapped){ closeModal(); return; } const cd=card(c.cardId),ab=manaAbilities(cd)[ai]; if(!ab){ closeModal(); return; }
  const costTotal=(ab.cost.generic||0)+MANA_COLORS.reduce((s,x)=>s+(ab.cost[x]||0),0);
  if(costTotal>0){ if(!poolCanPay(m.pool,ab.cost)){ toast('Need '+manaCostText(ab.cost)+' in your pool to activate — tap a land first'); return; } poolPay(m.pool,ab.cost); }
  c.tapped=true; closeModal();
  const o=ab.out;
  if(o.kind==='fixed'){ o.mana.forEach(col=>m.pool[col]=(m.pool[col]||0)+1); publishMatch(); renderPlay(); toast('Added '+o.mana.map(x=>'{'+x+'}').join('')); return; }
  state.match._mana={ need:o.count||1, options:o.kind==='choice'?o.options:MANA_COLORS.slice(), same:o.kind==='anyOne', first:null };
  matchManaColorPrompt(); }
function matchManaColorPrompt(){ const mm=state.match._mana; if(!mm){ return; } if(mm.need<=0){ state.match._mana=null; publishMatch(); renderPlay(); return; }
  const opts=(mm.same&&mm.first)?[mm.first]:mm.options;
  modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this){state.match._mana=null;closeModal();renderPlay();}"><div class="modal"><h3>Add mana — choose a color${mm.need>1?' ('+mm.need+' left)':''}</h3>${opts.map(col=>`<button class="btn full" style="margin-bottom:6px" onclick="matchPickMana('${col}')">{${col}}</button>`).join('')}</div></div>`; }
function matchPickMana(col){ const m=state.match.me,mm=state.match._mana; if(!mm) return; m.pool[col]=(m.pool[col]||0)+1; if(mm.same&&!mm.first) mm.first=col; mm.need--; if(mm.need<=0){ state.match._mana=null; closeModal(); publishMatch(); renderPlay(); toast('Mana added'); } else matchManaColorPrompt(); }
function matchEmptyPool(){ state.match.me.pool=emptyPool(); renderPlay(); }
// ---- turn structure / phases ----
const MATCH_PHASES=['Untap','Upkeep','Draw','Main 1','Combat','Main 2','End'];
function matchStartMyTurn(){
  const M=state.match,m=M.me;
  m.board.forEach(c=>{ c.tapped=false; c.sick=false; c.atk=false; });
  m.pool=emptyPool(); m.landsThisTurn=0;
  const iWentFirst=(M.amHost===M.firstHost);
  const skip=iWentFirst && !m.firstTurnTaken;
  if(!skip && m._lib && m._lib.length){ m.hand.push(m._lib.shift()); m.libCount=m._lib.length; }
  m.firstTurnTaken=true; m.phase=3; // land on Main 1 after auto untap/draw
  toast(skip?'Your turn — first draw skipped (on the play)':'Your turn — untapped &amp; drew');
}
function matchNextPhase(){ const M=state.match,m=M.me; if(M.amHost!==M.turnHost){ toast('It’s not your turn'); return; }
  m.phase=(m.phase==null?0:m.phase)+1;
  if(m.phase>=MATCH_PHASES.length){ matchEndTurn(); return; }
  m.pool=emptyPool(); // mana empties between steps
  toast(MATCH_PHASES[m.phase]); publishMatch(); renderPlay(); }
// ---- command zone ----
function matchCastCommander(){ const m=state.match.me; if(!m.cmd){ toast('No commander set'); return; } if(!m.cmdZone){ toast('Commander is already in play'); return; }
  const cd=card(m.cmd),need=parseCost(cd&&cd.mana_cost); need.generic+=(m.cmdTax||0);
  if(!poolCanPay(m.pool,need)){ toast('Not enough mana — need '+(manaText(cd&&cd.mana_cost)||'?')+(m.cmdTax?' +{'+m.cmdTax+'} tax':'')+'. Tap lands first.'); return; }
  poolPay(m.pool,need); m.cmdZone=false; m.cmdTax+=2; m.board.push({iid:uid(),cardId:m.cmd,tapped:false,sick:true,isCmd:true});
  toast(''+(cd?cd.name:'Commander')+' cast'); publishMatch(); renderPlay(); }
function matchCmdToZone(iid){ const m=state.match.me; if(m.board.some(x=>x.iid===iid)){ m.board=m.board.filter(x=>x.iid!==iid); m.cmdZone=true; } publishMatch(); closeModal(); renderPlay(); }
// ---- combat with keywords ----
function kw(cd){ const has=w=>new RegExp('(^|[\\n,.;( ])'+w+'([\\n,.;) ]|$)','i').test((cd&&cd.text)||''); return {
  flying:has('flying'), reach:has('reach'), firststrike:has('first strike'), doublestrike:has('double strike'),
  deathtouch:has('deathtouch'), trample:has('trample'), menace:has('menace'), vigilance:has('vigilance'), lifelink:has('lifelink'),
  indestructible:has('indestructible'), defender:has('defender'), unblockable:/can[’']?t be blocked/i.test((cd&&cd.text)||'') }; }
function toughOf(cd){ return parseInt(cd&&cd.toughness,10)||1; }
function matchToggleAttacker(iid){ const M=state.match,m=M.me; const c=m.board.find(x=>x.iid===iid); if(!c) return; const cd=card(c.cardId);
  if(!isCreatureType(cd)){ toast('Only creatures can attack'); return; }
  if(kw(cd).defender){ toast('Defender — this creature can’t attack'); return; }
  if(c.sick){ toast('Summoning sick — can’t attack this turn'); return; }

function matchResolveEffects(cardId){

  if(/return [^.]*from (?:your|a) graveyard to (?:your hand|the battlefield)/.test(t) && me.gy.length){
    const toBoard=/from (?:your|a) graveyard to the battlefield/.test(t);
    startMatchChoice('gy','Choose a card to return from your graveyard '+(toBoard?'to the battlefield':'to your hand'),(cid,idx)=>{ me.gy.splice(idx,1); if(toBoard) me.board.push({iid:uid(),cardId:cid,tapped:false,sick:isCreatureType(card(cid))}); else me.hand.push(cid); toast('↩ '+(card(cid)?card(cid).name:'Card')+' returned'); });
    return;

  if((/(?:cast|play) [^.]*from your hand without paying/.test(t) || /put [^.]*from your hand onto the battlefield/.test(t)) && me.hand.length){
    startMatchChoice('hand','Choose a card from your hand to put onto the battlefield',(cid,idx)=>{ me.hand.splice(idx,1); me.board.push({iid:uid(),cardId:cid,tapped:false,sick:isCreatureType(card(cid))}); toast(''+(card(cid)?card(cid).name:'Card')+' put into play'); });

  }

  let rem=null;

function myFriendCode(){ let c=localStorage.getItem('pdb_mycode'); if(!c){ c=genCode(); localStorage.setItem('pdb_mycode',c); } return c; }
// Two friend codes deterministically map to one room code, so either side joining lands together.
function roomFromCodes(a,b){
  const s=[String(a||'').toUpperCase(),String(b||'').toUpperCase()].sort().join('~');
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 symbols = 5 bits each
  let c=''; for(let i=0;i<4;i++){ c+=A[(h>>>(i*5))&31]; }
  return c;
}

function commanderIdentity(deck){
  if(!deck || deck.format!=='Commander' || !deck.commander) return null; // null = no restriction
  const cc=card(deck.commander);
  return (cc && ((cc.ci&&cc.ci.length)?cc.ci:cc.colors)) || [];
}
function withinIdentity(ci, allowed){ return (ci||[]).every(c=>allowed.includes(c)); }
function offColor(obj, cardId, deck){
  const allowed=commanderIdentity(deck); if(!allowed) return false;
  const ci=(obj&&obj.color_identity)||(card(cardId)&&card(cardId).ci)||[];
  return !withinIdentity(ci, allowed);
}
function singletonBlocked(obj, cardId, deck){
  if(!deck || deck.format!=='Commander') return false;
  if(!((deck.cards[cardId]||0)>=1)) return false; // not already in the deck
  const tl=(obj&&obj.type_line)||(card(cardId)&&card(cardId).type_line)||'';
  if(/\bBasic\b/.test(tl)) return false; // basics are unlimited
  const txt=(obj&&obj.oracle_text)||(card(cardId)&&card(cardId).text)||'';
  if(/any number of cards named/i.test(txt)) return false; // Relentless Rats etc.
  return true;
}
function syncCollectionToDeck(deck, cardId){
  const need=deck.cards[cardId]||0;
  if((state.collection[cardId]||0) < need) state.collection[cardId]=need; // own at least what the deck uses
}
function addToDeckDirect(deckId,cardId){
  const c=state._resultMap&&state._resultMap[cardId];
  const d=state.decks.find(x=>x.id===deckId); if(!d) return;
  if(offColor(c,cardId,d)){ toast('Outside '+(card(d.commander)?card(d.commander).name:'your commander')+'’s color identity'); return; }
  if(singletonBlocked(c,cardId,d)){ toast('Singleton format — only one copy (basics excepted)'); return; }
  if(c) cacheCard(c);
  d.cards[cardId]=(d.cards[cardId]||0)+1;
  syncCollectionToDeck(d,cardId);
  DB.save(); toast('Added to '+d.name); render();
}

function parseDeckList(text){
  const cards=[]; let commanderName=null; let section='deck';
  const headerRe=/^(commander|companion|deck|mainboard|main|sideboard|maybeboard|token)/i;
  for(const raw of text.split('\n')){
    const line=raw.trim();
    if(!line) continue;
    if(!/^\d/.test(line) && headerRe.test(line.replace(/[^a-z]/gi,''))){
      const m=line.toLowerCase();
      if(m.startsWith('commander')) section='commander';
      else if(m.startsWith('sideboard')||m.startsWith('maybeboard')||m.startsWith('token')) section='skip';
      else section='deck';
      continue;
    }
    const isCmd=/\*cmdr\*|\*commander\*/i.test(line);
    let qty=1, name=line;
    const qm=line.match(/^(\d+)\s*[xX]?\s+(.*)$/);
    if(qm){ qty=parseInt(qm[1],10)||1; name=qm[2]; }
    name=name.replace(/\*[^*]*\*/g,'')
             .replace(/\([A-Za-z0-9]{2,6}\)\s*[A-Za-z0-9-]*$/,'')
             .replace(/\s+#\d+$/,'')
             .replace(/<[^>]*>/g,'')
             .trim();
    if(name.includes('//')) name=name.split('//')[0].trim();
    if(!name || section==='skip') continue;
    if(section==='commander' || isCmd){ commanderName=name; continue; }
    cards.push({qty,name});
  }
  return {cards, commanderName};
}

async function scryCollection(names){
  const found=[]; const notFound=[];
  for(let i=0;i<names.length;i+=75){
    const chunk=names.slice(i,i+75);
    try{
      const r=await fetch('https://api.scryfall.com/cards/collection',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({identifiers:chunk.map(n=>({name:n}))})
      });
      const d=await r.json();
      (d.data||[]).forEach(c=>found.push(c));
      (d.not_found||[]).forEach(nf=>{ if(nf&&nf.name) notFound.push(nf.name); });
    }catch(e){ chunk.forEach(n=>notFound.push(n)); }
  }
  return {found,notFound};
}

async function importList(name, format, text, statusEl, toCollection){
  const parsed=parseDeckList(text);
  const names=parsed.cards.map(c=>c.name);
  if(parsed.commanderName) names.push(parsed.commanderName);
  const unique=[...new Set(names)];
  if(!unique.length){ if(statusEl) statusEl.textContent='Nothing to import — paste a list first.'; return null; }
  if(statusEl) statusEl.innerHTML='<span class="mini-spin"></span> Looking up '+unique.length+' cards…';
  const {found}=await scryCollection(unique);
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const map={};
  found.forEach(c=>{ map[norm(c.name)]=c; if(c.name.includes('//')) map[norm(c.name.split('//')[0])]=c; });
  const id=uid(); const deck={id,name:name||'Imported Deck',format:format||'Casual',cards:{},commander:null};
  let added=0; const missing=[];
  parsed.cards.forEach(({qty,name})=>{
    const c=map[norm(name)];
    if(c){ cacheCard(c); deck.cards[c.id]=(deck.cards[c.id]||0)+qty; added+=qty; }
    else missing.push(name);
  });
  if(parsed.commanderName){
    const c=map[norm(parsed.commanderName)];
    if(c){ cacheCard(c); deck.commander=c.id; delete deck.cards[c.id]; }
    else missing.push(parsed.commanderName+' (commander)');
  }
  let collAdded=0;
  if(toCollection){
    for(const cid in deck.cards){ const need=deck.cards[cid]; if((state.collection[cid]||0)<need){ collAdded+=need-(state.collection[cid]||0); state.collection[cid]=need; } }
    if(deck.commander && (state.collection[deck.commander]||0)<1){ state.collection[deck.commander]=1; collAdded++; }
  }
  state.decks.push(deck); state.openDeckId=id; DB.save();
  const base = missing.length ? added+' cards in · '+missing.length+' not found' : added+' cards imported';
  toast(toCollection ? base+' · '+collAdded+' added to collection' : base);
  return deck;
}

function mtgoFilePicked(input){ const f=input&&input.files&&input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const t=$('#pasteCollText'); if(t) t.value=String(r.result||''); const s=$('#pasteCollStatus'); if(s) s.textContent='Loaded '+f.name+' — tap “Add to collection”.'; };

// CSV helpers (MTGO collection export)
function parseCsvRow(line){ const out=[]; let cur='',inq=false; for(let i=0;i<line.length;i++){ const ch=line[i];
  if(inq){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inq=false; } else cur+=ch; }
  else { if(ch==='"') inq=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; } }
  out.push(cur); return out; }
function looksLikeMtgoCsv(text){ const first=(text.split(/\r?\n/)[0]||'').toLowerCase(); return /card ?name/.test(first) && /(quantity|qty|count)/.test(first); }
function parseMtgoCsv(text){
  const rows=text.split(/\r?\n/).filter(l=>l.trim().length); if(!rows.length) return [];
  const header=parseCsvRow(rows[0]).map(h=>h.trim().toLowerCase());
  let nameIdx=header.findIndex(h=>/card ?name|^name$/.test(h));
  let qtyIdx=header.findIndex(h=>/quantity|qty|count/.test(h));
  let start=1; if(nameIdx<0){ nameIdx=0; if(qtyIdx<0) qtyIdx=1; start=0; } if(qtyIdx<0) qtyIdx=1;
  const acc={}, order=[];
  for(let i=start;i<rows.length;i++){ const cols=parseCsvRow(rows[i]); let name=(cols[nameIdx]||'').trim(); let qty=parseInt((cols[qtyIdx]||'').trim(),10);
    if(!name) continue; if(isNaN(qty)||qty<0) qty=1; if(name.includes('//')) name=name.split('//')[0].trim();
    if(!(name in acc)){ acc[name]=0; order.push(name); } acc[name]+=qty; }
  return order.map(n=>({name:n, qty:acc[n]})); }
async function runPasteCollection(){
  const text=($('#pasteCollText')&&$('#pasteCollText').value)||'';
  const statusEl=$('#pasteCollStatus');
  let lines;
  if(looksLikeMtgoCsv(text)){ lines=parseMtgoCsv(text); }
  else { const parsed=parseDeckList(text); lines=parsed.cards.slice(); if(parsed.commanderName) lines.push({qty:1,name:parsed.commanderName}); }
  if(!lines.length){ if(statusEl) statusEl.textContent='Nothing to add — paste a list or import an MTGO CSV first.'; return; }
  const unique=[...new Set(lines.map(l=>l.name))];
  if(statusEl) statusEl.innerHTML='<span class="mini-spin"></span> Looking up '+unique.length+' cards…';
  const {found}=await scryCollection(unique);
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const map={}; found.forEach(c=>{ map[norm(c.name)]=c; if(c.name.includes('//')) map[norm(c.name.split('//')[0])]=c; });
  let added=0; const missing=[];
  lines.forEach(({qty,name})=>{ const c=map[norm(name)]; if(c){ cacheCard(c); state.collection[c.id]=(state.collection[c.id]||0)+qty; added+=qty; } else missing.push(name); });
  DB.save(); closeModal(); render();
  toast(missing.length ? added+' cards added · '+missing.length+' not found' : added+' cards added to collection');
}

// ============================================================
//  CARD SCANNER — camera capture + OCR (Tesseract.js) + Scryfall match
// ============================================================
let scanStream=null, scanBusy=false;

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Failed to load OCR engine'));
    document.head.appendChild(s);
  });
}

async function openScanner(){

        <button class="scan-x" onclick="closeScanner()">✕</button>
        <button id="scanShutter" class="shutter" onclick="captureScan()" aria-label="Capture"></button>

      </div>
    </div>`;
  const video=$('#scanVideo');

function closeScanner(){

function setScanStatus(msg,busy){
  const el=$('#scanStatus'); if(!el) return;
  el.classList.toggle('hidden',!msg);
  el.innerHTML = msg ? `${busy?'<span class="mini-spin"></span>':''}<span>${esc(msg)}</span>` : '';
}

// Map a rect in the video's displayed (CSS) coords to source pixel coords, accounting for object-fit:cover
function displayToSource(video,dx,dy,dw,dh){
  const vw=video.videoWidth, vh=video.videoHeight, cw=video.clientWidth, ch=video.clientHeight;
  const scale=Math.max(cw/vw, ch/vh);
  const offX=(vw*scale-cw)/2, offY=(vh*scale-ch)/2;
  return {x:(dx+offX)/scale, y:(dy+offY)/scale, w:dw/scale, h:dh/scale};
}

// Grayscale + global threshold to help OCR read the title bar
function binarize(ctx,canvas){
  const img=ctx.getImageData(0,0,canvas.width,canvas.height), d=img.data; let sum=0;
  for(let i=0;i<d.length;i+=4){ const g=0.3*d[i]+0.59*d[i+1]+0.11*d[i+2]; d[i]=d[i+1]=d[i+2]=g; sum+=g; }
  const t=(sum/(d.length/4))*0.92;
  for(let i=0;i<d.length;i+=4){ const v=d[i]>t?255:0; d[i]=d[i+1]=d[i+2]=v; }
  ctx.putImageData(img,0,0);
}

let _ocrWorker=null;
async function getOcrWorker(){
  await loadTesseract();
  if(!_ocrWorker){
    _ocrWorker = await Tesseract.createWorker('eng');
    try{ await _ocrWorker.setParameters({ tessedit_pageseg_mode:'7', tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ',-" }); }catch(e){}
  }
  return _ocrWorker;
}
function cleanName(t){
  const line=(t||'').split('\n').map(s=>s.trim()).filter(s=>s.length>1)[0]||'';
  return line.replace(/[^A-Za-z',\- ]/g,'').replace(/\s+/g,' ').trim();
}

async function captureScan(){
  if(scanBusy) return;
  const video=$('#scanVideo');
  if(!video||!video.videoWidth){ toast('Camera still warming up…'); return; }
  scanBusy=true; $('#scanShutter')?.classList.add('busy');
  setScanStatus('Reading card…',true);
  try{
    const g=$('#scanGuide').getBoundingClientRect();
    const vr=video.getBoundingClientRect();
    const dx=(g.left-vr.left)+g.width*0.045;
    const dy=(g.top-vr.top)+g.height*0.035;
    const src=displayToSource(video,dx,dy,g.width*0.80,g.height*0.135);
    const canvas=document.createElement('canvas');
    canvas.width=1100; canvas.height=Math.max(60,Math.round(1100*src.h/src.w));
    const cx=canvas.getContext('2d');
    cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
    cx.drawImage(video,src.x,src.y,src.w,src.h,0,0,canvas.width,canvas.height);
    binarize(cx,canvas);
    const worker=await getOcrWorker();
    const {data}=await worker.recognize(canvas);
    const name=cleanName(data.text);
    if(!name){ setScanStatus('Couldn’t read the name — fill the gold strip with just the title and retry',false); return; }
    await matchScan(name);
  }catch(e){
    setScanStatus('Scan failed — try again',false);
  }finally{
    scanBusy=false; $('#scanShutter')?.classList.remove('busy');
  }
}

async function scryNamed(name){
  try{ const r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(name)); if(r.ok) return await r.json(); }catch(e){}
  return null;
}

async function matchScan(name){
  setScanStatus('Matching “'+name+'”…',true);
  const cands=[], seen=new Set();
  const add=c=>{ if(c&&!seen.has(c.id)){ seen.add(c.id); cands.push(c); } };
  add(await scryNamed(name)); // best fuzzy match first
  try{ const r=await fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(name)); if(r.ok){ const d=await r.json(); const names=(d.data||[]).slice(0,8); if(names.length){ (await scryCollection(names)).found.forEach(add); } } }catch(e){}
  if(!cands.length){ try{ const r=await fetch('https://api.scryfall.com/cards/search?q='+encodeURIComponent(name)); if(r.ok){ const d=await r.json(); (d.data||[]).slice(0,8).forEach(add); } }catch(e){} }
  setScanStatus('',false);
  showScanResult(name, cands);
}
function showScanResult(readName, cands){
  const box=$('#scanResult'); if(!box) return; box.classList.remove('hidden');
  state._scanCands={}; (cands||[]).forEach(c=>state._scanCands[c.id]=c);
  let h=`<div class="row" style="gap:8px;margin-bottom:8px"><input id="scanEditInput" class="scan-input" value="${esc(readName)}" autocomplete="off" style="flex:1"><button class="btn" onclick="scanResearch()"></button></div>`;
  if(!cands||!cands.length){
    h+=`<div class="tiny muted" style="text-align:center;padding:6px 0 10px">No match — fix the name above and tap</div>`;
  } else {
    h+=`<div class="tiny muted" style="margin-bottom:6px">Tap the right card to add it:</div>`;
    h+=cands.map(c=>{ const img=(c.image_uris&&c.image_uris.small)||(c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.small)||''; const owned=state.collection[c.id]||0;

    }).join('');
  }
  h+=`<button class="btn ghost full" style="margin-top:8px" onclick="scanDismiss()">Scan next</button>`;
  box.innerHTML=h;
}

function googleSignIn(){ applyPersistence().then(()=>_auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())).then(()=>{ closeModal(); toast('Signed in'); }).catch(e=>toast('Google: '+(e.code||e.message||'').replace('auth/',''))); }

// cloud sync
let cloudPushTimer=null;
function scheduleCloudPush(){ if(!state.user||!window._db) return; clearTimeout(cloudPushTimer); cloudPushTimer=setTimeout(pushCloud,1200); }
function pushCloud(){ if(!state.user||!window._db) return; window._db.collection('users').doc(state.user.uid).set({decks:state.decks,collection:state.collection,cards:state.cards,wishlist:state.wishlist,_ts:Date.now()}).catch(()=>{}); }
function mergeData(cloud, local){
  if(!cloud) return local;
  const ids=new Set((cloud.decks||[]).map(d=>d.id));
  const decks=[...(cloud.decks||[]), ...local.decks.filter(d=>!ids.has(d.id))];
  const collection={...(cloud.collection||{})};
  for(const k in (local.collection||{})) collection[k]=Math.max(collection[k]||0, local.collection[k]);
  const cards={...(local.cards||{}), ...(cloud.cards||{})};
  const wishlist={...(cloud.wishlist||{}), ...(local.wishlist||{})};
  return {decks,collection,cards,wishlist};
}
async function subscribeCloud(uid){
  const ref=window._db.collection('users').doc(uid);
  try{
    const snap=await ref.get();
    const cloud=snap.exists?snap.data():null;
    const merged=mergeData(cloud,{decks:state.decks,collection:state.collection,cards:state.cards,wishlist:state.wishlist});
    window._applyingRemote=true; state.decks=merged.decks; state.collection=merged.collection; state.cards=merged.cards; state.wishlist=merged.wishlist; DB.save(); window._applyingRemote=false;
    await ref.set({decks:merged.decks,collection:merged.collection,cards:merged.cards,wishlist:merged.wishlist,_ts:Date.now()});
    render();
  }catch(e){ toast('Sync: '+(e.code||'check Firestore rules')); }
  window._cloudUnsub=ref.onSnapshot(snap=>{
    const data=snap.data(); if(!data) return;
    const incoming=JSON.stringify({d:data.decks||[],c:data.collection||{},k:data.cards||{},w:data.wishlist||{}});
    const localStr=JSON.stringify({d:state.decks,c:state.collection,k:state.cards,w:state.wishlist});
    if(incoming!==localStr){ window._applyingRemote=true; state.decks=data.decks||[]; state.collection=data.collection||{}; state.cards=data.cards||{}; state.wishlist=data.wishlist||{}; DB.save(); window._applyingRemote=false; render(); }
  });
}

if('serviceWorker' in navigator){
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_swReloaded) return; _swReloaded=true; location.reload(); });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update();
      setInterval(()=>{ reg.update().catch(()=>{}); }, 60000); // check for a new version every minute
