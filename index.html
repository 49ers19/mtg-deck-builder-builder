<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Grimoire Games — MTG Deck Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f1a; --bg2:#141828; --panel:#1b2036; --panel2:#232a44;
  --line:#2c3458; --text:#e8eaf2; --muted:#8b93b8; --accent:#c9a227; --accent2:#e3c14b;
  --W:#f8f6d8; --U:#aae0fa; --B:#bcb6b0; --R:#f9a98a; --G:#9bd6a3; --C:#c8cbe0;
  --danger:#e0556b; --ok:#4caf7d;
  --safe-b:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;min-height:100dvh}
h1,h2,h3,.brand{font-family:'Cinzel',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.hidden{display:none!important}

/* Header */
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;background:linear-gradient(180deg,#161a2e,#0d0f1a);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-size:20px;font-weight:700;letter-spacing:.5px;color:var(--accent2);display:flex;align-items:center;gap:9px}
.brand .gem{width:16px;height:16px;transform:rotate(45deg);background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:3px;box-shadow:0 0 12px rgba(227,193,75,.5)}
.sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
.hdr-actions{position:absolute;top:calc(env(safe-area-inset-top) + 13px);right:12px;display:flex;gap:6px}
.hdr-btn{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#23200a;border:1px solid var(--accent);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.hdr-btn.acct{background:var(--panel2);color:var(--text);border-color:var(--line)}
.filt-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filt{background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:12px;padding:8px 9px;font-family:inherit}
.filt-q{flex:1 1 130px;min-width:120px}
.filt-q:focus,select.filt:focus{outline:none;border-color:var(--accent)}
.filt-clr{cursor:pointer;font-weight:700;color:var(--muted)}
select.filt{flex:0 0 auto}

/* Main scroll area */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(86px + var(--safe-b))}

/* Bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:#11131f;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:30}
nav button{flex:1;padding:11px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;transition:color .15s}
nav button .ic{font-size:20px;line-height:1}
nav button.active{color:var(--accent2)}
nav button.active .ic{filter:drop-shadow(0 0 6px rgba(227,193,75,.5))}

/* Cards / panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:4px 2px 10px}

/* Buttons */
.btn{background:linear-gradient(180deg,#2a3252,#222a45);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .12s,transform .05s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#23200a;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#48283a}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.iconbtn{width:32px;height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}

/* Search input */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 42px 13px 14px;color:var(--text);font-size:15px}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.search-wrap .spin{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

/* Result card row */
.cardrow{display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:9px;align-items:center}
.cardrow .thumb{width:46px;height:64px;border-radius:6px;background:var(--bg2) center/cover;flex-shrink:0;border:1px solid var(--line)}
.cardrow .info{flex:1;min-width:0}
.cardrow .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardrow .meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pip{width:13px;height:13px;border-radius:50%;display:inline-block;font-size:9px;text-align:center;line-height:13px;font-weight:700;color:#1a1a1a}
.pip.W{background:var(--W)}.pip.U{background:var(--U)}.pip.B{background:var(--B)}.pip.R{background:var(--R)}.pip.G{background:var(--G)}.pip.C{background:var(--C)}
.qtybox{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qtybox .n{min-width:20px;text-align:center;font-weight:700;font-size:15px}

/* Deck list items */
.decktile{background:linear-gradient(135deg,#1d2238,#161a2c);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px;display:flex;align-items:center;gap:12px}
.decktile .col{flex:1;min-width:0}
.decktile .dn{font-weight:700;font-size:16px;font-family:'Cinzel',serif}
.decktile .ds{font-size:12px;color:var(--muted);margin-top:3px}
.colorbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--bg2)}
.colorbar i{display:block;height:100%}

/* Stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}
.stat .v{font-size:22px;font-weight:700;font-family:'Cinzel',serif;color:var(--accent2)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.curve{display:flex;align-items:flex-end;gap:5px;height:90px;padding-top:8px}
.curve .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.curve .bar .fill{width:100%;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:4px 4px 0 0;min-height:3px;transition:height .3s}
.curve .bar .cnt{font-size:10px;color:var(--muted);font-weight:600}
.curve .bar .lbl{font-size:10px;color:var(--muted)}

/* Empty states */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:12px;opacity:.7}
.empty .t{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,6,12,.7);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:20px 18px calc(22px + var(--safe-b));animation:slideup .22s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-size:15px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}

/* Detail header */
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.detail-head .back{font-size:22px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.detail-head .ttl{flex:1;font-size:19px;font-weight:700;font-family:'Cinzel',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* group header within deck */
.grp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 8px;display:flex;justify-content:space-between}
.toast{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%);background:#23304a;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.addmenu{display:flex;flex-direction:column;gap:8px}

/* Scanner */
.scanner{position:fixed;inset:0;background:#000;z-index:80;overflow:hidden}
#scanVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.scan-frame{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 18px}
.scan-guide{position:relative;width:min(80vw,330px);aspect-ratio:63/88;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan-guide .name-strip{position:absolute;top:4%;left:5%;width:78%;height:12%;border:2px solid var(--accent2);border-radius:5px;box-shadow:0 0 10px rgba(227,193,75,.5)}
.scan-hint{margin-top:18px;color:#fff;font-size:12px;text-align:center;background:rgba(0,0,0,.5);padding:7px 12px;border-radius:20px;max-width:300px;line-height:1.5}
.scan-status{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);background:rgba(20,24,40,.92);border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;z-index:5;max-width:88vw}
.mini-spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
.scan-controls{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:20px 28px calc(24px + var(--safe-b));z-index:6}
.scan-x{width:46px;height:46px;border-radius:50%;background:rgba(20,24,40,.85);border:1px solid var(--line);color:#fff;font-size:20px}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);transition:transform .1s}
.shutter:active{transform:scale(.92)}
.shutter.busy{opacity:.5;pointer-events:none}
.scan-result{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--safe-b));z-index:7;animation:slideup .2s ease}
.scan-result .scan-card{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.scan-result .scan-card .thumb{width:48px;height:67px;border-radius:6px;background:var(--bg2) center/cover;border:1px solid var(--line);flex-shrink:0}
.scan-result .scan-card .info{min-width:0}
.scan-result .scan-card .nm{font-weight:700;font-size:15px}
.scan-result .scan-card .meta{font-size:12px;color:var(--muted);margin-top:3px}
.scan-actions{display:flex;flex-direction:column;gap:9px}
.scan-input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font-size:15px}
.scan-input:focus{outline:none;border-color:var(--accent)}

/* Commander slot */
.cmd-panel{border-color:var(--accent)}
.cmd-card{display:flex;gap:11px;align-items:center}
.cmd-card .thumb{width:46px;height:64px;border-radius:6px;background:var(--bg2) center/cover;border:1px solid var(--accent);flex-shrink:0}
.cmd-card .info{flex:1;min-width:0}
.cmd-card .nm{font-weight:700;font-size:14px}
.cmd-card .meta{font-size:11px;color:var(--muted);margin-top:2px}
.cmd-empty{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--accent);background:rgba(201,162,39,.06);cursor:pointer}
.cmd-empty .cmd-plus{width:42px;height:42px;border-radius:10px;background:rgba(201,162,39,.15);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.cmd-empty .nm{font-weight:700;font-size:14px}
.pick-banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(201,162,39,.12);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.pick-banner button{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text)}
.imp-text{width:100%;min-height:150px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;line-height:1.55}
.imp-text:focus{outline:none;border-color:var(--accent)}
.precon-list{max-height:210px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;margin-top:7px;background:var(--bg2)}
.precon-row{display:flex;width:100%;text-align:left;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;background:none;color:var(--text)}
.precon-row span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.precon-row:last-child{border-bottom:none}
.precon-row:active{background:var(--panel2)}

/* Play / life counter */
.play-ctrl{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.pc-group{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.pc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.pc-btn{min-width:30px;padding:6px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:13px}
.pc-btn.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#23200a;border-color:var(--accent)}
.pcard{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.pname{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;text-align:center}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lifeval{font-family:'Cinzel',serif;font-weight:700;font-size:54px;line-height:1;min-width:90px;text-align:center}
.lifebtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-weight:700;transition:transform .05s}
.lifebtn.big{width:62px;height:62px;font-size:30px;flex-shrink:0}
.lifebtn:active{transform:scale(.94)}
.prow5{display:flex;gap:10px;margin-top:10px}
.prow5 .lifebtn{flex:1;padding:9px;font-size:14px}
.counters{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.ctr{display:flex;align-items:center;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px 4px}
.ctr.cmd{border-color:var(--c)}
.ctr-lbl{font-size:11px;font-weight:700;color:var(--muted);padding:0 3px}
.ctr.cmd .ctr-lbl{color:var(--c)}
.ctr button{width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.ctr-n{min-width:18px;text-align:center;font-weight:700;font-size:14px}
.ctr.danger{border-color:var(--danger)}
.ctr.danger .ctr-n{color:var(--danger)}

/* Solo playtest */
.game-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.game-top .ttl{flex:1;font-family:'Cinzel',serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-badge{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--accent2);flex-shrink:0}
.game-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gcount{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.gcount b{color:var(--text);font-size:14px}
.zone{margin-bottom:12px}
.zone.bf{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:84px}
.zone-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.zone-cards{display:flex;flex-wrap:wrap;gap:6px}
.gcard{position:relative;width:48px;height:67px;border-radius:5px;background:var(--bg2) center/cover;border:1px solid var(--line);cursor:pointer;flex-shrink:0;transition:transform .08s}
.gcard-ctr{position:absolute;bottom:2px;right:2px;background:var(--ok);color:#0d0f1a;font-size:8px;font-weight:800;padding:1px 3px;border-radius:4px;line-height:1.1}
.gcard:active{transform:scale(1.05)}
.gcard.tapped{opacity:.45;filter:grayscale(.6);transform:rotate(10deg)}
.gcard.noimg{display:flex;align-items:center;justify-content:center;padding:3px;background:var(--panel2)}
.gcard-lbl{font-size:8px;line-height:1.1;font-weight:700;color:var(--text);text-align:center;overflow:hidden}
.card-text{font-size:12px;line-height:1.5;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px;max-height:170px;overflow-y:auto;white-space:pre-wrap}
.abil{display:flex;align-items:flex-start;gap:8px;text-align:left;white-space:normal;font-weight:500;font-size:12px;line-height:1.45;padding:10px 12px;margin-bottom:7px}
.abil-tag{flex:0 0 auto;font-size:9px;font-weight:800;color:var(--muted);background:rgba(139,147,184,.15);border-radius:4px;padding:2px 5px;margin-top:1px;white-space:nowrap}
.tag-use{color:#23200a;background:var(--accent2)}
.abil-info{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.45;padding:10px 12px;margin-bottom:7px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.opp-panel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#2a1d22,#1b1518);border:1px solid var(--danger);border-radius:14px;padding:11px 13px;margin-bottom:12px}
.opp-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.opp-v{font-family:'Cinzel',serif;font-weight:700;font-size:30px;color:var(--danger);line-height:1.1}
.opp-v.dead{color:var(--ok)}
.opp-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.phase-bar{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ph{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 3px;white-space:nowrap;text-transform:uppercase;letter-spacing:.2px}
.ph.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#23200a;border-color:var(--accent)}
.mana-bar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.mana{flex:1;min-width:42px;border:1px solid var(--line);border-radius:8px;padding:7px 4px;font-size:12px;font-weight:700;color:#1a1a1a;display:flex;align-items:center;justify-content:center;gap:3px}
.mana b{font-size:13px}
.mana-W{background:var(--W)}.mana-U{background:var(--U)}.mana-B{background:var(--B)}.mana-R{background:var(--R)}.mana-G{background:var(--G)}.mana-C{background:var(--C)}

.mana:active{transform:scale(.95)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="gem"></span>Grimoire Games</div>
  <div class="sub" id="subtitle">Magic: The Gathering deck builder &amp; collection</div>
  <div class="hdr-actions">
    <button id="acctBtn" class="hdr-btn acct" onclick="openAccount()">👤 Sign in</button>
    <button id="installBtn" class="hdr-btn hidden" onclick="installApp()">⤓ Install</button>
  </div>
</header>

<main id="main"></main>

<nav>
  <button data-tab="decks" class="active"><span class="ic">🗂️</span>Decks</button>
  <button data-tab="search"><span class="ic">🔍</span>Search</button>
  <button data-tab="collection"><span class="ic">📚</span>Collection</button>
  <button data-tab="play"><span class="ic">⚔️</span>Play</button>
  <button data-tab="analyze"><span class="ic">📊</span>Analyze</button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ============================================================
//  GRIMOIRE GAMES — MTG deck builder + collection tracker
//  Single-file app. Data in localStorage. Cards via Scryfall.
// ============================================================
const $ = (s,el=document)=>el.querySelector(s);
const main = $('#main'), modalRoot = $('#modalRoot'), toastRoot = $('#toastRoot');

// ---------- Persistence ----------
const DB = {
  load(){
    try{
      return {
        decks: JSON.parse(localStorage.getItem('pdb_decks')||'[]'),
        collection: JSON.parse(localStorage.getItem('pdb_collection')||'{}'),
        cards: JSON.parse(localStorage.getItem('pdb_cards')||'{}'),
      };
    }catch(e){ return {decks:[],collection:{},cards:{}}; }
  },
  save(){
    localStorage.setItem('pdb_decks', JSON.stringify(state.decks));
    localStorage.setItem('pdb_collection', JSON.stringify(state.collection));
    localStorage.setItem('pdb_cards', JSON.stringify(state.cards));
    if(state.user && !window._applyingRemote) scheduleCloudPush();
  }
};
const loaded = DB.load();
const state = {
  tab:'decks',
  decks: loaded.decks,        // [{id,name,format,cards:{cardId:qty}}]
  collection: loaded.collection, // {cardId:qty}
  cards: loaded.cards,        // {cardId:{cached card fields}}
  openDeckId: null,
  searchResults: [],
  searchQuery: '',
  play: { count:2, start:40, life:[40,40], poison:[0,0], cmd:[[0,0],[0,0]], mode:'life' },
  game: null,
  session: null,
  collFilter: { q:'', type:'', color:'', cmc:'', rarity:'' },
  analyzeDeckId: null,
  analyzeRecs: {},
  user: null,
};

const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ---------- Card cache helper ----------
function cacheCard(c){
  if(!state.cards[c.id]){
    state.cards[c.id] = {
      id:c.id, name:c.name, mana_cost:c.mana_cost||'', cmc:c.cmc||0,
      type_line:c.type_line||'', colors:c.colors||c.color_identity||[],
      img: (c.image_uris&&c.image_uris.normal) || (c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.normal) || '',
      thumb:(c.image_uris&&c.image_uris.small) || (c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.small) || '',
      set:(c.set||'').toUpperCase(), rarity:c.rarity||'', price:(c.prices&&c.prices.usd)||null,
      produced:c.produced_mana||[],
      text: oracleText(c),
      ci: c.color_identity||[],
      power: (c.power!=null?c.power:(c.card_faces&&c.card_faces[0]&&c.card_faces[0].power))||null,
      legal: c.legalities||{},
    };
  }
  return state.cards[c.id];
}
function oracleText(c){ if(c.oracle_text!=null) return c.oracle_text; if(c.card_faces) return c.card_faces.map(f=>f.oracle_text||'').join(' // '); return ''; }
const card = id => state.cards[id];

// ---------- Toast ----------
let toastT;
function toast(msg){
  toastRoot.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toastT); toastT = setTimeout(()=>toastRoot.innerHTML='',1600);
}

// ---------- Mana pip rendering ----------
const COLOR_NAMES={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green',C:'Colorless'};
function pips(colors){
  if(!colors||!colors.length) return '<span class="pips"><span class="pip C">◇</span></span>';
  return '<span class="pips">'+colors.map(c=>`<span class="pip ${c}">${c}</span>`).join('')+'</span>';
}

// ---------- Scryfall ----------
let searchTimer, searchSeq=0;
async function scrySearch(q){
  const seq = ++searchSeq;
  if(!q.trim()){ state.searchResults=[]; if(state.tab==='search') render(); return; }
  setSearchLoading(true);
  try{
    const query = state.pickCommanderFor ? '('+q+') is:commander' : q;
    const r = await fetch('https://api.scryfall.com/cards/search?unique=cards&order=name&q='+encodeURIComponent(query));
    if(seq!==searchSeq) return; // stale
    if(r.status===404){ state.searchResults=[]; }
    else{ const d = await r.json(); state.searchResults = (d.data||[]).slice(0,40); }
  }catch(e){ state.searchResults=[]; toast('Network error'); }
  if(seq===searchSeq){ setSearchLoading(false); if(state.tab==='search') render(); }
}
function setSearchLoading(b){
  const sp = $('#searchSpin'); if(sp) sp.classList.toggle('hidden',!b);
}

// ============================================================
//  RENDER
// ============================================================
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='decks') state.openDeckId ? renderDeckDetail() : renderDecks();
  else if(state.tab==='search') renderSearch();
  else if(state.tab==='collection') renderCollection();
  else if(state.tab==='play') renderPlay();
  else if(state.tab==='analyze') renderAnalyze();
  $('#subtitle').textContent = ({
    decks:'Your decks', search:'Find cards on Scryfall', collection:'Cards you own', play:'Life counter & playtest', analyze:'Deck analysis'
  })[state.tab] || '';
}

// ---------- DECKS LIST ----------
function deckColorCounts(deck){
  const counts={W:0,U:0,B:0,R:0,G:0,C:0}; let total=0;
  const tally=(id,q)=>{
    const c=card(id); if(!c) return;
    const cols=c.colors&&c.colors.length?c.colors:['C'];
    cols.forEach(col=>{counts[col]=(counts[col]||0)+q; total+=q;});
  };
  for(const id in deck.cards) tally(id, deck.cards[id]);
  if(deck.commander) tally(deck.commander, 1);
  return {counts,total};
}
function deckCardCount(deck){ let n=deck.commander?1:0; for(const id in deck.cards) n+=deck.cards[id]; return n; }

function renderDecks(){
  let h = `<div class="row between" style="margin-bottom:14px">
      <div class="section-title" style="margin:0">Your Decks (${state.decks.length})</div>
      <div style="display:flex;gap:8px">
        <button class="btn sm" onclick="openImport()">📋 Import</button>
        <button class="btn gold sm" onclick="openDeckModal()">＋ New</button>
      </div>
    </div>`;
  if(!state.decks.length){
    h += `<div class="empty"><div class="big">🗂️</div><div class="t">No decks yet</div>
      <div class="tiny">Build one card by card, or paste an existing list.</div>
      <button class="btn gold full" style="margin-top:18px" onclick="openDeckModal()">＋ Build your first deck</button>
      <button class="btn full" style="margin-top:9px" onclick="openImport()">📋 Import a deck list</button></div>`;
  } else {
    state.decks.forEach(d=>{
      const {counts,total}=deckColorCounts(d);
      const n=deckCardCount(d);
      const bar = total? Object.keys(counts).filter(k=>counts[k]).map(k=>
        `<i style="width:${(counts[k]/total*100).toFixed(1)}%;background:var(--${k})"></i>`).join('') : '<i style="width:100%;background:var(--line)"></i>';
      const cmd = d.commander && card(d.commander);
      const sub = cmd ? `👑 ${esc(cmd.name)} · ${n} cards` : `${d.format||'Casual'} · ${n} card${n===1?'':'s'}`;
      h += `<div class="decktile" onclick="openDeck('${d.id}')">
        <div class="col">
          <div class="dn">${esc(d.name)}</div>
          <div class="ds">${sub}</div>
          <div class="colorbar">${bar}</div>
        </div>
        <div style="font-size:22px;color:var(--muted)">›</div>
      </div>`;
    });
  }
  main.innerHTML = h;
}

// ---------- DECK DETAIL ----------
function renderDeckDetail(){
  const d = state.decks.find(x=>x.id===state.openDeckId);
  if(!d){ state.openDeckId=null; return renderDecks(); }
  const n = deckCardCount(d);
  const {counts,total}=deckColorCounts(d);

  // mana curve (nonland)
  const buckets=[0,0,0,0,0,0,0,0]; // 0..6, 7+
  let lands=0, avgNum=0, avgDen=0;
  for(const id in d.cards){
    const c=card(id); if(!c) continue;
    const q=d.cards[id];
    if(/\bLand\b/.test(c.type_line)){ lands+=q; continue; }
    const b=Math.min(7,Math.floor(c.cmc||0));
    buckets[b]+=q; avgNum+=(c.cmc||0)*q; avgDen+=q;
  }
  const maxB = Math.max(1,...buckets);
  const avg = avgDen? (avgNum/avgDen).toFixed(2) : '0.00';

  // group cards by type
  const groups = groupDeckCards(d);

  // commander slot (Commander format only)
  let commanderHTML = '';
  if(d.format==='Commander'){
    if(d.commander){
      const cc=card(d.commander);
      commanderHTML = `<div class="panel cmd-panel">
        <div class="section-title" style="margin-top:0">Commander</div>
        <div class="cmd-card">
          <div class="thumb" style="background-image:url('${cc?cc.thumb:''}')" onclick="showCard('${d.commander}')"></div>
          <div class="info" onclick="showCard('${d.commander}')">
            <div class="nm">${cc?esc(cc.name):'—'} ${cc?pips(cc.colors&&cc.colors.length?cc.colors:['C']):''}</div>
            <div class="meta">${cc?esc(shortType(cc.type_line)):''}</div>
          </div>
          <button class="btn ghost sm" onclick="startPickCommander('${d.id}')">Change</button>
          <button class="iconbtn" onclick="removeCommander('${d.id}')">✕</button>
        </div>
      </div>`;
    } else {
      commanderHTML = `<div class="panel cmd-empty" onclick="startPickCommander('${d.id}')">
        <div class="cmd-plus">＋</div>
        <div><div class="nm">Set your commander</div><div class="tiny muted">Pick the legendary creature that leads this deck</div></div>
      </div>`;
    }
  }

  let h = `<div class="detail-head">
      <button class="back" onclick="closeDeck()">‹</button>
      <div class="ttl">${esc(d.name)}</div>
      <button class="iconbtn" onclick="openDeckModal('${d.id}')">✎</button>
    </div>
    ${commanderHTML}
    <div class="statgrid">
      <div class="stat"><div class="v">${n}</div><div class="l">Cards</div></div>
      <div class="stat"><div class="v">${lands}</div><div class="l">Lands</div></div>
      <div class="stat"><div class="v">${avg}</div><div class="l">Avg CMC</div></div>
    </div>
    <button class="btn gold full" style="margin-bottom:12px" onclick="startAddingTo('${d.id}')">＋ Add cards to this deck</button>`;

  // color identity bar
  if(total){
    h += `<div class="panel"><div class="section-title" style="margin-top:0">Color Breakdown</div><div class="row" style="flex-wrap:wrap;gap:10px">`;
    Object.keys(counts).filter(k=>counts[k]).forEach(k=>{
      h+=`<div class="row" style="gap:5px">${pips([k])}<span class="tiny muted">${COLOR_NAMES[k]} ${counts[k]}</span></div>`;
    });
    h+=`</div></div>`;
  }

  // mana curve
  if(avgDen){
    h += `<div class="panel"><div class="section-title" style="margin-top:0">Mana Curve</div><div class="curve">`;
    buckets.forEach((cnt,i)=>{
      h+=`<div class="bar"><span class="cnt">${cnt||''}</span><div class="fill" style="height:${cnt/maxB*100}%"></div><span class="lbl">${i===7?'7+':i}</span></div>`;
    });
    h+=`</div></div>`;
  }

  // card list grouped
  if(!n){
    h += `<div class="empty"><div class="big">🃏</div><div class="t">No cards yet</div>
      <div class="tiny">Add the rest of your deck — search and tap ＋.</div>
      <button class="btn gold full" style="margin-top:16px" onclick="startAddingTo('${d.id}')">🔍 Add cards</button></div>`;
  } else {
    for(const g of groups){
      h += `<div class="grp"><span>${g.name}</span><span>${g.count}</span></div>`;
      g.items.forEach(({id,qty})=>{
        const c=card(id); if(!c) return;
        h += cardRowHTML(c, qty, `deckQty('${d.id}','${id}',-1)`, `deckQty('${d.id}','${id}',1)`);
      });
    }
  }
  main.innerHTML = h;
}

function groupDeckCards(d){
  const order=['Creature','Planeswalker','Instant','Sorcery','Artifact','Enchantment','Land','Other'];
  const map={}; order.forEach(o=>map[o]=[]);
  for(const id in d.cards){
    const c=card(id); if(!c) continue;
    const t=c.type_line||'';
    let g='Other';
    for(const o of order){ if(o!=='Other' && new RegExp('\\b'+o+'\\b').test(t)){ g=o; break; } }
    map[g].push({id,qty:d.cards[id]});
  }
  return order.filter(o=>map[o].length).map(o=>({
    name:o==='Other'?'Other':o+'s',
    count:map[o].reduce((s,x)=>s+x.qty,0),
    items:map[o].sort((a,b)=>card(a.id).name.localeCompare(card(b.id).name))
  }));
}

// ---------- Generic card row ----------
function cardRowHTML(c, qty, decFn, incFn){
  return `<div class="cardrow">
    <div class="thumb" style="background-image:url('${c.thumb||''}')" onclick="showCard('${c.id}')"></div>
    <div class="info" onclick="showCard('${c.id}')">
      <div class="nm">${esc(c.name)}</div>
      <div class="meta">${manaText(c.mana_cost)} · ${esc(shortType(c.type_line))}</div>
    </div>
    <div class="qtybox">
      <button class="iconbtn" onclick="event.stopPropagation();${decFn}">−</button>
      <span class="n">${qty}</span>
      <button class="iconbtn" onclick="event.stopPropagation();${incFn}">＋</button>
    </div>
  </div>`;
}
function shortType(t){ return (t||'').split('—')[0].trim(); }
function manaText(m){ return m? m.replace(/[{}]/g,'').replace(/\//g,'/') || '—' : '—'; }

// ---------- SEARCH ----------
function renderSearch(){
  const picking = state.pickCommanderFor ? state.decks.find(x=>x.id===state.pickCommanderFor) : null;
  const adding = (!picking && state.addToDeckId) ? state.decks.find(x=>x.id===state.addToDeckId) : null;
  let h = '';
  if(picking){
    h += `<div class="pick-banner">👑 Choosing commander for <b>${esc(picking.name)}</b><button onclick="cancelPickCommander()">Cancel</button></div>`;
  }
  if(adding){
    h += `<div class="pick-banner">🗂️ Adding to <b>${esc(adding.name)}</b><button onclick="finishAdding()">Done</button></div>`;
  }
  h += `<div class="search-wrap">
      <input id="searchInput" placeholder="${picking?'Search for a commander…':adding?'Search cards to add…':'Search cards, e.g. lightning bolt'}" value="${esc(state.searchQuery)}" autocomplete="off">
      <div id="searchSpin" class="spin hidden"></div>
    </div>`;
  if(!state.searchQuery.trim()){
    h += picking
      ? `<div class="empty"><div class="big">👑</div><div class="t">Find your commander</div><div class="tiny">Search a legendary creature's name — only cards that can be commanders will show.</div></div>`
      : `<div class="empty"><div class="big">🔍</div><div class="t">Search Scryfall</div>
      <div class="tiny">Try a name, or <b>t:dragon</b>, <b>c:rg</b>, <b>cmc=3</b>.<br>Powered by the Scryfall API.</div></div>`;
  } else if(!state.searchResults.length){
    h += `<div class="empty"><div class="big">🤔</div><div class="t">No results</div><div class="tiny">Check spelling or try a broader query.</div></div>`;
  } else {
    const allowedCI = adding ? commanderIdentity(adding) : null;
    state.searchResults.forEach(c=>{
      const owned = state.collection[c.id]||0;
      const inDeck = adding ? (adding.cards[c.id]||0) : 0;
      const off = allowedCI && !withinIdentity(c.color_identity||[], allowedCI);
      h += `<div class="cardrow"${off?' style="opacity:.55"':''}>
        <div class="thumb" style="background-image:url('${(c.image_uris&&c.image_uris.small)||((c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.small))||''}')" onclick="showCardObj(${esc(JSON.stringify(c.id))})"></div>
        <div class="info">
          <div class="nm">${esc(c.name)} ${pips(c.colors&&c.colors.length?c.colors:(c.color_identity||[]))}</div>
          <div class="meta">${esc(shortType(c.type_line))} · ${(c.set||'').toUpperCase()}${off?` · <span style="color:var(--danger)">off-color</span>`:inDeck?` · <span style="color:var(--accent2)">${inDeck} in deck</span>`:owned?` · <span style="color:var(--ok)">${owned} owned</span>`:''}${bannedBadge(c)}</div>
        </div>
        <button class="btn ${off?'':'gold'} sm" onclick="${picking?`setCommander('${picking.id}','${c.id}')`:adding?`addToDeckDirect('${adding.id}','${c.id}')`:`addMenu('${c.id}')`}">${picking?'Set':adding?(off?'✕':'＋'):'Add'}</button>
      </div>`;
    });
  }
  main.innerHTML = h;
  const inp = $('#searchInput');
  if(inp){
    inp.oninput = e=>{
      state.searchQuery = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(()=>scrySearch(e.target.value), 280);
    };
    // cache the result objects so addMenu/showCardObj can find them
    state._resultMap = {}; state.searchResults.forEach(c=>state._resultMap[c.id]=c);
  }
}

// ---------- COLLECTION ----------
function setCollFilter(key,val){
  state.collFilter[key]=val; renderCollection();
  if(key==='q'){ const i=$('#collQ'); if(i){ i.focus(); const v=i.value; i.value=''; i.value=v; } }
}
function clearCollFilter(){ state.collFilter={q:'',type:'',color:'',cmc:'',rarity:''}; renderCollection(); }
function renderCollection(){
  const f=state.collFilter;
  const ids = Object.keys(state.collection).filter(id=>state.collection[id]>0);
  let totalCards=0, totalVal=0; const unique=ids.length;
  ids.forEach(id=>{ totalCards+=state.collection[id]; const p=card(id)?.price; if(p) totalVal+=parseFloat(p)*state.collection[id]; });
  const fq=f.q.toLowerCase().trim();
  let shown = ids.filter(id=>{
    const c=card(id); if(!c) return false;
    if(fq && !c.name.toLowerCase().includes(fq)) return false;
    if(f.type && !new RegExp('\\b'+f.type+'\\b','i').test(c.type_line||'')) return false;
    if(f.color){ const cols=c.colors||[]; if(f.color==='C'){ if(cols.length) return false; } else if(f.color==='M'){ if(cols.length<2) return false; } else if(!cols.includes(f.color)) return false; }
    if(f.cmc!==''){ const cmc=Math.floor(c.cmc||0); if(f.cmc==='7'){ if(cmc<7) return false; } else if(cmc!==+f.cmc) return false; }
    if(f.rarity && (c.rarity||'')!==f.rarity) return false;
    return true;
  });
  shown.sort((a,b)=> (card(a).cmc||0)-(card(b).cmc||0) || card(a).name.localeCompare(card(b).name));

  let h = `<div class="statgrid">
      <div class="stat"><div class="v">${totalCards}</div><div class="l">Total</div></div>
      <div class="stat"><div class="v">${unique}</div><div class="l">Unique</div></div>
      <div class="stat"><div class="v">$${totalVal.toFixed(0)}</div><div class="l">Est. Value</div></div>
    </div>
    <button class="btn gold full" style="margin-bottom:12px" onclick="openScanner()">📷 Scan a card</button>`;
  if(!ids.length){
    h += `<div class="empty"><div class="big">📚</div><div class="t">Empty collection</div>
      <div class="tiny">Add cards you own from the Search tab.</div>
      <button class="btn gold full" style="margin-top:16px" onclick="setTab('search')">🔍 Add cards</button></div>`;
  } else {
    const sel=(key,opts,label)=>`<select class="filt" onchange="setCollFilter('${key}',this.value)"><option value="">${label}</option>${opts.map(([v,t])=>`<option value="${v}" ${f[key]===v?'selected':''}>${t}</option>`).join('')}</select>`;
    const active = f.q||f.type||f.color||f.cmc!==''||f.rarity;
    h += `<div class="filt-bar">
        <input id="collQ" class="filt filt-q" placeholder="Filter by name…" value="${esc(f.q)}" oninput="setCollFilter('q',this.value)" autocomplete="off">
        ${sel('type',[['Creature','Creature'],['Instant','Instant'],['Sorcery','Sorcery'],['Artifact','Artifact'],['Enchantment','Enchantment'],['Planeswalker','Planeswalker'],['Land','Land']],'Type')}
        ${sel('color',[['W','White'],['U','Blue'],['B','Black'],['R','Red'],['G','Green'],['C','Colorless'],['M','Multicolor']],'Color')}
        ${sel('cmc',[['0','CMC 0'],['1','CMC 1'],['2','CMC 2'],['3','CMC 3'],['4','CMC 4'],['5','CMC 5'],['6','CMC 6'],['7','CMC 7+']],'Cost')}
        ${sel('rarity',[['common','Common'],['uncommon','Uncommon'],['rare','Rare'],['mythic','Mythic']],'Rarity')}
        ${active?`<button class="filt filt-clr" onclick="clearCollFilter()">✕ Clear</button>`:''}
      </div>
      <div class="section-title">Owned Cards (${shown.length}${shown.length!==unique?' of '+unique:''})</div>`;
    if(!shown.length) h += `<div class="empty" style="padding:30px 20px"><div class="t">No cards match these filters</div></div>`;
    else shown.forEach(id=>{ h += cardRowHTML(card(id), state.collection[id], `collQty('${id}',-1)`, `collQty('${id}',1)`); });
  }

}

// ---------- ANALYZE ----------
function selectAnalyzeDeck(id){ state.analyzeDeckId=id; render(); const d=state.decks.find(x=>x.id===id); if(d){ enrichGameCards(Object.keys(d.cards).concat(d.commander?[d.commander]:[])); if(!state.analyzeRecs[id]) fetchRecs(d); } }
function closeAnalyze(){ state.analyzeDeckId=null; render(); }
function slugify(name){ return name.toLowerCase().normalize('NFD').replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,'-'); }
async function scryfallFallbackRecs(cmd, have){
  const ci=(cmd.ci&&cmd.ci.length?cmd.ci:cmd.colors)||[];
  const q='legal:commander '+(ci.length?'id<='+ci.join(''):'id:c')+' -t:land -is:commander';
  try{ const r=await fetch('https://api.scryfall.com/cards/search?order=edhrec&q='+encodeURIComponent(q)); if(r.ok){ const d=await r.json(); return (d.data||[]).map(c=>c.name).filter(n=>!have.has(n.toLowerCase())).slice(0,40); } }catch(e){}
  return [];
}
async function fetchRecs(deck){
  const cmd=deck.commander&&card(deck.commander);
  if(!(deck.format==='Commander' && cmd)){ state.analyzeRecs[deck.id]={status:'na'}; if(state.analyzeDeckId===deck.id) renderAnalyze(); return; }
  state.analyzeRecs[deck.id]={status:'loading'}; if(state.analyzeDeckId===deck.id) renderAnalyze();
  const have=new Set([cmd.name.toLowerCase()]);
  for(const id in deck.cards){ const c=card(id); if(c) have.add(c.name.toLowerCase()); }
  let names=[];
  try{
    const r=await fetch('https://json.edhrec.com/pages/commanders/'+slugify(cmd.name)+'.json');
    if(r.ok){ const d=await r.json(); const cls=((d.container&&d.container.json_dict&&d.container.json_dict.cardlists)||d.cardlists||[]).slice();
      const pri=hd=>{ hd=(hd||'').toLowerCase(); if(hd.includes('top cards')) return 0; if(hd.includes('high synergy')||hd.includes('signature')) return 1; if(hd.includes('new')) return 9; return 5; };
      cls.sort((a,b)=>pri(a.header)-pri(b.header));
      cls.forEach(cl=>{ (cl.cardviews||cl.cardlist||[]).forEach(cv=>{ if(cv&&cv.name) names.push(cv.name); }); }); }
  }catch(e){}
  const seen=new Set();
  names=names.filter(n=>{ const k=n.toLowerCase(); if(seen.has(k)||have.has(k)) return false; seen.add(k); return true; });
  if(!names.length) names=await scryfallFallbackRecs(cmd, have);
  const {found}=await scryCollection(names.slice(0,45));
  const byNorm={}; found.forEach(c=>{ byNorm[c.name.toLowerCase()]=c; });
  const cards=names.map(n=>byNorm[n.toLowerCase()]).filter(Boolean).slice(0,24);
  state.analyzeRecs[deck.id]={status:'ok', cards};
  if(state.analyzeDeckId===deck.id) renderAnalyze();
}
function renderAnalyze(){
  const decks=state.decks;
  if(!state.analyzeDeckId || !decks.find(d=>d.id===state.analyzeDeckId)){
    let h=`<div class="section-title">Analyze a deck</div>`;
    if(!decks.length) h+=`<div class="empty"><div class="big">📊</div><div class="t">No decks to analyze</div><div class="tiny">Build or import a deck first.</div></div>`;
    else decks.forEach(d=>{ const cmd=d.commander&&card(d.commander); h+=`<div class="decktile" onclick="selectAnalyzeDeck('${d.id}')"><div class="col"><div class="dn">${esc(d.name)}</div><div class="ds">${cmd?'👑 '+esc(cmd.name):(d.format||'Casual')} · ${deckCardCount(d)} cards</div></div><div style="font-size:20px;color:var(--muted)">📊</div></div>`; });
    main.innerHTML=h; return;
  }
  const d=decks.find(x=>x.id===state.analyzeDeckId);
  const cmd=d.commander&&card(d.commander);
  const n=deckCardCount(d); const {counts,total}=deckColorCounts(d);
  const buckets=[0,0,0,0,0,0,0,0]; let lands=0, avgNum=0, avgDen=0;
  for(const id in d.cards){ const c=card(id); if(!c) continue; const q=d.cards[id]; if(/\bLand\b/.test(c.type_line||'')){ lands+=q; continue; } const b=Math.min(7,Math.floor(c.cmc||0)); buckets[b]+=q; avgNum+=(c.cmc||0)*q; avgDen+=q; }
  const maxB=Math.max(1,...buckets); const avg=avgDen?(avgNum/avgDen).toFixed(2):'0.00';
  const groups=groupDeckCards(d);
  const isCmd=d.format==='Commander';
  const notes=[];
  if(isCmd && n<100) notes.push('⚠️ '+(100-n)+' cards short of 100.');
  if(lands < (isCmd?34:22)) notes.push('⚠️ Light on lands ('+lands+'). Typical: '+(isCmd?'36–38':'~24')+'.');
  else if(lands > (isCmd?42:28)) notes.push('ℹ️ High land count ('+lands+').');
  if(avgDen && +avg>3.8) notes.push('ℹ️ High average mana value ('+avg+') — the deck may play slowly.');
  if(!notes.length) notes.push('✓ Land count and curve look reasonable.');
  // function categories → strengths / weaknesses
  const catCount={ramp:0,draw:0,removal:0,wipe:0,counter:0};
  for(const id in d.cards){ const c=card(id); if(!c) continue; cardCategories(c).forEach(cat=>{ if(catCount[cat]!=null) catCount[cat]+=d.cards[id]; }); }
  const targets={ramp:[8,'Ramp / acceleration'], draw:[8,'Card draw'], removal:[6,'Targeted removal'], wipe:[2,'Board wipes']};
  const strengths=[], weaknesses=[], weakKeys=[];
  Object.keys(targets).forEach(k=>{ const need=targets[k][0], label=targets[k][1], v=catCount[k]; if(v>=need) strengths.push(label+' ('+v+')'); else { weaknesses.push(label+' — only '+v+' (aim ~'+need+')'); weakKeys.push(k); } });
  if(catCount.counter>=4) strengths.push('Counterspells ('+catCount.counter+')');
  if(lands>=(isCmd?34:22) && lands<=(isCmd?42:28)) strengths.push('Solid mana base ('+lands+' lands)');
  else if(lands<(isCmd?34:22)) weaknesses.push('Mana base — '+lands+' lands (aim '+(isCmd?'36–38':'~24')+')');
  if(avgDen && +avg<=3.2) strengths.push('Low, efficient curve (avg MV '+avg+')');
  else if(avgDen && +avg>3.8) weaknesses.push('High curve (avg MV '+avg+') — may be slow');

  let h=`<div class="detail-head"><button class="back" onclick="closeAnalyze()">‹</button><div class="ttl">${esc(d.name)}</div></div>
    <div class="statgrid"><div class="stat"><div class="v">${n}</div><div class="l">Cards</div></div><div class="stat"><div class="v">${lands}</div><div class="l">Lands</div></div><div class="stat"><div class="v">${avg}</div><div class="l">Avg MV</div></div></div>`;
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">Card Types</div><div class="row" style="flex-wrap:wrap;gap:12px">${groups.map(g=>`<span class="tiny muted">${g.name}: <b style="color:var(--text)">${g.count}</b></span>`).join('')||'<span class="tiny muted">No cards yet</span>'}</div></div>`;
  if(total){ h+=`<div class="panel"><div class="section-title" style="margin-top:0">Colors</div><div class="row" style="flex-wrap:wrap;gap:10px">`; Object.keys(counts).filter(k=>counts[k]).forEach(k=>{ h+=`<div class="row" style="gap:5px">${pips([k])}<span class="tiny muted">${COLOR_NAMES[k]} ${counts[k]}</span></div>`; }); h+=`</div></div>`; }
  if(avgDen){ h+=`<div class="panel"><div class="section-title" style="margin-top:0">Mana Curve (nonland)</div><div class="curve">`; buckets.forEach((cnt,i)=>{ h+=`<div class="bar"><span class="cnt">${cnt||''}</span><div class="fill" style="height:${cnt/maxB*100}%"></div><span class="lbl">${i===7?'7+':i}</span></div>`; }); h+=`</div></div>`; }
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">Deck Health</div>${notes.map(x=>`<div class="tiny" style="margin-bottom:5px">${x}</div>`).join('')}</div>`;
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">💪 Biggest Strengths</div>${strengths.length?strengths.map(s=>`<div class="tiny" style="margin-bottom:5px;color:var(--ok)">✓ ${esc(s)}</div>`).join(''):'<div class="tiny muted">Add more cards to surface strengths.</div>'}</div>`;
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">⚠️ Biggest Weaknesses</div>${weaknesses.length?weaknesses.map(s=>`<div class="tiny" style="margin-bottom:5px;color:var(--danger)">• ${esc(s)}</div>`).join(''):'<div class="tiny" style="color:var(--ok)">✓ No major gaps detected.</div>'}</div>`;
  // what to add
  const rec=state.analyzeRecs[d.id];
  h+=`<div class="panel"><div class="section-title" style="margin-top:0">What to Add</div>`;
  if(!rec || rec.status==='loading') h+=`<div class="tiny muted"><span class="mini-spin"></span> Finding cards for ${cmd?esc(cmd.name):'this deck'}…</div>`;
  else if(rec.status==='na') h+=`<div class="tiny muted">Set a commander on this deck to get recommendations.</div>`;
  else if(!rec.cards||!rec.cards.length) h+=`<div class="tiny muted">No recommendations found.</div>`;
  else {
    state._resultMap=state._resultMap||{}; rec.cards.forEach(c=>state._resultMap[c.id]=c);
    const withCats=rec.cards.map(c=>({c, fills:cardCategories(c).filter(x=>weakKeys.includes(x))}));
    withCats.sort((a,b)=>(b.fills.length>0)-(a.fills.length>0));
    h+=`<div class="tiny muted" style="margin-bottom:8px">Popular cards for ${esc(cmd.name)} (via EDHREC) — ones that fix a weakness are first. Tap ＋ to add.</div>`;
    withCats.forEach(({c,fills})=>{ const inDeck=d.cards[c.id]||0; const thumb=(c.image_uris&&c.image_uris.small)||((c.card_faces&&c.card_faces[0].image_uris&&c.card_faces[0].image_uris.small))||'';
      const tag = inDeck ? ' · <span style="color:var(--accent2)">in deck</span>' : (fills.length?` · <span style="color:var(--accent2)">fixes ${fills.join('/')}</span>`:'');
      h+=`<div class="cardrow"><div class="thumb" style="background-image:url('${thumb}')" onclick="showCardObj(${esc(JSON.stringify(c.id))})"></div><div class="info"><div class="nm">${esc(c.name)}</div><div class="meta">${esc(shortType(c.type_line))}${tag}</div></div><button class="btn gold sm" onclick="addToDeckDirect('${d.id}','${c.id}')">＋</button></div>`; });
  }
  h+=`</div>`;
  main.innerHTML=h;
}

function playOut(i){
  const p=state.play;
  if((p.life[i]||0)<=0) return 'life';
  if(((p.poison&&p.poison[i])||0)>=10) return 'poison';
  if((p.cmd[i]||[]).some(v=>v>=21)) return 'cmdr';
  return null;
}
function renderPlay(){
  if(state.game) return renderGame();
  const mode=state.play.mode||'life';
  main.innerHTML = `<div class="play-ctrl" style="margin-bottom:14px"><div class="pc-group">
      <button class="pc-btn ${mode==='life'?'on':''}" onclick="setPlayMode('life')">❤ Life</button>

    </div></div>` + (mode==='play' ? deckPickerHTML() : lifeCounterHTML());
}
function setPlayMode(m){ state.play.mode=m; render(); }
function lifeCounterHTML(){

      <div class="pc-group"><span class="pc-lbl">Players</span>${[2,3,4].map(n=>`<button class="pc-btn ${p.count===n?'on':''}" onclick="setPlayers(${n})">${n}</button>`).join('')}</div>

    let ctr=`<div class="ctr poison ${((p.poison&&p.poison[i])||0)>=10?'danger':''}">

      </div>`;
    for(let j=0;j<p.count;j++){
      if(j===i) continue;
      const dmg=(p.cmd[i]&&p.cmd[i][j])||0;
      ctr+=`<div class="ctr cmd ${dmg>=21?'danger':''}" style="--c:${PLAY_COLORS[j]}">
        <span class="ctr-lbl">⚔P${j+1}</span>

      </div>`;
    }
    h+=`<div class="pcard" style="border-color:${col}${out?';opacity:.6':''}">

        <button class="lifebtn big" onclick="life(${i},-1)">−</button>
        <div class="lifeval" style="${v<=0?'color:var(--danger)':''}">${v}</div>
        <button class="lifebtn big" onclick="life(${i},1)">＋</button>
      </div>
      <div class="prow5">
        <button class="lifebtn" onclick="life(${i},-5)">−5</button>

function setPlayers(n){ state.play.count=n; resetLife(); }
function setStart(s){ state.play.start=s; resetLife(); }
function resetLife(){
  const p=state.play, n=p.count;
  p.life=Array.from({length:n},()=>p.start);
  p.poison=Array.from({length:n},()=>0);
  p.cmd=Array.from({length:n},()=>Array.from({length:n},()=>0));
  renderPlay(); publishState();
}
function life(i,d){ state.play.life[i]=(state.play.life[i]||0)+d; renderPlay(); publishState(); }
function poison(i,d){ const a=state.play.poison; a[i]=Math.max(0,(a[i]||0)+d); renderPlay(); publishState(); }
function cmdDmg(i,j,d){
  const p=state.play;
  if(!p.cmd[i]) p.cmd[i]=Array.from({length:p.count},()=>0);
  const cur=p.cmd[i][j]||0, nv=Math.max(0,cur+d), applied=nv-cur;
  p.cmd[i][j]=nv;
  p.life[i]=(p.life[i]||0)-applied; // commander damage is combat damage — also lowers life
  renderPlay(); publishState();
}

// ---------- PLAY: solo Commander playtest ----------
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function deckPickerHTML(){
  const decks=state.decks.filter(d=>d.format==='Commander');
  if(!decks.length) return `<div class="empty"><div class="big">▶</div><div class="t">No Commander decks yet</div><div class="tiny">Create or import a Commander deck, then play it here.</div></div>`;
  let h=`<div class="section-title">Choose a Commander deck to play</div>`;
  decks.forEach(d=>{
    const cmd=d.commander&&card(d.commander);
    h+=`<div class="decktile" onclick="startGame('${d.id}')"><div class="col">
      <div class="dn">${esc(d.name)}</div>
      <div class="ds">${cmd?'👑 '+esc(cmd.name):'No commander set'} · ${deckCardCount(d)} cards</div>
    </div><div style="font-size:20px;color:var(--muted)">▶</div></div>`;
  });
  return h;
}
function startGame(deckId){
  const d=state.decks.find(x=>x.id===deckId); if(!d) return;
  const lib=[];
  for(const cid in d.cards){ for(let k=0;k<d.cards[cid];k++) lib.push({iid:uid(),cardId:cid}); }
  shuffle(lib);
  state.game={ deckId, deckName:d.name, commanderId:d.commander||null, turn:1, life:40,
    library:lib, hand:[], battlefield:[], graveyard:[], exile:[],
    command:d.commander?[{iid:uid(),cardId:d.commander}]:[], cmdTax:0, mulligans:0,
    landsThisTurn:0, landLimit:1, phase:3, pool:emptyPool(), oppLife:40 };
  for(let i=0;i<7;i++) gameDraw();
  render();
  enrichGameCards(Object.keys(d.cards).concat(d.commander?[d.commander]:[]));
}
async function enrichGameCards(ids){
  const missing=[...new Set(ids)].filter(id=>state.cards[id] && (state.cards[id].text===undefined || state.cards[id].power===undefined || state.cards[id].legal===undefined));
  if(!missing.length) return;
  for(let i=0;i<missing.length;i+=75){
    const chunk=missing.slice(i,i+75);
    try{
      const r=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiers:chunk.map(id=>({id}))})});
      const d=await r.json();
      (d.data||[]).forEach(c=>{ const e=state.cards[c.id]; if(e){ e.produced=c.produced_mana||e.produced||[]; e.text=oracleText(c); e.power=(c.power!=null?c.power:(c.card_faces&&c.card_faces[0]&&c.card_faces[0].power))||null; e.legal=c.legalities||e.legal||{}; } });
    }catch(e){}
  }
  DB.save(); render();
}
function cardCategories(c){
  const t=((c.text!=null?c.text:c.oracle_text)||'').toLowerCase();
  const tl=(c.type_line||'').toLowerCase();
  const cats=[];
  if(/\bland\b/.test(tl)){ cats.push('land'); return cats; }
  if(/\{t\}: add|add \{|search your library for [^.]*\bland|create (a|one|two|three|x)[^.]{0,18}treasure/.test(t)) cats.push('ramp');
  if(/draw [^.]{0,18}card/.test(t)) cats.push('draw');
  if(/counter target (spell|ability)/.test(t)) cats.push('counter');
  if(/(destroy|exile) all |all creatures get -|deals? \d+ damage to each|sacrifices? (a|all|that many)/.test(t)) cats.push('wipe');
  else if(/(destroy|exile) target (creature|permanent|artifact|enchantment|planeswalker|nonland)|deals? \d+ damage to (any target|target creature|target planeswalker)|fight target/.test(t)) cats.push('removal');
  return cats;
}
function hasUntapEnabler(){ return state.game.battlefield.some(c=>{ const cd=card(c.cardId); return cd && /untap/i.test(cd.text||''); }); }
function hasReturnEnabler(){ return state.game.battlefield.some(c=>{ const cd=card(c.cardId); return cd && /(return[^.]{0,80}hand|to (its|their) owner'?s hand|to your hand|to (its|their) hand)/i.test(cd.text||''); }); }
function hasLandEnabler(){ return state.game.battlefield.some(c=>{ const cd=card(c.cardId); return cd && /additional land/i.test(cd.text||''); }); }
function hasDrawEnabler(){ return state.game.battlefield.some(c=>{ const cd=card(c.cardId); return cd && /draw [^.]{0,18}card/i.test(cd.text||''); }); }
function classifyAbility(ab){
  if(/^(When|Whenever|At )/i.test(ab)) return 'triggered';
  const ci=ab.indexOf(':');
  if(ci>0 && ci<40) return 'activated';
  return 'static';
}
function bannedBadge(obj){
  const L=obj&&(obj.legalities||obj.legal); if(!L) return '';
  const out=[];
  [['commander','Commander'],['modern','Modern'],['legacy','Legacy'],['vintage','Vintage'],['pioneer','Pioneer'],['standard','Standard'],['pauper','Pauper']].forEach(([k,lab])=>{
    if(L[k]==='banned') out.push('⛔ '+lab);
    else if(L[k]==='restricted') out.push('① '+lab+' (restricted)');
  });
  return out.length ? `<span style="color:var(--danger)"> · ${out.join(', ')}</span>` : '';
}
function gameUntapInfo(){ toast('Stays tapped until your untap step — play a card with an untap ability to untap it sooner'); }
function gameDraw(){ const g=state.game; if(g.library.length){ g.hand.push(g.library.shift()); return true; } return false; }
function gameDrawBtn(){ if(!hasDrawEnabler()){ toast('You only draw on your draw step — play a card that draws to draw more'); return; } if(!gameDraw()) toast('Library is empty!'); render(); }
const PHASES=['Untap','Upkeep','Draw','Main 1','Combat','End'];
const MANA_COLORS=['W','U','B','R','G','C'];
function emptyPool(){ return {W:0,U:0,B:0,R:0,G:0,C:0}; }
function gameNextTurn(){ const g=state.game; g.turn++; g.phase=3; g.battlefield.forEach(c=>c.tapped=false); g.landsThisTurn=0; g.pool=emptyPool(); const drew=gameDraw(); toast(drew?'Turn '+g.turn+' · drew a card':'Turn '+g.turn+' · library empty!'); render(); }
function gameNextPhase(){
  const g=state.game; let p=(g.phase==null?3:g.phase)+1;
  if(p>=PHASES.length){ p=0; g.turn++; }
  g.phase=p;
  if(PHASES[p]==='Untap'){ g.battlefield.forEach(c=>c.tapped=false); g.landsThisTurn=0; g.pool=emptyPool(); toast('Turn '+g.turn+' · untap — mana refreshed'); }
  else if(PHASES[p]==='Draw'){ const d=gameDraw(); toast(d?'Draw step · drew a card':'Draw step · library empty!'); }
  else toast(PHASES[p]);
  render();
}
// --- mana ---
function addMana(color,n){ const g=state.game; g.pool[color]=(g.pool[color]||0)+(n||1); render(); }
function clearPool(){ state.game.pool=emptyPool(); render(); }
function tapForMana(iid){
  const g=state.game, c=g.battlefield.find(x=>x.iid===iid); if(!c||c.tapped) return;
  const cd=card(c.cardId);
  let prod=(cd&&cd.produced&&cd.produced.length)?cd.produced.slice():((cd&&cd.colors&&cd.colors.length)?cd.colors.slice():['C']);
  const uniq=[...new Set(prod.map(m=>MANA_COLORS.includes(m)?m:'C'))];
  if(uniq.length<=1){ tapAddMana(iid, uniq[0]||'C'); return; }
  modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Tap for which mana?</h3><div class="addmenu">${uniq.map(m=>`<button class="btn full" onclick="tapAddMana('${iid}','${m}')">${m}</button>`).join('')}<button class="btn ghost full" onclick="closeModal()">Cancel</button></div></div></div>`;
}
function tapAddMana(iid, color){
  const g=state.game, c=g.battlefield.find(x=>x.iid===iid); if(!c) return;
  c.tapped=true; g.pool[color]=(g.pool[color]||0)+1;
  closeModal(); render();
}
function tapUses(iid){
  const g=state.game, c=g.battlefield.find(x=>x.iid===iid); if(!c) return [];
  const cd=card(c.cardId), uses=[];
  const pw=creaturePower(cd)+(c.counters||0);
  if(cd && /\bCreature\b/.test(cd.type_line||'') && pw>0) uses.push({kind:'attack',idx:null,label:'⚔️ Attack — deal '+pw});
  if(cd && (/\bLand\b/.test(cd.type_line||'') || (cd.produced&&cd.produced.length))) uses.push({kind:'mana',idx:null,label:'🔵 Tap for mana'});
  ((cd&&cd.text)||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach((ab,i)=>{ const ci=ab.indexOf(':'); if(ci>0&&ci<40 && /\{T\}/.test(ab.slice(0,ci))) uses.push({kind:'ab',idx:i,label:'⚡ '+(ab.length>46?ab.slice(0,46)+'…':ab)}); });
  return uses;
}
function tapCard(iid){
  const g=state.game, c=g.battlefield.find(x=>x.iid===iid); if(!c||c.tapped){ closeModal(); return; }
  const uses=tapUses(iid);
  if(uses.length<=1){ tapDo(iid, uses[0]?uses[0].kind:'tap', uses[0]?uses[0].idx:null); return; }
  modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Tap for…</h3><div class="addmenu">${uses.map(u=>`<button class="btn full" onclick="tapDo('${iid}','${u.kind}',${u.idx==null?'null':u.idx})">${u.label}</button>`).join('')}<button class="btn ghost full" onclick="closeModal()">Cancel</button></div></div></div>`;
}
function tapDo(iid, kind, idx){
  const g=state.game, c=g.battlefield.find(x=>x.iid===iid); if(!c){ closeModal(); return; }
  if(kind==='mana'){ tapForMana(iid); return; }
  c.tapped=true;
  if(kind==='attack'){ const pw=creaturePower(card(c.cardId))+(c.counters||0); g.oppLife=(g.oppLife||0)-pw; if(g.oppLife<=0){ g.oppLife=0; toast('🏆 Hit for '+pw+' — opponent defeated!'); } else toast('⚔️ Attacked for '+pw); }
  else if(kind==='ab'){ const cd=card(c.cardId); const ab=(((cd&&cd.text)||'').split('\n').map(s=>s.trim()).filter(Boolean))[idx]||''; if(/draw [^.]{0,18}card/i.test(ab)){ gameDraw(); toast('⚡ '+(ab.length>34?ab.slice(0,34)+'…':ab)+' — drew'); } else toast('⚡ Used: '+(ab.length>44?ab.slice(0,44)+'…':ab)); }
  else toast('Tapped');
  closeModal(); render();
}
function addCounter(iid,n){ const g=state.game, c=g.battlefield.find(x=>x.iid===iid); if(!c) return; c.counters=Math.max(0,(c.counters||0)+n); render(); gameCardMenu(iid,'battlefield'); }
function parseCost(mc){
  const need={generic:0,W:0,U:0,B:0,R:0,G:0,C:0};
  ((mc&&mc.match(/\{[^}]+\}/g))||[]).forEach(sym=>{
    const s=sym.slice(1,-1);
    if(/^\d+$/.test(s)) need.generic+=parseInt(s,10);
    else if(s==='X') {}
    else if(/^[WUBRGC]$/.test(s)) need[s]++;
    else if(s.indexOf('/')>=0){ const col=s.split('/').find(p=>/^[WUBRGC]$/.test(p)); if(col) need[col]++; else need.generic++; }
    else need.generic++;
  });
  return need;
}
function canPay(need){ const p={...state.game.pool}; for(const c of MANA_COLORS){ if((p[c]||0)<need[c]) return false; p[c]-=need[c]; } return MANA_COLORS.reduce((s,c)=>s+(p[c]||0),0)>=need.generic; }
function payCost(need){ const p=state.game.pool; for(const c of MANA_COLORS) p[c]-=need[c]; let gen=need.generic; for(const c of ['C','W','U','B','R','G']){ while(gen>0&&p[c]>0){ p[c]--; gen--; } } }
function castFromHand(iid, ignoreMana){
  const g=state.game, c=g.hand.find(x=>x.iid===iid); if(!c) return;
  const cd=card(c.cardId);
  if(cd && /\bLand\b/.test(cd.type_line||'')) { gameMove(iid,'hand','battlefield'); return; }
  if(!ignoreMana){
    const need=parseCost(cd&&cd.mana_cost);
    if(!canPay(need)){ toast('Not enough mana for '+(cd?cd.name:'that')+' — tap lands first'); closeModal(); return; }
    payCost(need);
  }
  const idx=g.hand.findIndex(x=>x.iid===iid); const moved=g.hand.splice(idx,1)[0]; moved.tapped=false; g.battlefield.push(moved);
  closeModal(); render();
}
function gameLandLimit(d){ const g=state.game; g.landLimit=Math.max(1,(g.landLimit||1)+d); render(); }
function playExtraLand(iid){
  const g=state.game, idx=g.hand.findIndex(x=>x.iid===iid); if(idx<0){ closeModal(); return; }
  const moved=g.hand.splice(idx,1)[0]; moved.tapped=false; g.battlefield.push(moved);
  g.landsThisTurn=(g.landsThisTurn||0)+1; // bypasses the one-per-turn limit (you control an "additional land" card)
  toast('Extra land played'); closeModal(); render();
}
function gameLife(d){ state.game.life+=d; render(); }
function oppDamage(d){ const g=state.game; g.oppLife=(g.oppLife||0)-d; if(g.oppLife<=0){ g.oppLife=0; toast('🏆 Opponent defeated — you win!'); } render(); }
function oppSet(){ const v=window.prompt('Set opponent life (training dummy):','1000'); if(v===null) return; const n=parseInt(v,10); if(!isNaN(n)){ state.game.oppLife=n; render(); } }
function gameShuffle(){ shuffle(state.game.library); toast('Library shuffled'); }
function exitGame(){ if(confirm('Leave this game? Your saved deck is untouched — only this play session is discarded.')){ state.game=null; render(); } }
function gameMulligan(){
  const g=state.game;
  const all=[...g.library,...g.hand,...g.battlefield,...g.graveyard,...g.exile].map(c=>({iid:c.iid,cardId:c.cardId}));
  g.library=shuffle(all); g.hand=[]; g.battlefield=[]; g.graveyard=[]; g.exile=[];
  g.turn=1; g.life=40; g.cmdTax=0; g.mulligans++; g.landsThisTurn=0; g.landLimit=1; g.phase=3; g.pool=emptyPool();
  g.command=g.commanderId?[{iid:uid(),cardId:g.commanderId}]:[];
  const n=Math.max(0, 7 - g.mulligans);
  for(let i=0;i<n;i++) gameDraw();
  toast('Mulligan #'+g.mulligans+' · '+n+' cards'); render();
}
function gameMove(iid,from,to){
  const g=state.game, arr=g[from], idx=arr.findIndex(c=>c.iid===iid); if(idx<0) return;
  if(from==='hand' && to==='battlefield'){
    const cd=card(arr[idx].cardId);
    if(cd && /\bLand\b/.test(cd.type_line||'')){
      if((g.landsThisTurn||0) >= (g.landLimit||1)){ toast('Only '+(g.landLimit||1)+' land per turn — use the 🌍 ＋ or “extra land” if an ability allows'); closeModal(); return; }
      g.landsThisTurn=(g.landsThisTurn||0)+1;
    }
  }
  const c=arr.splice(idx,1)[0];
  if(to==='battlefield'){ c.tapped=false; g.battlefield.push(c); }
  else if(to==='libraryTop'){ delete c.tapped; delete c.counters; g.library.unshift(c); }
  else if(to==='libraryBottom'){ delete c.tapped; delete c.counters; g.library.push(c); }
  else { delete c.tapped; delete c.counters; g[to].push(c); }
  closeModal(); render();
}
function creaturePower(cd){ const p=parseInt(cd&&cd.power,10); return isNaN(p)?0:Math.max(0,p); }
function useAbility(iid, zone, idx){
  const g=state.game, c=g[zone]&&g[zone].find(x=>x.iid===iid); if(!c){ closeModal(); return; }
  const cd=card(c.cardId), lines=((cd&&cd.text)||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const ab=lines[idx]||''; if(!ab){ closeModal(); return; }
  const trig=/^(When|Whenever|At )/i.test(ab);
  const cost=ab.split(':')[0]||'';
  if(zone==='battlefield' && /\{T\}/.test(cost) && !c.tapped) c.tapped=true; // pay the tap cost
  toast((trig?'⚡ Triggered: ':'⚡ Used: ')+(ab.length>44?ab.slice(0,44)+'…':ab));
  closeModal(); render();
}
function gameTap(iid){
  const g=state.game, c=g.battlefield.find(x=>x.iid===iid); if(!c){ closeModal(); return; }
  if(c.tapped){ c.tapped=false; toast('Untapped (ability)'); closeModal(); render(); return; }
  c.tapped=true;
  const cd=card(c.cardId);
  if(cd && /\bCreature\b/.test(cd.type_line||'')){
    const pw=creaturePower(cd);
    if(pw>0){ g.oppLife=(g.oppLife||0)-pw; if(g.oppLife<=0){ g.oppLife=0; toast('🏆 Hit for '+pw+' — opponent defeated!'); } else toast('⚔️ Attacked for '+pw); }
    else toast('Tapped (0 power)');
  } else toast('Tapped');
  closeModal(); render();
}
function castCommander(iid, ignoreMana){
  const g=state.game, c=g.command.find(x=>x.iid===iid); if(!c) return;
  const cd=card(c.cardId);
  if(!ignoreMana){
    const need=parseCost(cd&&cd.mana_cost); need.generic+=(g.cmdTax||0);
    if(!canPay(need)){ toast('Not enough mana for commander — '+manaText(cd&&cd.mana_cost||'')+(g.cmdTax?' +{'+g.cmdTax+'} tax':'')); closeModal(); return; }
    payCost(need);
  }
  g.cmdTax=(g.cmdTax||0)+2;
  gameMove(iid,'command','battlefield');
}
function gameCardMenu(iid,zone){
  const g=state.game, c=g[zone].find(x=>x.iid===iid); if(!c) return;
  const cd=card(c.cardId), img=cd?(cd.img||cd.thumb):'';
  const isLand = cd && /\bLand\b/.test(cd.type_line||'');
  const canTapMana = cd && (isLand || (cd.produced&&cd.produced.length));
  let acts=[];
  if(zone==='hand'){
    if(isLand){ acts=[['▶ Play to battlefield',`gameMove('${iid}','hand','battlefield')`]]; if(hasLandEnabler()) acts.push(['🌍 Play as extra land (you control an additional-land card)',`playExtraLand('${iid}')`]); }
    else acts=[['▶ Cast'+(cd&&cd.mana_cost?' · '+manaText(cd.mana_cost):''),`castFromHand('${iid}',false)`]];
    acts.push(['↧ Bottom of library',`gameMove('${iid}','hand','libraryBottom')`]);
    if(g.hand.length>7) acts.push(['⚰ Discard (hand over 7)',`gameMove('${iid}','hand','graveyard')`]);
  }
  else if(zone==='battlefield'){
    acts=[];
    if(!c.tapped) acts.push(['⟳ Tap…',`tapCard('${iid}')`]);
    else if(hasUntapEnabler()) acts.push(['↺ Untap (you control an untap ability)',`gameTap('${iid}')`]);
    else acts.push(['🔒 Stays tapped — no untap card in play',`gameUntapInfo()`]);
    acts.push(['➕ Add +1/+1 counter',`addCounter('${iid}',1)`]);
    if((c.counters||0)>0) acts.push(['➖ Remove counter ('+(c.counters||0)+')',`addCounter('${iid}',-1)`]);
    acts.push(['⚰ To graveyard',`gameMove('${iid}','battlefield','graveyard')`]);
    if(hasReturnEnabler()) acts.push(['↩ Return to hand (you control a return ability)',`gameMove('${iid}','battlefield','hand')`]);
    acts.push(['✦ Exile',`gameMove('${iid}','battlefield','exile')`]);
    if(c.cardId===g.commanderId) acts.push(['👑 To command zone',`gameMove('${iid}','battlefield','command')`]);
  }
  else if(zone==='graveyard'){ acts=[]; if(hasReturnEnabler()) acts.push(['↩ Return to hand',`gameMove('${iid}','graveyard','hand')`]); acts.push(['▶ To battlefield',`gameMove('${iid}','graveyard','battlefield')`],['↥ Top of library',`gameMove('${iid}','graveyard','libraryTop')`],['✦ Exile',`gameMove('${iid}','graveyard','exile')`]); }
  else if(zone==='exile'){ acts=[]; if(hasReturnEnabler()) acts.push(['↩ Return to hand',`gameMove('${iid}','exile','hand')`]); acts.push(['▶ To battlefield',`gameMove('${iid}','exile','battlefield')`]); }
  else if(zone==='command'){ const tax=g.cmdTax||0; acts=[['👑 Cast'+(cd&&cd.mana_cost?' · '+manaText(cd.mana_cost):'')+(tax?' +{'+tax+'}':''),`castCommander('${iid}',false)`]]; }
  const abLines=(cd&&cd.text)?cd.text.split('\n').map(s=>s.trim()).filter(Boolean):[];
  const abilitiesHTML = abLines.length
    ? `<div class="section-title" style="margin:2px 2px 6px">Abilities <span class="tiny muted" style="text-transform:none;letter-spacing:0">· activated: tap the card on the battlefield</span></div>`+abLines.map((ab)=>{
        const cls=classifyAbility(ab);
        const tag=cls==='triggered'?'AUTO · TRIGGER':cls==='static'?'AUTO · PASSIVE':'ACTIVATED';
        return `<div class="abil-info"><span class="abil-tag">${tag}</span><span>${esc(ab)}</span></div>`;
      }).join('')
    : '';
  modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${cd?esc(cd.name):'Card'}</h3>
    ${img?`<img src="${img}" style="width:150px;border-radius:11px;display:block;margin:0 auto 12px">`:''}
    ${cd&&cd.type_line?`<div class="tiny muted" style="text-align:center;margin-bottom:8px">${esc(cd.type_line)}${cd.mana_cost?' · '+manaText(cd.mana_cost):''}${bannedBadge(cd)}</div>`:''}
    ${abilitiesHTML}
    <div class="addmenu">${acts.map(a=>`<button class="btn full" onclick="${a[1]}">${a[0]}</button>`).join('')}
    <button class="btn ghost full" onclick="closeModal()">Cancel</button></div></div></div>`;
}
function gameCardHTML(c,zone){
  const cd=card(c.cardId); const thumb=cd?(cd.thumb||cd.img):'';
  const ctr=(zone==='battlefield'&&c.counters>0)?`<span class="gcard-ctr">+${c.counters}/+${c.counters}</span>`:'';
  return `<div class="gcard${c.tapped?' tapped':''}${thumb?'':' noimg'}" style="background-image:url('${thumb}')" onclick="gameCardMenu('${c.iid}','${zone}')">${thumb?'':`<span class="gcard-lbl">${esc(cd?cd.name:'?')}</span>`}${ctr}</div>`;
}
function createToken(){
  const name=(window.prompt('Token name (e.g. "1/1 Soldier", "Treasure"):','Token')||'').trim();
  if(!name) return;
  const tid='tok-'+uid();
  state.cards[tid]={id:tid,name,mana_cost:'',cmc:0,type_line:'Token',colors:[],img:'',thumb:'',set:'',produced:[],text:''};
  state.game.battlefield.push({iid:uid(),cardId:tid,tapped:false});
  toast('Token created'); render();
}
function renderGame(){
  const g=state.game;
  const zc=(arr,zone)=>arr.map(c=>gameCardHTML(c,zone)).join('')||'<div class="tiny muted" style="padding:6px">— empty —</div>';
  const cmdCard=g.commanderId?card(g.commanderId):null;
  const cmdCI=(cmdCard&&((cmdCard.ci&&cmdCard.ci.length)?cmdCard.ci:cmdCard.colors))||[];
  const showColors=cmdCI.length?[...['W','U','B','R','G'].filter(m=>cmdCI.includes(m)),'C']:MANA_COLORS;
  let h=`<div class="game-top">
      <button class="back" onclick="exitGame()">‹</button>
      <div class="ttl">${esc(g.deckName)}</div>
      <span class="turn-badge">Turn ${g.turn}</span>
    </div>
    <div class="phase-bar">${PHASES.map((ph,i)=>`<span class="ph ${i===(g.phase==null?3:g.phase)?'on':''}">${ph}</span>`).join('')}</div>
    <div class="game-bar">
      <div class="gcount">❤ <button class="iconbtn" onclick="gameLife(-1)">−</button><b style="min-width:28px;text-align:center">${g.life}</b><button class="iconbtn" onclick="gameLife(1)">＋</button></div>
      <button class="btn gold sm" onclick="gameNextPhase()">▶ Next phase</button>
      <button class="btn sm" onclick="gameNextTurn()">⏭ Next turn</button>
      <button class="btn sm" onclick="gameMulligan()">↺ Mulligan</button>
      <div class="gcount">🌍 Lands ${g.landsThisTurn||0}/${g.landLimit||1}</div>
    </div>
    <div class="mana-bar">${showColors.map(m=>`<span class="mana mana-${m}">${m} <b>${(g.pool&&g.pool[m])||0}</b></span>`).join('')}<button class="mana mana-clr" onclick="clearPool()" title="Empty pool">✕</button></div>
    <div class="opp-panel"><div><div class="opp-l">🎯 Training Opponent</div><div class="opp-v ${(g.oppLife||0)<=0?'dead':''}">${g.oppLife||0}</div></div><div class="opp-btns"><button class="btn sm" onclick="oppDamage(1)">−1</button><button class="btn sm" onclick="oppDamage(5)">−5</button><button class="btn sm" onclick="oppDamage(10)">−10</button><button class="btn sm" onclick="oppSet()">Set</button></div></div>`;
  if(g.command.length) h+=`<div class="zone"><div class="zone-h"><span>Command Zone${g.cmdTax?` · tax +${g.cmdTax}`:''}</span></div><div class="zone-cards">${zc(g.command,'command')}</div></div>`;
  h+=`<div class="zone bf"><div class="zone-h"><span>Battlefield (${g.battlefield.length})</span></div><div class="zone-cards">${zc(g.battlefield,'battlefield')}</div></div>`;
  h+=`<div class="zone"><div class="zone-h"><span>Hand (${g.hand.length})</span></div><div class="zone-cards">${zc(g.hand,'hand')}</div></div>`;
  h+=`<div class="game-bar"><div class="gcount">Library <b>${g.library.length}</b><button class="btn sm" onclick="gameDrawBtn()">Draw</button><button class="btn sm" onclick="gameShuffle()">Shuffle</button></div><button class="btn sm" onclick="createToken()">🎲 Token</button></div>`;
  if(g.graveyard.length) h+=`<div class="zone"><div class="zone-h"><span>Graveyard (${g.graveyard.length})</span></div><div class="zone-cards">${zc(g.graveyard,'graveyard')}</div></div>`;
  if(g.exile.length) h+=`<div class="zone"><div class="zone-h"><span>Exile (${g.exile.length})</span></div><div class="zone-cards">${zc(g.exile,'exile')}</div></div>`;
  main.innerHTML=h;
}

// ---------- Remote: shared life counter across devices (MQTT relay) ----------
function loadMqtt(){ if(window.mqtt) return Promise.resolve(); return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://unpkg.com/mqtt/dist/mqtt.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('mqtt load')); document.head.appendChild(s); }); }
function genCode(){ let c=''; const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function roomTopic(code){ return 'planardeckbox/v1/'+code.toUpperCase(); }
async function joinRoom(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if(code.length<4){ toast('Enter a 4-character code'); return; }
  try{ await loadMqtt(); }catch(e){ toast('Could not load sharing'); return; }
  if(state.session){ try{ state.session.client.end(true); }catch(e){} }
  const sender=Math.random().toString(36).slice(2,10);
  const client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'pdbx_'+sender,reconnectPeriod:3000,connectTimeout:9000});
  state.session={code,client,sender,status:'connecting'};
  state.tab='play'; state.play.mode='life';
  showShareModal();
  client.on('connect',()=>{ state.session.status='connected'; client.subscribe(roomTopic(code)); publishState(); if($('#shareBody')) showShareModal(); if(state.tab==='play'&&!state.game) renderPlay(); });
  client.on('message',(t,payload)=>{ try{ const d=JSON.parse(payload.toString()); if(!state.session||d.sender===state.session.sender) return; if(d.play){ state.play=d.play; if(state.tab==='play'&&!state.game) renderPlay(); } }catch(e){} });
  client.on('error',()=>{ if(state.session){ state.session.status='error'; if($('#shareBody')) showShareModal(); } });
  client.on('close',()=>{ if(state.session&&state.session.status==='connected') state.session.status='reconnecting'; });
  client.on('reconnect',()=>{ if(state.session&&state.session.status!=='connected') state.session.status='connecting'; });
}
function publishState(){ const s=state.session; if(s&&s.client&&s.status==='connected'){ try{ s.client.publish(roomTopic(s.code), JSON.stringify({sender:s.sender,play:state.play}), {retain:true}); }catch(e){} } }
function leaveSession(){ const s=state.session; if(s){ try{ s.client.end(true); }catch(e){} } state.session=null; closeModal(); render(); }
function shareUrl(){ return location.origin+location.pathname+'?room='+(state.session?state.session.code:''); }
function openShare(){ showShareModal(); }
function showShareModal(){
  const s=state.session; let inner;
  if(!s){
    inner=`<h3>Remote life counter</h3>
